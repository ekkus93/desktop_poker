name: Fix reconnect stop tests once

on:
  push:
    branches: [master]
    paths: [".github/reconnect-stop-test-fix-once-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Update reconnect tests and clippy annotation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          client = Path("src-tauri/src/networking/runtime/client_connect.rs")
          text = client.read_text(encoding="utf-8")
          signature = "pub(crate) fn reconnect_after_disconnect("
          if "#[allow(clippy::too_many_arguments)]\n" + signature not in text:
              if text.count(signature) != 1:
                  raise SystemExit(f"expected one reconnect function, found {text.count(signature)}")
              text = text.replace(signature, "#[allow(clippy::too_many_arguments)]\n" + signature, 1)
          client.write_text(text, encoding="utf-8")

          tests = Path("src-tauri/src/networking/runtime/tests/reconnect.rs")
          text = tests.read_text(encoding="utf-8")
          old_import = "sync::{atomic::AtomicU64, Arc, Mutex},"
          new_import = "sync::{atomic::{AtomicBool, AtomicU64}, Arc, Mutex},"
          if old_import in text:
              text = text.replace(old_import, new_import, 1)
          elif new_import not in text:
              raise SystemExit("unexpected reconnect test atomic import")

          marker = "    let mut next_counter = 2;"
          occurrences = [i for i in range(len(text)) if text.startswith(marker, i)]
          if len(occurrences) < 2:
              raise SystemExit(f"expected at least two next_counter markers, found {len(occurrences)}")

          # Add a live false stop signal to the two direct reconnect helper tests.
          offset = 0
          for original_index in occurrences[:2]:
              index = original_index + offset
              insertion = marker + "\n    let stop_signal = AtomicBool::new(false);"
              if text[index:index + len(insertion)] != insertion:
                  text = text[:index] + insertion + text[index + len(marker):]
                  offset += len(insertion) - len(marker)

          call_tail = "            &mut next_counter,\n        )"
          replacement = "            &mut next_counter,\n            &stop_signal,\n        )"
          if text.count(call_tail) < 1:
              raise SystemExit("missing scoped reconnect call tail")
          text = text.replace(call_tail, replacement, 1)

          call_tail = "        &mut next_counter,\n    )"
          replacement = "        &mut next_counter,\n        &stop_signal,\n    )"
          if text.count(call_tail) < 1:
              raise SystemExit("missing exhaustion reconnect call tail")
          text = text.replace(call_tail, replacement, 1)

          tests.write_text(text, encoding="utf-8")
          PY
      - name: Format Rust
        run: cargo fmt
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/networking/runtime/client_connect.rs src-tauri/src/networking/runtime/tests/reconnect.rs
          git commit -m "Update reconnect tests for shutdown signal"
          git pull --rebase origin master
          git push origin HEAD:master
