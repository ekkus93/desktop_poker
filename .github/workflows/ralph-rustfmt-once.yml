name: Ralph Rust formatting once

on:
  push:
    branches: [master]
    paths: [".github/ralph-rustfmt-trigger"]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust source and remove this workflow
        run: |
          cargo fmt
          rm -f .github/workflows/ralph-rustfmt-once.yml .github/ralph-rustfmt-trigger
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatter changes were needed."
            exit 0
          fi
          git commit -m "Format runtime hardening changes"
          git pull --rebase origin master
          git push origin HEAD:master
