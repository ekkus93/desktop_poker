name: Patch Debian packaging validation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/patch-deb-validation.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the missing desktop launcher dependency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B deb-packaging-fix origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/runtime-installed-deb-validation.yml")
          lines = path.read_text(encoding="utf-8").splitlines()

          package_indexes = [
              index
              for index, line in enumerate(lines)
              if line.strip().startswith("desktop-file-utils")
          ]
          if package_indexes != [56]:
              raise SystemExit(
                  f"Expected one desktop-file-utils dependency at line index 56; got {package_indexes}"
              )
          package_index = package_indexes[0]
          if not any(line.strip().startswith("libgtk-3-bin") for line in lines):
              lines.insert(package_index + 1, f"            libgtk-3-bin {chr(92)}")

          evidence_line = '          : > "$evidence_dir/metadata.env"'
          try:
              evidence_index = lines.index(evidence_line)
          except ValueError as error:
              raise SystemExit("Debian evidence initialization did not match expected source") from error
          launcher_check = '          command -v gtk-launch | tee "$evidence_dir/gtk-launch-path.txt"'
          if launcher_check not in lines:
              lines.insert(evidence_index + 1, launcher_check)

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          rm .github/workflows/patch-deb-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: install gtk-launch for Debian package validation"
          git pull --rebase origin master
          git push origin HEAD:master

          gh workflow run runtime-installed-deb-validation.yml --ref master
