name: Patch Debian packaging validation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/patch-deb-validation.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the missing desktop launcher dependency
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B deb-packaging-fix origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/runtime-installed-deb-validation.yml")
          text = path.read_text(encoding="utf-8")
          slash = chr(92)

          old_packages = (
              "            desktop-file-utils " + slash + "\n"
              "            wmctrl\n"
          )
          new_packages = (
              "            desktop-file-utils " + slash + "\n"
              "            libgtk-3-bin " + slash + "\n"
              "            wmctrl\n"
          )
          if "libgtk-3-bin" not in text:
              if old_packages not in text:
                  raise SystemExit("Debian dependency block did not match expected source")
              text = text.replace(old_packages, new_packages, 1)

          old_evidence = (
              '          : > "$evidence_dir/steps.tsv"\n'
              '          : > "$evidence_dir/metadata.env"\n'
          )
          new_evidence = old_evidence + (
              '          command -v gtk-launch | tee '
              '"$evidence_dir/gtk-launch-path.txt"\n'
          )
          if "gtk-launch-path.txt" not in text:
              if old_evidence not in text:
                  raise SystemExit("Debian evidence initialization did not match expected source")
              text = text.replace(old_evidence, new_evidence, 1)

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          rm .github/workflows/patch-deb-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: install gtk-launch for Debian package validation"

          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              gh workflow run runtime-installed-deb-validation.yml --ref master
              exit 0
            fi
            sleep 3
          done
          exit 1
