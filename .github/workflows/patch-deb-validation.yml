name: Patch Debian packaging validation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/patch-deb-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add the missing desktop launcher dependency
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B deb-packaging-fix origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/runtime-installed-deb-validation.yml")
          lines = path.read_text(encoding="utf-8").splitlines()
          slash = chr(92)

          package_line = "desktop-file-utils " + slash
          launcher_package = "libgtk-3-bin " + slash
          if not any(line.strip() == launcher_package for line in lines):
              matches = [index for index, line in enumerate(lines) if line.strip() == package_line]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one desktop-file-utils package line; got {matches}")
              index = matches[0]
              lines.insert(index + 1, "            " + launcher_package)

          metadata_line = '          : > "$evidence_dir/metadata.env"'
          launcher_check = (
              '          command -v gtk-launch | tee '
              '"$evidence_dir/gtk-launch-path.txt"'
          )
          if launcher_check not in lines:
              matches = [index for index, line in enumerate(lines) if line == metadata_line]
              if len(matches) != 1:
                  raise SystemExit(f"Expected one metadata initialization line; got {matches}")
              lines.insert(matches[0] + 1, launcher_check)

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

          grep -F 'libgtk-3-bin \' .github/workflows/runtime-installed-deb-validation.yml
          grep -F 'command -v gtk-launch' .github/workflows/runtime-installed-deb-validation.yml
          git diff --check
          rm .github/workflows/patch-deb-validation.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: install gtk-launch for Debian package validation"

          for attempt in 1 2 3 4 5 6; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 3
          done
          exit 1
