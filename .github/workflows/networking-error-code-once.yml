name: Fix networking error constructor once

on:
  push:
    branches: [master]
    paths: [".github/networking-error-code-once-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair NetworkingError constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src-tauri/src/networking/runtime/mod.rs")
          lines = path.read_text(encoding="utf-8").splitlines()

          def find_exact(value, start=0):
              for index, line in enumerate(lines[start:], start):
                  if line.strip() == value:
                      return index
              raise SystemExit(f"missing exact line {value!r}")

          fn_line = find_exact("pub fn new(message: impl Into<String>) -> Self {")
          code_line = find_exact("code: None,", fn_line)
          self_line = find_exact("Self {", fn_line)
          message_line = find_exact("message: message.into(),", fn_line)

          if not code_line < self_line < message_line:
              raise SystemExit(
                  f"unexpected constructor order: code={code_line}, self={self_line}, message={message_line}"
              )

          lines.pop(code_line)
          self_line -= 1
          lines.insert(self_line + 1, "            code: None,")
          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/networking/runtime/mod.rs
          git commit -m "Fix coded networking error constructor"
          git pull --rebase origin master
          git push origin HEAD:master
