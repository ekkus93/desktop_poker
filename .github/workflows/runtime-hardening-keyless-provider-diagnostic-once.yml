name: Runtime hardening keyless provider diagnostic

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-keyless-provider-diagnostic.trigger

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            cmake \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Run non-mutating diagnostic
        id: diagnostic
        shell: bash
        run: |
          set +e
          log=keyless-provider-storage-diagnostic.log
          : > "$log"
          python3 scripts/runtime_hardening_keyless_provider_storage_once.py >>"$log" 2>&1
          apply_status=$?
          if (( apply_status == 0 )); then
            cargo fmt --all >>"$log" 2>&1
            fmt_status=$?
          else
            fmt_status=1
          fi
          if (( apply_status == 0 && fmt_status == 0 )); then
            cargo clippy --workspace --all-targets --all-features -- -D warnings >>"$log" 2>&1
            clippy_status=$?
          else
            clippy_status=1
          fi
          if (( apply_status == 0 && fmt_status == 0 && clippy_status == 0 )); then
            cargo test -p desktop-poker --all-features npc::provider_storage::tests -- --nocapture >>"$log" 2>&1
            test_status=$?
          else
            test_status=1
          fi
          printf '\napply=%s\nfmt=%s\nclippy=%s\ntest=%s\n' \
            "$apply_status" "$fmt_status" "$clippy_status" "$test_status" >>"$log"
          if (( apply_status == 0 && fmt_status == 0 && clippy_status == 0 && test_status == 0 )); then
            echo 'result=success' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failure' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Publish diagnostic and self-clean
        shell: bash
        env:
          DIAGNOSTIC_RESULT: ${{ steps.diagnostic.outputs.result }}
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p docs/runtime-validation
          cp keyless-provider-storage-diagnostic.log \
            docs/runtime-validation/keyless-provider-storage-diagnostic-latest.log
          rm .github/runtime-hardening-keyless-provider-diagnostic.trigger
          rm .github/workflows/runtime-hardening-keyless-provider-diagnostic-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            docs/runtime-validation/keyless-provider-storage-diagnostic-latest.log \
            .github/runtime-hardening-keyless-provider-diagnostic.trigger \
            .github/workflows/runtime-hardening-keyless-provider-diagnostic-once.yml
          git commit -m "docs: record keyless provider storage diagnostic (${DIAGNOSTIC_RESULT}) [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
