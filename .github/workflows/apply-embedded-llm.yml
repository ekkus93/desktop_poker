name: Apply embedded local LLM implementation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-embedded-llm.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-embedded-local-llm
  cancel-in-progress: false

jobs:
  apply:
    name: Apply embedded local LLM
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Reassemble and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.embedded_patch.part.* > /tmp/apply_embedded_llm_changes.py
          python3 -m py_compile /tmp/apply_embedded_llm_changes.py
          python3 /tmp/apply_embedded_llm_changes.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Format sources
        run: |
          cargo fmt
          npm run format

      - name: Resolve Rust lockfile
        run: cargo generate-lockfile

      - name: Remove one-time staging files
        run: |
          rm -f scripts/.embedded_patch.part.*
          rm -f .github/workflows/apply-embedded-llm.yml

      - name: Commit implementation to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add embedded GGUF NPC inference"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "push raced with another master update; retrying ($attempt/8)"
            sleep 3
          done
          echo "failed to push embedded LLM implementation after retries" >&2
          exit 1
