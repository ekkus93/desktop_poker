name: Frontend formatting diagnostics

on:
  push:
    paths:
      - ".github/workflows/frontend-format-diagnostics.yml"

permissions:
  contents: read

jobs:
  proposed-format-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts
      - name: Print exact Prettier repair diff (read-only)
        shell: bash
        run: |
          npx prettier --write \
            src/app/persistence.test.ts \
            src/app/persistence.ts \
            src/screens/HandHistoryScreen.test.tsx \
            src/screens/HandHistoryScreen.tsx \
            src/screens/NpcProfilesScreen.test.tsx \
            src/screens/useLobbySession.test.ts
          printf '%s\n' 'FORMAT_PATCH_BEGIN'
          git -c color.ui=never diff --no-ext-diff --unified=3 -- \
            src/app/persistence.test.ts \
            src/app/persistence.ts \
            src/screens/HandHistoryScreen.test.tsx \
            src/screens/HandHistoryScreen.tsx \
            src/screens/NpcProfilesScreen.test.tsx \
            src/screens/useLobbySession.test.ts
          printf '%s\n' 'FORMAT_PATCH_END'
