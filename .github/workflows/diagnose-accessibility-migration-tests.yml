name: Diagnose accessibility migration verification

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/diagnose-accessibility-migration-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-accessibility-migration-tests
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Execute migration and capture verification failure
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B diagnose-accessibility-verification origin/master
          base_sha=$(git rev-parse HEAD)
          mkdir -p docs/runtime-validation

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/apply-accessibility-migration-v2.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          npm ci"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit("could not locate migration Python heredoc")
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          # Remove the YAML indentation that is not part of the Python source.
          lines = [
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          ]
          Path("/tmp/accessibility-migrate.py").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

          set +e
          {
            echo '=== migration ==='
            python3 /tmp/accessibility-migrate.py
            migration_status=$?
            echo "migration_status=$migration_status"
            if [[ $migration_status -eq 0 ]]; then
              echo '=== npm ci ==='
              npm ci
              echo '=== format ==='
              npm run format
              echo '=== focused tests ==='
              npx vitest run \
                src/components/shared/AccessibleDialog.test.tsx \
                src/components/layout/AppFrameAccessibility.test.tsx \
                src/screens/DeviceSettingsConfirmation.test.tsx \
                src/screens/NpcProfilesIntegrity.test.tsx \
                src/screens/TournamentLobbyAuthoritativeReady.test.tsx
              echo '=== lint ==='
              npm run lint
              echo '=== build ==='
              npm run build
            fi
          } > /tmp/accessibility-verification-full.log 2>&1
          overall_status=$?
          set -e

          {
            echo 'Accessibility migration verification diagnostic'
            echo
            echo "overall_status=$overall_status"
            echo "base_sha=$base_sha"
            echo
            echo '=== last 300 log lines ==='
            tail -n 300 /tmp/accessibility-verification-full.log
          } > /tmp/accessibility-verification-diagnostic.txt

          git reset --hard "$base_sha"
          cp /tmp/accessibility-verification-diagnostic.txt \
            docs/runtime-validation/accessibility-migration-test-diagnostic.txt
          rm .github/workflows/diagnose-accessibility-migration-tests.yml
          cat docs/runtime-validation/accessibility-migration-test-diagnostic.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/runtime-validation/accessibility-migration-test-diagnostic.txt \
            .github/workflows/diagnose-accessibility-migration-tests.yml
          git commit -m "docs: record accessibility verification diagnostic [skip ci]"

          for attempt in $(seq 1 20); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
