name: Ralph phase 9 structured command errors

on:
  push:
    branches: [master]
    paths: [".github/ralph-phase9-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Add typed command errors at the Tauri boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          commands = Path("src-tauri/src/commands.rs")
          text = commands.read_text(encoding="utf-8")
          if "pub struct DesktopCommandError" not in text:
              anchor = '''use crate::{
              app_state::{
                  ClaimLobbySeatRequest, ClientSessionStatus, DebugInspectorState, DesktopAppState,
                  DesktopBootstrapState, DesktopTableActionKind, HostSessionStatus, JoinHostSessionRequest,
                  ScreenDescriptor, SetLobbyReadyStateRequest, StartHostSessionRequest, TableViewSnapshot,
                  TableViewerMode,
              },
              domain::JoinPayload,
              networking::resolve_connectable_host_ip,
              protocol::decode_join_payload,
          };
          '''
              addition = anchor + '''
          #[derive(Clone, Debug, serde::Serialize, PartialEq, Eq)]
          #[serde(rename_all = "camelCase")]
          pub struct DesktopCommandError {
              pub code: String,
              pub message: String,
              pub recoverable: bool,
          }

          impl DesktopCommandError {
              fn from_message(
                  message: String,
                  fallback_code: &'static str,
                  fallback_recoverable: bool,
              ) -> Self {
                  let normalized = message.to_ascii_lowercase();
                  let (code, recoverable) = if normalized.contains("no active") {
                      ("NO_ACTIVE_SESSION", true)
                  } else if normalized.contains("observer mode")
                      || normalized.contains("observer") && normalized.contains("cannot submit")
                  {
                      ("OBSERVER_READ_ONLY", true)
                  } else if normalized.contains("does not own the action window")
                      || normalized.contains("until the local player owns the turn")
                  {
                      ("NOT_ACTING_PLAYER", true)
                  } else if normalized.contains("stale action window")
                      || normalized.contains("no open action window")
                  {
                      ("STALE_ACTION_WINDOW", true)
                  } else if normalized.contains("timed out") || normalized.contains("timeout") {
                      ("NETWORK_TIMEOUT", true)
                  } else if normalized.contains("runtime stopped unexpectedly")
                      || normalized.contains("event channel disconnected")
                      || normalized.contains("disconnected from host")
                  {
                      ("CLIENT_RUNTIME_DISCONNECTED", false)
                  } else if normalized.contains("joinpayload")
                      || normalized.contains("join payload")
                      || normalized.contains("invalid rejection envelope")
                      || normalized.contains("failed to decode")
                  {
                      ("INVALID_JOIN_PAYLOAD", true)
                  } else {
                      (fallback_code, fallback_recoverable)
                  };

                  Self {
                      code: code.to_string(),
                      message,
                      recoverable,
                  }
              }
          }
          '''
              if anchor not in text:
                  raise SystemExit("commands.rs import anchor not found")
              text = text.replace(anchor, addition, 1)

          replacements = [
              (
                  '''pub fn host_start_tournament(
              app: AppHandle,
              state: State<'_, DesktopAppState>,
          ) -> Result<HostSessionStatus, String> {
              let result = state.host_start_tournament()?;''',
                  '''pub fn host_start_tournament(
              app: AppHandle,
              state: State<'_, DesktopAppState>,
          ) -> Result<HostSessionStatus, DesktopCommandError> {
              let result = state.host_start_tournament().map_err(|message| {
                  DesktopCommandError::from_message(message, "HOST_REJECTED_ACTION", true)
              })?;''',
              ),
              (
                  '''pub fn join_host_session(
              app: AppHandle,
              state: State<'_, DesktopAppState>,
              request: JoinHostSessionRequest,
          ) -> Result<ClientSessionStatus, String> {
              let result = state.join_host_session(request)?;''',
                  '''pub fn join_host_session(
              app: AppHandle,
              state: State<'_, DesktopAppState>,
              request: JoinHostSessionRequest,
          ) -> Result<ClientSessionStatus, DesktopCommandError> {
              let result = state.join_host_session(request).map_err(|message| {
                  DesktopCommandError::from_message(message, "INVALID_JOIN_PAYLOAD", true)
              })?;''',
              ),
              (
                  '''pub fn client_claim_lobby_seat(
              app: AppHandle,
              state: State<'_, DesktopAppState>,
              request: ClaimLobbySeatRequest,
          ) -> Result<ClientSessionStatus, String> {
              let result = state.client_claim_lobby_seat(request)?;''',
                  '''pub fn client_claim_lobby_seat(
              app: AppHandle,
              state: State<'_, DesktopAppState>,
              request: ClaimLobbySeatRequest,
          ) -> Result<ClientSessionStatus, DesktopCommandError> {
              let result = state.client_claim_lobby_seat(request).map_err(|message| {
                  DesktopCommandError::from_message(message, "HOST_REJECTED_ACTION", true)
              })?;''',
              ),
              (
                  '''pub fn client_set_lobby_ready_state(
              app: AppHandle,
              state: State<'_, DesktopAppState>,
              request: SetLobbyReadyStateRequest,
          ) -> Result<ClientSessionStatus, String> {
              let result = state.client_set_lobby_ready_state(request)?;''',
                  '''pub fn client_set_lobby_ready_state(
              app: AppHandle,
              state: State<'_, DesktopAppState>,
              request: SetLobbyReadyStateRequest,
          ) -> Result<ClientSessionStatus, DesktopCommandError> {
              let result = state.client_set_lobby_ready_state(request).map_err(|message| {
                  DesktopCommandError::from_message(message, "HOST_REJECTED_ACTION", true)
              })?;''',
              ),
              (
                  ''') -> Result<TableViewSnapshot, String> {
              let result = submit_table_action_inner(
                  viewer_mode,
                  action_kind,
                  raise_to_amount,
                  |next_viewer_mode, next_action_kind, next_raise_to_amount| {
                      state.submit_table_action(next_viewer_mode, next_action_kind, next_raise_to_amount)
                  },
              )?;''',
                  ''') -> Result<TableViewSnapshot, DesktopCommandError> {
              let result = submit_table_action_inner(
                  viewer_mode,
                  action_kind,
                  raise_to_amount,
                  |next_viewer_mode, next_action_kind, next_raise_to_amount| {
                      state.submit_table_action(next_viewer_mode, next_action_kind, next_raise_to_amount)
                  },
              )
              .map_err(|message| {
                  DesktopCommandError::from_message(message, "HOST_REJECTED_ACTION", true)
              })?;''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"commands.rs expected one command block, found {text.count(old)}")
              text = text.replace(old, new, 1)

          if "command_error_classifies_timeout_as_recoverable" not in text:
              text += '''

          #[cfg(test)]
          mod command_error_tests {
              use super::DesktopCommandError;

              #[test]
              fn command_error_classifies_timeout_as_recoverable() {
                  let error = DesktopCommandError::from_message(
                      "table action timed out after 5 seconds".to_string(),
                      "HOST_REJECTED_ACTION",
                      true,
                  );
                  assert_eq!(error.code, "NETWORK_TIMEOUT");
                  assert!(error.recoverable);
              }

              #[test]
              fn command_error_classifies_dead_runtime_as_fatal() {
                  let error = DesktopCommandError::from_message(
                      "Client runtime stopped unexpectedly".to_string(),
                      "HOST_REJECTED_ACTION",
                      true,
                  );
                  assert_eq!(error.code, "CLIENT_RUNTIME_DISCONNECTED");
                  assert!(!error.recoverable);
              }

              #[test]
              fn command_error_serializes_stable_fields() {
                  let error = DesktopCommandError::from_message(
                      "observer mode cannot submit actions".to_string(),
                      "HOST_REJECTED_ACTION",
                      true,
                  );
                  let value = serde_json::to_value(error).expect("command error serializes");
                  assert_eq!(value["code"], "OBSERVER_READ_ONLY");
                  assert_eq!(value["recoverable"], true);
                  assert_eq!(value["message"], "observer mode cannot submit actions");
              }
          }
          '''
          commands.write_text(text, encoding="utf-8")

          desktop = Path("src/api/desktop.ts")
          text = desktop.read_text(encoding="utf-8")
          if "export type DesktopCommandError" not in text:
              anchor = '''function getBrowserMocks() {
            if (!browserMocksAllowedForEnv(import.meta.env)) {
              return undefined;
            }

            if (typeof window === "undefined") {
              return undefined;
            }

            return window.__DESKTOP_POKER_BROWSER_MOCKS__;
          }
          '''
              addition = anchor + '''
          export type DesktopCommandError = {
            code: string;
            message: string;
            recoverable: boolean;
          };

          export class DesktopCommandFailure extends Error {
            readonly code: string;
            readonly recoverable: boolean;

            constructor(error: DesktopCommandError) {
              super(error.message);
              this.name = "DesktopCommandFailure";
              this.code = error.code;
              this.recoverable = error.recoverable;
            }
          }

          export function normalizeDesktopCommandError(
            error: unknown,
          ): DesktopCommandFailure {
            if (
              typeof error === "object" &&
              error !== null &&
              "code" in error &&
              typeof error.code === "string" &&
              "message" in error &&
              typeof error.message === "string" &&
              "recoverable" in error &&
              typeof error.recoverable === "boolean"
            ) {
              return new DesktopCommandFailure({
                code: error.code,
                message: error.message,
                recoverable: error.recoverable,
              });
            }

            const message =
              error instanceof Error
                ? error.message
                : typeof error === "string"
                  ? error
                  : String(error);
            return new DesktopCommandFailure({
              code: "COMMAND_FAILED",
              message,
              recoverable: false,
            });
          }

          function withDesktopCommandError<T>(operation: () => Promise<T>): Promise<T> {
            return operation().catch((error: unknown) => {
              throw normalizeDesktopCommandError(error);
            });
          }
          '''
              if anchor not in text:
                  raise SystemExit("desktop.ts browser mock anchor not found")
              text = text.replace(anchor, addition, 1)

          replacements = [
              (
                  '''export function hostStartTournament() {
            const browserMocks = getBrowserMocks();
            if (browserMocks?.hostStartTournament) {
              return browserMocks.hostStartTournament();
            }

            return invoke<HostSessionStatus>("host_start_tournament");
          }''',
                  '''export function hostStartTournament() {
            const browserMocks = getBrowserMocks();
            return withDesktopCommandError(() =>
              browserMocks?.hostStartTournament
                ? browserMocks.hostStartTournament()
                : invoke<HostSessionStatus>("host_start_tournament"),
            );
          }''',
              ),
              (
                  '''export function joinHostSession(request: JoinHostSessionRequest) {
            const browserMocks = getBrowserMocks();
            if (browserMocks?.joinHostSession) {
              return browserMocks.joinHostSession(request);
            }

            return invoke<ClientSessionStatus>("join_host_session", { request });
          }''',
                  '''export function joinHostSession(request: JoinHostSessionRequest) {
            const browserMocks = getBrowserMocks();
            return withDesktopCommandError(() =>
              browserMocks?.joinHostSession
                ? browserMocks.joinHostSession(request)
                : invoke<ClientSessionStatus>("join_host_session", { request }),
            );
          }''',
              ),
              (
                  '''export function clientClaimLobbySeat(request: ClaimLobbySeatRequest) {
            const browserMocks = getBrowserMocks();
            if (browserMocks?.clientClaimLobbySeat) {
              return browserMocks.clientClaimLobbySeat(request);
            }

            return invoke<ClientSessionStatus>("client_claim_lobby_seat", { request });
          }''',
                  '''export function clientClaimLobbySeat(request: ClaimLobbySeatRequest) {
            const browserMocks = getBrowserMocks();
            return withDesktopCommandError(() =>
              browserMocks?.clientClaimLobbySeat
                ? browserMocks.clientClaimLobbySeat(request)
                : invoke<ClientSessionStatus>("client_claim_lobby_seat", { request }),
            );
          }''',
              ),
              (
                  '''export function clientSetLobbyReadyState(request: SetLobbyReadyStateRequest) {
            const browserMocks = getBrowserMocks();
            if (browserMocks?.clientSetLobbyReadyState) {
              return browserMocks.clientSetLobbyReadyState(request);
            }

            return invoke<ClientSessionStatus>("client_set_lobby_ready_state", {
              request,
            });
          }''',
                  '''export function clientSetLobbyReadyState(request: SetLobbyReadyStateRequest) {
            const browserMocks = getBrowserMocks();
            return withDesktopCommandError(() =>
              browserMocks?.clientSetLobbyReadyState
                ? browserMocks.clientSetLobbyReadyState(request)
                : invoke<ClientSessionStatus>("client_set_lobby_ready_state", {
                    request,
                  }),
            );
          }''',
              ),
              (
                  '''export function submitTableAction(
            viewerMode: TableViewerMode,
            actionKind: DesktopTableActionKind,
            raiseToAmount?: number,
          ) {
            const browserMocks = getBrowserMocks();
            if (browserMocks?.submitTableAction) {
              return browserMocks.submitTableAction(
                viewerMode,
                actionKind,
                raiseToAmount,
              );
            }

            return invoke<TableViewSnapshot>("submit_table_action", {
              viewerMode,
              actionKind,
              raiseToAmount: raiseToAmount ?? null,
            });
          }''',
                  '''export function submitTableAction(
            viewerMode: TableViewerMode,
            actionKind: DesktopTableActionKind,
            raiseToAmount?: number,
          ) {
            const browserMocks = getBrowserMocks();
            return withDesktopCommandError(() =>
              browserMocks?.submitTableAction
                ? browserMocks.submitTableAction(
                    viewerMode,
                    actionKind,
                    raiseToAmount,
                  )
                : invoke<TableViewSnapshot>("submit_table_action", {
                    viewerMode,
                    actionKind,
                    raiseToAmount: raiseToAmount ?? null,
                  }),
            );
          }''',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"desktop.ts expected one wrapper, found {text.count(old)}")
              text = text.replace(old, new, 1)
          desktop.write_text(text, encoding="utf-8")

          tests = Path("src/api/desktop.test.ts")
          text = tests.read_text(encoding="utf-8")
          if "DesktopCommandFailure" not in text.split('from "./desktop";')[0]:
              text = text.replace(
                  "  type DesktopBootstrapState,\n",
                  "  type DesktopBootstrapState,\n  DesktopCommandFailure,\n  normalizeDesktopCommandError,\n",
                  1,
              )
          if "normalizes structured Tauri command errors" not in text:
              marker = 'describe("desktop API bridge", () => {'
              insertion = '''describe("desktop command errors", () => {
            it("normalizes structured Tauri command errors", () => {
              const failure = normalizeDesktopCommandError({
                code: "NETWORK_TIMEOUT",
                message: "host did not acknowledge within 5 seconds",
                recoverable: true,
              });
              expect(failure).toBeInstanceOf(DesktopCommandFailure);
              expect(failure.code).toBe("NETWORK_TIMEOUT");
              expect(failure.message).toContain("5 seconds");
              expect(failure.recoverable).toBe(true);
              expect(String(failure)).toContain("host did not acknowledge");
            });

            it("preserves typed errors rejected by critical invoke wrappers", async () => {
              mockedInvoke.mockRejectedValue({
                code: "OBSERVER_READ_ONLY",
                message: "observer mode cannot submit actions",
                recoverable: true,
              });

              await expect(submitTableAction("observer", "fold")).rejects.toMatchObject({
                code: "OBSERVER_READ_ONLY",
                message: "observer mode cannot submit actions",
                recoverable: true,
              });
            });

            it("wraps legacy string failures without making them look recoverable", async () => {
              mockedInvoke.mockRejectedValue("legacy backend failure");
              await expect(joinHostSession(sampleJoinHostSessionRequest())).rejects.toMatchObject({
                code: "COMMAND_FAILED",
                message: "legacy backend failure",
                recoverable: false,
              });
            });
          });

          '''
              if marker not in text:
                  raise SystemExit("desktop.test.ts describe anchor not found")
              text = text.replace(marker, insertion + marker, 1)
          tests.write_text(text, encoding="utf-8")

          for name in [
              ".github/workflows/ralph-phase9-once.yml",
              ".github/ralph-phase9-trigger",
          ]:
              candidate = Path(name)
              if candidate.exists():
                  candidate.unlink()
          PY

      - name: Format Rust
        run: cargo fmt

      - name: Format frontend
        run: npm ci && npm run format

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add structured desktop command errors"
          git pull --rebase origin master
          git push origin HEAD:master
