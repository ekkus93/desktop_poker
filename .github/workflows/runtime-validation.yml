name: Linux release runtime validation

on:
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "memory.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: runtime-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  release-runtime:
    name: Release runtime validation
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux runtime and WebDriver dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            webkit2gtk-driver \
            xvfb \
            xauth \
            dbus-x11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build release binary without bundling
        id: build
        continue-on-error: true
        run: npm run tauri build -- --no-bundle 2>&1 | tee runtime-validation-build.log

      - name: Inventory release binary
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-validation-evidence
          binary="$PWD/target/release/desktop-poker"
          test -x "$binary"
          file "$binary" | tee runtime-validation-evidence/release-binary.file.txt
          sha256sum "$binary" | tee runtime-validation-evidence/release-binary.sha256

      - name: Run single-instance release smoke
        id: runtime_smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/target/release/desktop-poker"
          export DESKTOP_POKER_BINARY_SHA256="$(sha256sum "$binary" | awk '{print $1}')"

          xvfb-run -a --server-args="-screen 0 1440x960x24" \
            dbus-run-session -- bash -lc '
              set -euo pipefail
              export NO_AT_BRIDGE=1
              export WEBKIT_DISABLE_COMPOSITING_MODE=1
              export GDK_BACKEND=x11
              export DESKTOP_POKER_INSTANCE_ID="runtime-smoke-${GITHUB_RUN_ID}"
              tauri-driver --port 4444 \
                >runtime-validation-evidence/single-tauri-driver.log 2>&1 &
              driver_pid=$!
              trap '\''kill "$driver_pid" 2>/dev/null || true; wait "$driver_pid" 2>/dev/null || true'\'' EXIT
              python3 scripts/runtime_webdriver_smoke.py \
                --application "'"$binary"'" \
                --driver-url http://127.0.0.1:4444 \
                --evidence-dir runtime-validation-evidence
            '

      - name: Run live multi-instance release smoke
        id: runtime_multi
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/target/release/desktop-poker"
          export DESKTOP_POKER_BINARY_SHA256="$(sha256sum "$binary" | awk '{print $1}')"

          xvfb-run -a --server-args="-screen 0 1440x960x24" \
            dbus-run-session -- bash -lc '
              set -euo pipefail
              export NO_AT_BRIDGE=1
              export WEBKIT_DISABLE_COMPOSITING_MODE=1
              export GDK_BACKEND=x11

              DESKTOP_POKER_INSTANCE_ID="runtime-host-${GITHUB_RUN_ID}" \
                tauri-driver --port 4444 \
                >runtime-validation-evidence/host-tauri-driver.log 2>&1 &
              host_driver_pid=$!
              DESKTOP_POKER_INSTANCE_ID="runtime-client-${GITHUB_RUN_ID}" \
                tauri-driver --port 4445 \
                >runtime-validation-evidence/client-tauri-driver.log 2>&1 &
              client_driver_pid=$!
              DESKTOP_POKER_INSTANCE_ID="runtime-conflict-${GITHUB_RUN_ID}" \
                tauri-driver --port 4446 \
                >runtime-validation-evidence/conflict-tauri-driver.log 2>&1 &
              conflict_driver_pid=$!

              cleanup() {
                kill "$conflict_driver_pid" "$client_driver_pid" "$host_driver_pid" 2>/dev/null || true
                wait "$conflict_driver_pid" 2>/dev/null || true
                wait "$client_driver_pid" 2>/dev/null || true
                wait "$host_driver_pid" 2>/dev/null || true
              }
              trap cleanup EXIT

              python3 scripts/runtime_multi_instance_smoke.py \
                --application "'"$binary"'" \
                --host-driver-url http://127.0.0.1:4444 \
                --client-driver-url http://127.0.0.1:4445 \
                --conflict-driver-url http://127.0.0.1:4446 \
                --evidence-dir runtime-validation-evidence
            '

      - name: Inventory runtime evidence
        if: always()
        run: |
          mkdir -p runtime-validation-evidence
          find runtime-validation-evidence -maxdepth 2 -type f -printf '%p %s bytes\n' \
            | sort \
            | tee runtime-validation-evidence/inventory.txt
          for result in \
            runtime-validation-evidence/release-runtime-result.json \
            runtime-validation-evidence/release-multi-instance-result.json; do
            echo "--- $result ---"
            cat "$result" || true
          done
          for log in runtime-validation-evidence/*tauri-driver.log; do
            echo "--- $log ---"
            cat "$log" || true
          done

      - name: Upload runtime validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-runtime-evidence
          path: |
            runtime-validation-build.log
            runtime-validation-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Publish durable runtime result on master
        if: always() && github.ref == 'refs/heads/master'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
          MULTI_OUTCOME: ${{ steps.runtime_multi.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/runtime-validation
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any

          def load_result(path: str, label: str) -> dict[str, Any]:
              source = Path(path)
              if not source.is_file():
                  return {
                      "result": "FAIL",
                      "error": f"{label} result file was not produced.",
                      "steps": [],
                  }
              try:
                  value = json.loads(source.read_text(encoding="utf-8"))
              except (json.JSONDecodeError, OSError) as error:
                  return {
                      "result": "FAIL",
                      "error": f"Could not parse {label} result: {error}",
                      "steps": [],
                  }
              if not isinstance(value, dict):
                  return {
                      "result": "FAIL",
                      "error": f"{label} result was not a JSON object.",
                      "steps": [],
                  }
              return value

          single = load_result(
              "runtime-validation-evidence/release-runtime-result.json",
              "single-instance runtime",
          )
          multi = load_result(
              "runtime-validation-evidence/release-multi-instance-result.json",
              "multi-instance runtime",
          )
          overall = (
              "PASS"
              if single.get("result") == "PASS" and multi.get("result") == "PASS"
              else "FAIL"
          )
          payload: dict[str, Any] = {
              "result": overall,
              "validatedCommit": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "buildOutcome": os.environ.get("BUILD_OUTCOME") or "not-run",
              "singleInstanceOutcome": os.environ.get("SMOKE_OUTCOME") or "not-run",
              "multiInstanceOutcome": os.environ.get("MULTI_OUTCOME") or "not-run",
              "recordedAtUtc": datetime.now(timezone.utc).isoformat(),
              "evidenceArtifact": "linux-release-runtime-evidence",
              "singleInstance": single,
              "multiInstance": multi,
          }
          Path("docs/runtime-validation/latest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          lines = [
              "# Latest Linux Release Runtime Validation",
              "",
              f"- Overall result: **{overall}**",
              f"- Validated commit: `{payload['validatedCommit']}`",
              f"- GitHub Actions run: `{payload['workflowRunId']}`",
              f"- Build outcome: `{payload['buildOutcome']}`",
              f"- Single-instance outcome: `{payload['singleInstanceOutcome']}`",
              f"- Multi-instance outcome: `{payload['multiInstanceOutcome']}`",
              f"- Recorded at: `{payload['recordedAtUtc']}`",
              f"- Evidence artifact: `{payload['evidenceArtifact']}`",
              "",
          ]
          for heading, result in (
              ("Single-instance release smoke", single),
              ("Live multi-instance release smoke", multi),
          ):
              lines.extend([f"## {heading}", "", f"Result: **{result.get('result', 'UNKNOWN')}**", ""])
              if result.get("error"):
                  lines.extend([f"Failure: {result['error']}", ""])
              steps = result.get("steps")
              if isinstance(steps, list):
                  for step in steps:
                      if isinstance(step, dict):
                          lines.append(
                              f"- **{step.get('result', 'UNKNOWN')}** — {step.get('name', 'unnamed check')}"
                          )
                  lines.append("")
          Path("docs/runtime-validation/latest.md").write_text(
              "\n".join(lines), encoding="utf-8"
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime-validation/latest.json docs/runtime-validation/latest.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: record Linux runtime validation result"
            git push origin HEAD:master
          fi

      - name: Enforce runtime validation result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          SMOKE_OUTCOME: ${{ steps.runtime_smoke.outcome }}
          MULTI_OUTCOME: ${{ steps.runtime_multi.outcome }}
        run: |
          test "$BUILD_OUTCOME" = "success"
          test "$SMOKE_OUTCOME" = "success"
          test "$MULTI_OUTCOME" = "success"
