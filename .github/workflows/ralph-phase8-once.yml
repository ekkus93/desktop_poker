name: Ralph phase 8 lobby sync observability

on:
  push:
    branches: [master]
    paths: [".github/ralph-phase8-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Make lobby snapshot failures observable and test them
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          def write(path: str, lines: list[str]) -> None:
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          def find(lines: list[str], needle: str, start: int = 0) -> int:
              for index, line in enumerate(lines[start:], start):
                  if needle in line:
                      return index
              raise SystemExit(f"missing {needle!r}")

          path = "src-tauri/src/networking/runtime/host.rs"
          lines = read(path)
          sync_start = find(lines, "    pub fn sync_snapshots_to_clients(")
          update_start = find(lines, "    fn update_lobby_state(", sync_start)
          replacement = [
              "    pub fn sync_snapshots_to_clients(&self) -> Result<(), NetworkingError> {",
              "        let player_ids = self",
              "            .clients",
              "            .lock()",
              "            .map_err(|_| NetworkingError::new(\"client registry lock poisoned\"))?",
              "            .keys()",
              "            .cloned()",
              "            .collect::<Vec<_>>();",
              "        let mut failed_clients = Vec::new();",
              "",
              "        for player_id in player_ids {",
              "            let snapshot_envelope = build_snapshot_envelope(",
              "                &DefaultCryptoProvider,",
              "                &self.join_payload,",
              "                &self.authoritative_state,",
              "                &self.server_sequence,",
              "                &self.host_signing_keys,",
              "                &self.host_encryption_keys,",
              "                &player_id,",
              "            )?;",
              "",
              "            let write_result = self",
              "                .clients",
              "                .lock()",
              "                .map_err(|_| NetworkingError::new(\"client registry lock poisoned\"))?",
              "                .get(&player_id)",
              "                .map(|client| {",
              "                    client",
              "                        .stream",
              "                        .lock()",
              "                        .map_err(|_| NetworkingError::new(\"client stream lock poisoned\"))?",
              "                        .try_clone()",
              "                        .map_err(|error| {",
              "                            NetworkingError::new(format!(",
              "                                \"failed to clone client stream: {error}\",",
              "                            ))",
              "                        })",
              "                        .and_then(|mut stream| write_json_frame(&mut stream, &snapshot_envelope))",
              "                })",
              "                .unwrap_or_else(|| Err(NetworkingError::new(\"unknown connected client\")));",
              "",
              "            if let Err(error) = write_result {",
              "                failed_clients.push((player_id, error.to_string()));",
              "            }",
              "        }",
              "",
              "        if failed_clients.is_empty() {",
              "            return Ok(());",
              "        }",
              "",
              "        {",
              "            let mut connected_clients = self",
              "                .clients",
              "                .lock()",
              "                .map_err(|_| NetworkingError::new(\"client registry lock poisoned\"))?;",
              "            for (player_id, _) in &failed_clients {",
              "                connected_clients.remove(player_id);",
              "            }",
              "        }",
              "",
              "        let mut recovery_errors = Vec::new();",
              "        for (player_id, _) in &failed_clients {",
              "            if let Err(error) =",
              "                mark_participant_reconnect_eligible(&self.authoritative_state, player_id)",
              "            {",
              "                recovery_errors.push(format!(\"{player_id}: {error}\"));",
              "            }",
              "        }",
              "",
              "        let failed_summary = failed_clients",
              "            .iter()",
              "            .map(|(player_id, error)| format!(\"{player_id}: {error}\"))",
              "            .collect::<Vec<_>>()",
              "            .join(\"; \" );",
              "        let recovery_suffix = if recovery_errors.is_empty() {",
              "            String::new()",
              "        } else {",
              "            format!(",
              "                \"; reconnect eligibility updates also failed: {}\",",
              "                recovery_errors.join(\"; \"),",
              "            )",
              "        };",
              "",
              "        Err(NetworkingError::new(format!(",
              "            \"snapshot sync failed for connected clients: {failed_summary}{recovery_suffix}\",",
              "        )))",
              "    }",
              "",
          ]
          lines[sync_start:update_start] = replacement
          write(path, lines)

          path = "src-tauri/src/networking/runtime/tests/tournament.rs"
          lines = read(path)
          import_start = find(lines, "use std::{")
          net_line = find(lines, "    collections::BTreeMap,", import_start)
          if not any("net::{Shutdown" in line for line in lines[:15]):
              lines.insert(net_line + 1, "    net::{Shutdown, TcpListener, TcpStream},")

          if not any("lobby_snapshot_write_failure_is_nonfatal_visible_and_recoverable" in line for line in lines):
              insertion = find(lines, "#[test]", 15)
              test = [
                  "#[test]",
                  "fn lobby_snapshot_write_failure_is_nonfatal_visible_and_recoverable() {",
                  "    let provider = DefaultCryptoProvider;",
                  "    let host = bind_test_host(&provider, \"table-lobby-sync-failure\", 92);",
                  "    let player_id = \"player-sync-failure\";",
                  "",
                  "    host.register_npc_participant(player_id, \"Sync Failure\")",
                  "        .expect(\"participant registration succeeds\");",
                  "",
                  "    let listener = TcpListener::bind(\"127.0.0.1:0\").expect(\"test listener\");",
                  "    let address = listener.local_addr().expect(\"test listener address\");",
                  "    let connector = thread::spawn(move || TcpStream::connect(address).expect(\"connect pair\"));",
                  "    let (server_stream, _) = listener.accept().expect(\"accept pair\");",
                  "    let peer_stream = connector.join().expect(\"connector joins\");",
                  "    peer_stream.shutdown(Shutdown::Both).expect(\"close peer\");",
                  "    server_stream",
                  "        .shutdown(Shutdown::Both)",
                  "        .expect(\"close host-side stream before insertion\");",
                  "",
                  "    let encryption_public_key = host",
                  "        .authoritative_state()",
                  "        .expect(\"state before failure\")",
                  "        .participants",
                  "        .get(player_id)",
                  "        .expect(\"registered participant\")",
                  "        .identity",
                  "        .encryption_public_key",
                  "        .clone();",
                  "    host.clients.lock().expect(\"client registry\").insert(",
                  "        player_id.to_string(),",
                  "        ConnectedClient {",
                  "            stream: Arc::new(Mutex::new(server_stream)),",
                  "            encryption_public_key,",
                  "        },",
                  "    );",
                  "",
                  "    let before_health = host.runtime_health();",
                  "    host.claim_seat(player_id, 0)",
                  "        .expect(\"authoritative seat mutation remains successful\");",
                  "",
                  "    let state = host.authoritative_state().expect(\"state after mutation\");",
                  "    let participant = state.participants.get(player_id).expect(\"participant remains\");",
                  "    assert_eq!(participant.seat_index, Some(0));",
                  "    assert_eq!(participant.connection_state, crate::domain::ConnectionState::Reconnecting);",
                  "    assert_eq!(participant.state, crate::domain::ParticipantState::Reconnecting);",
                  "    assert!(participant.reconnect_expiry_ms.is_some());",
                  "    assert!(!host.clients.lock().expect(\"client registry\").contains_key(player_id));",
                  "",
                  "    let health = host.runtime_health();",
                  "    assert_eq!(",
                  "        health.snapshot_sync_error_count,",
                  "        before_health.snapshot_sync_error_count + 1,",
                  "    );",
                  "    assert!(health",
                  "        .last_error",
                  "        .as_deref()",
                  "        .is_some_and(|message| message.contains(\"snapshot sync failed\")));",
                  "}",
                  "",
              ]
              lines[insertion:insertion] = test
          write(path, lines)

          for name in [
              ".github/workflows/ralph-phase8-once.yml",
              ".github/ralph-phase8-trigger",
          ]:
              candidate = Path(name)
              if candidate.exists():
                  candidate.unlink()
          PY

      - name: Format Rust
        run: cargo fmt

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make lobby snapshot sync failures observable"
          git pull --rebase origin master
          git push origin HEAD:master
