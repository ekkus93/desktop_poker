name: Runtime hardening keyless provider storage

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-keyless-provider-storage.trigger

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            cmake \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Apply keyless provider storage hardening
        run: python3 scripts/runtime_hardening_keyless_provider_storage_once.py
      - name: Format and validate Rust workspace
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
      - name: Commit validated keyless provider storage hardening
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runtime-hardening-keyless-provider-storage.trigger
          rm .github/workflows/runtime-hardening-keyless-provider-storage-once.yml
          rm scripts/runtime_hardening_keyless_provider_storage_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            src-tauri/src/npc/provider.rs \
            src-tauri/src/npc/provider_storage.rs \
            scripts/runtime_hardening_keyless_provider_storage_once.py \
            .github/runtime-hardening-keyless-provider-storage.trigger \
            .github/workflows/runtime-hardening-keyless-provider-storage-once.yml
          git commit -m "Keep keyless LLM providers independent of keychain"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
