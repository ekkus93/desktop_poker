name: Apply verified accessibility migration

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-accessibility-migration-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-accessibility-migration-v2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply audited accessibility changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B verified-accessibility-migration origin/master

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          def read(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def ensure_import(text: str, anchor: str) -> str:
              statement = 'import { AccessibleDialog } from "../components/shared/AccessibleDialog";\n'
              if statement in text:
                  return text
              if anchor not in text:
                  raise SystemExit(f"import anchor missing: {anchor!r}")
              return text.replace(anchor, anchor + statement, 1)

          def exact(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)

          def regex(text: str, pattern: str, replacement: str, label: str) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: expected one regex match, found {count}")
              return updated

          # Lobby confirmation and connection announcements.
          path = "src/screens/TournamentLobbyScreen.tsx"
          text = read(path)
          text = ensure_import(
              text,
              'import { useDesktopShell } from "../app/useDesktopShell";\n',
          )
          text = exact(
              text,
              '<p className="inline-banner error">{hostRecoveryError}</p>',
              '<p className="inline-banner error" role="alert">{hostRecoveryError}</p>',
              "lobby host recovery alert",
          )
          text = exact(
              text,
              '''{clientTerminated ? (
                <div className="inline-banner error">
                  <WifiOff className="button-icon" strokeWidth={1.9} />
                  Disconnected from host — session could not be recovered.
                </div>
              ) : clientReconnecting ? (
                <div className="inline-banner info">
                  <WifiOff className="button-icon" strokeWidth={1.9} />
                  Reconnecting to host…
                </div>
              ) : connectionSlow ? (
                <div className="inline-banner info">
                  <WifiOff className="button-icon" strokeWidth={1.9} />
                  Connection slow — retrying…
                </div>
              ) : null}''',
              '''{clientTerminated ? (
                <div className="inline-banner error" role="alert">
                  <WifiOff aria-hidden="true" className="button-icon" strokeWidth={1.9} />
                  Disconnected from host — session could not be recovered.
                </div>
              ) : clientReconnecting ? (
                <div aria-live="polite" className="inline-banner info" role="status">
                  <WifiOff aria-hidden="true" className="button-icon" strokeWidth={1.9} />
                  Reconnecting to host…
                </div>
              ) : connectionSlow ? (
                <div aria-live="polite" className="inline-banner info" role="status">
                  <WifiOff aria-hidden="true" className="button-icon" strokeWidth={1.9} />
                  Connection slow — retrying…
                </div>
              ) : null}''',
              "lobby connection announcements",
          )
          text = text.replace(
              '<p className="inline-banner error">{lobbyError}</p>',
              '<p className="inline-banner error" role="alert">{lobbyError}</p>',
          )
          text = regex(
              text,
              r'''\{showLeaveFlow \? \(\n\s*<section className="dialog-card">.*?</section>\n\s*\) : null\}''',
              '''{showLeaveFlow ? (
        <AccessibleDialog
          kicker={localSeat?.kind === "host" ? "Close" : "Leave"}
          onCancel={() => setShowLeaveFlow(false)}
          title={leaveTitle}
          titleId="leave-table-title"
        >
          {lobbyError ? (
            <p className="inline-banner error" role="alert">{lobbyError}</p>
          ) : null}
          <div className="button-row">
            <button
              className="primary-button"
              disabled={submitting}
              onClick={() => void leaveLiveSession()}
              type="button"
            >
              {leaveActionLabel}
            </button>
            <button
              className="secondary-button"
              onClick={() => setShowLeaveFlow(false)}
              type="button"
            >
              Stay here
            </button>
          </div>
        </AccessibleDialog>
      ) : null}''',
              "lobby leave dialog",
          )
          write(path, text)

          # NPC editor unsaved-change dialog and status semantics.
          path = "src/screens/NpcProfilesScreen.tsx"
          text = read(path)
          text = ensure_import(
              text,
              'import { SectionCard } from "../components/shared/SectionCard";\n',
          )
          text = regex(
              text,
              r'''\{unsavedDialogVisible \? \(\n\s*<section\n\s*aria-labelledby="unsaved-profile-title".*?</section>\n\s*\) : null\}''',
              '''{unsavedDialogVisible ? (
        <AccessibleDialog
          description="Your latest profile edits have not been saved. Discarding them cannot be undone."
          kicker="Unsaved changes"
          onCancel={keepEditing}
          title="Discard unsaved profile changes?"
          titleId="unsaved-profile-title"
        >
          <div className="button-row">
            <button className="primary-button" onClick={discardChanges} type="button">
              Discard changes
            </button>
            <button className="secondary-button" onClick={keepEditing} type="button">
              Keep editing
            </button>
          </div>
        </AccessibleDialog>
      ) : null}''',
              "NPC unsaved dialog",
          )
          text = text.replace(
              '<p className="inline-banner error">',
              '<p className="inline-banner error" role="alert">',
          )
          text = text.replace(
              '<p className="inline-banner success">Profile saved.</p>',
              '<p className="inline-banner success" role="status">Profile saved.</p>',
          )
          write(path, text)

          # Settings destructive action dialog. Replace the complete uniquely titled card.
          path = "src/screens/DeviceSettingsScreen.tsx"
          text = read(path)
          text = ensure_import(
              text,
              'import { SectionCard } from "../components/shared/SectionCard";\n',
          )
          replacement = '''<SectionCard
          kicker="Saved on this device"
          title="Local setup"
          className="support-card device-settings-card"
        >
          <div className="button-row">
            <button
              className="secondary-button"
              disabled={localSetupConfirmation !== null}
              onClick={() => {
                setLocalSetupConfirmation("resetHostDraft");
                setResetSuccess(false);
              }}
              type="button"
            >
              Reset host setup
            </button>
            <button
              className="secondary-button"
              disabled={localSetupConfirmation !== null}
              onClick={() => {
                setLocalSetupConfirmation("clearRecentInvites");
                setClearSuccess(false);
              }}
              type="button"
            >
              Clear saved invites ({recentJoinPayloads.length})
            </button>
          </div>
          {localSetupConfirmation ? (
            <AccessibleDialog
              description={
                localSetupConfirmation === "resetHostDraft"
                  ? "This removes the saved host setup on this device."
                  : "This removes every saved invitation on this device."
              }
              kicker="Confirm destructive action"
              onCancel={() => setLocalSetupConfirmation(null)}
              title={
                localSetupConfirmation === "resetHostDraft"
                  ? "Reset saved host setup?"
                  : "Clear saved invitations?"
              }
              titleId="local-setup-confirmation-title"
            >
              <div className="button-row">
                <button
                  className="primary-button"
                  onClick={() => {
                    if (localSetupConfirmation === "resetHostDraft") {
                      resetHostDraft();
                      setResetSuccess(true);
                    } else {
                      clearRecentJoinPayloads();
                      setClearSuccess(true);
                    }
                    setLocalSetupConfirmation(null);
                  }}
                  type="button"
                >
                  {localSetupConfirmation === "resetHostDraft"
                    ? "Confirm reset"
                    : "Confirm clear"}
                </button>
                <button
                  className="secondary-button"
                  onClick={() => setLocalSetupConfirmation(null)}
                  type="button"
                >
                  Cancel
                </button>
              </div>
            </AccessibleDialog>
          ) : null}
          {resetSuccess ? (
            <p className="inline-banner success" role="status">
              Host setup reset.
            </p>
          ) : null}
          {clearSuccess ? (
            <p className="inline-banner success" role="status">
              Saved invites cleared.
            </p>
          ) : null}
          <p className="field-hint">
            {recentJoinPayloads.length} saved invite
            {recentJoinPayloads.length === 1 ? "" : "s"}.
          </p>
        </SectionCard>'''
          text = regex(
              text,
              r'''<SectionCard\n\s*kicker="Saved on this device"\n\s*title="Local setup".*?</SectionCard>''',
              replacement,
              "settings local setup card",
          )
          text = text.replace(
              '<p className="inline-banner success">{providerStatus}</p>',
              '<p className="inline-banner success" role="status">{providerStatus}</p>',
          )
          text = text.replace(
              '<p className="inline-banner error">{providerError}</p>',
              '<p className="inline-banner error" role="alert">{providerError}</p>',
          )
          write(path, text)

          # Main table announcements and action confirmation dialog.
          path = "src/screens/MainTableScreen.tsx"
          text = read(path)
          text = ensure_import(
              text,
              'import { SectionCard } from "../components/shared/SectionCard";\n',
          )
          text = exact(
              text,
              '''<div
                  className={`table-headline-card ${tableView.actionTray ? "is-active-turn" : "is-waiting"}`}
                >''',
              '''<div
                  aria-atomic="true"
                  aria-live="polite"
                  className={`table-headline-card ${tableView.actionTray ? "is-active-turn" : "is-waiting"}`}
                >''',
              "table action owner announcement",
          )
          text = exact(
              text,
              '''{tableView?.sessionConnection === "reconnecting" ? (
          <div className="inline-banner info">
            <WifiOff className="button-icon" strokeWidth={1.9} />
            Reconnecting to host…
          </div>
        ) : connectionSlow ? (
          <div className="inline-banner info">
            <WifiOff className="button-icon" strokeWidth={1.9} />
            Connection slow — retrying…
          </div>
        ) : null}''',
              '''{tableView?.sessionConnection === "reconnecting" ? (
          <div aria-live="polite" className="inline-banner info" role="status">
            <WifiOff aria-hidden="true" className="button-icon" strokeWidth={1.9} />
            Reconnecting to host…
          </div>
        ) : connectionSlow ? (
          <div aria-live="polite" className="inline-banner info" role="status">
            <WifiOff aria-hidden="true" className="button-icon" strokeWidth={1.9} />
            Connection slow — retrying…
          </div>
        ) : null}''',
              "table connection announcements",
          )
          text = text.replace(
              '<div className="inline-banner info observer-banner">',
              '<div className="inline-banner info observer-banner" role="status">',
              1,
          )
          text = exact(
              text,
              '''{submitting ? (
                    <div className="inline-banner info">
                      Sending your action to the host…
                    </div>
                  ) : null}''',
              '''{submitting ? (
                    <div aria-live="polite" className="inline-banner info" role="status">
                      Sending your action to the host…
                    </div>
                  ) : null}''',
              "table submitting status",
          )
          text = exact(
              text,
              '''{confirmation ? (
                    <div className="confirmation-card" role="status">
                      <strong>{confirmation.label}</strong>
                      <p className="field-hint">
                        {confirmation.actionKind === "betOrRaise"
                          ? `Send a raise to ${effectiveRaiseAmount ?? defaultRaiseAmount(tableView.actionTray)} chips?`
                          : "Commit the remaining stack as an all-in action?"}
                      </p>
                      <div className="button-row">
                        <button
                          className="primary-button"
                          disabled={submitting}
                          onClick={() => void confirmQueuedAction()}
                          type="button"
                        >
                          Confirm
                        </button>
                        <button
                          className="secondary-button"
                          disabled={submitting}
                          onClick={() => setConfirmation(null)}
                          type="button"
                        >
                          Cancel
                        </button>
                      </div>
                    </div>
                  ) : null}''',
              '''{confirmation ? (
                    <AccessibleDialog
                      className="confirmation-card"
                      description={
                        confirmation.actionKind === "betOrRaise"
                          ? `Send a raise to ${effectiveRaiseAmount ?? defaultRaiseAmount(tableView.actionTray)} chips?`
                          : "Commit the remaining stack as an all-in action?"
                      }
                      onCancel={() => setConfirmation(null)}
                      title={confirmation.label}
                      titleId="table-action-confirmation-title"
                    >
                      <div className="button-row">
                        <button
                          className="primary-button"
                          disabled={submitting}
                          onClick={() => void confirmQueuedAction()}
                          type="button"
                        >
                          Confirm
                        </button>
                        <button
                          className="secondary-button"
                          disabled={submitting}
                          onClick={() => setConfirmation(null)}
                          type="button"
                        >
                          Cancel
                        </button>
                      </div>
                    </AccessibleDialog>
                  ) : null}''',
              "table action dialog",
          )
          text = text.replace(
              '<div className="inline-banner error">{actionError}</div>',
              '<div className="inline-banner error" role="alert">{actionError}</div>',
              1,
          )
          write(path, text)
          PY

          npm ci
          npm run format
          npx vitest run \
            src/components/shared/AccessibleDialog.test.tsx \
            src/components/layout/AppFrameAccessibility.test.tsx \
            src/screens/DeviceSettingsConfirmation.test.tsx \
            src/screens/NpcProfilesIntegrity.test.tsx \
            src/screens/TournamentLobbyAuthoritativeReady.test.tsx
          npm run lint
          npm run build

          rm -f \
            .github/workflows/apply-accessible-dialog-migration.yml \
            .github/workflows/apply-accessibility-migration-v2.yml
          npm run format:check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete desktop accessibility interaction pass"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
