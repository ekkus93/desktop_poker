name: Apply verified accessibility migration

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-accessibility-migration-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-accessibility-migration-v2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply audited accessibility changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B verified-accessibility-migration origin/master

          python3 - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          DIALOG_IMPORT = (
              'import { AccessibleDialog } from '
              '"../components/shared/AccessibleDialog";\n'
          )

          def load(path: str) -> str:
              return Path(path).read_text(encoding="utf-8")

          def save(path: str, text: str) -> None:
              Path(path).write_text(text, encoding="utf-8")

          def add_dialog_import(text: str, anchor: str, label: str) -> str:
              if DIALOG_IMPORT in text:
                  return text
              if anchor not in text:
                  raise SystemExit(f"{label}: import anchor missing")
              return text.replace(anchor, DIALOG_IMPORT + anchor, 1)

          def sub_unique(
              text: str,
              pattern: str,
              replacement: str,
              label: str,
          ) -> str:
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"{label}: unique region not found")
              return updated

          # Lobby leave confirmation and connection announcements.
          lobby_path = "src/screens/TournamentLobbyScreen.tsx"
          lobby = load(lobby_path)
          lobby = add_dialog_import(
              lobby,
              'import { ScreenShell } from "./ScreenShell";\n',
              "lobby",
          )
          lobby = sub_unique(
              lobby,
              r'''\{showLeaveFlow \? \(\s*<section className="dialog-card">.*?</section>\s*\) : null\}''',
              '''{showLeaveFlow ? (
        <AccessibleDialog
          kicker={localSeat?.kind === "host" ? "Close" : "Leave"}
          onCancel={() => setShowLeaveFlow(false)}
          title={leaveTitle}
          titleId="leave-table-title"
        >
          {lobbyError ? (
            <p className="inline-banner error" role="alert">
              {lobbyError}
            </p>
          ) : null}
          <div className="button-row">
            <button
              className="primary-button"
              disabled={submitting}
              onClick={() => void leaveLiveSession()}
              type="button"
            >
              {leaveActionLabel}
            </button>
            <button
              className="secondary-button"
              onClick={() => setShowLeaveFlow(false)}
              type="button"
            >
              Stay here
            </button>
          </div>
        </AccessibleDialog>
      ) : null}''',
              "lobby leave confirmation",
          )
          lobby = lobby.replace(
              '<p className="inline-banner error">{hostRecoveryError}</p>',
              '<p className="inline-banner error" role="alert">'
              '{hostRecoveryError}</p>',
          )
          lobby = lobby.replace(
              '<p className="inline-banner error">{lobbyError}</p>',
              '<p className="inline-banner error" role="alert">{lobbyError}</p>',
          )
          lobby = lobby.replace(
              '<div className="inline-banner error">\n'
              '                  <WifiOff className="button-icon" strokeWidth={1.9} />',
              '<div className="inline-banner error" role="alert">\n'
              '                  <WifiOff aria-hidden="true" className="button-icon" strokeWidth={1.9} />',
          )
          lobby = lobby.replace(
              '<div className="inline-banner info">\n'
              '                  <WifiOff className="button-icon" strokeWidth={1.9} />',
              '<div aria-live="polite" className="inline-banner info" role="status">\n'
              '                  <WifiOff aria-hidden="true" className="button-icon" strokeWidth={1.9} />',
          )
          save(lobby_path, lobby)

          # NPC unsaved-edit confirmation and save/error announcements.
          npc_path = "src/screens/NpcProfilesScreen.tsx"
          npc = load(npc_path)
          npc = add_dialog_import(
              npc,
              'import { SectionCard } from "../components/shared/SectionCard";\n',
              "NPC profiles",
          )
          npc = sub_unique(
              npc,
              r'''\{unsavedDialogVisible \? \(\s*<section\s+aria-labelledby="unsaved-profile-title".*?</section>\s*\) : null\}''',
              '''{unsavedDialogVisible ? (
        <AccessibleDialog
          description="Your latest profile edits have not been saved. Discarding them cannot be undone."
          kicker="Unsaved changes"
          onCancel={keepEditing}
          title="Discard unsaved profile changes?"
          titleId="unsaved-profile-title"
        >
          <div className="button-row">
            <button
              className="primary-button"
              onClick={discardChanges}
              type="button"
            >
              Discard changes
            </button>
            <button
              className="secondary-button"
              onClick={keepEditing}
              type="button"
            >
              Keep editing
            </button>
          </div>
        </AccessibleDialog>
      ) : null}''',
              "NPC unsaved confirmation",
          )
          npc = npc.replace(
              '<p className="inline-banner error">',
              '<p className="inline-banner error" role="alert">',
          )
          npc = npc.replace(
              '<p className="inline-banner success">Profile saved.</p>',
              '<p className="inline-banner success" role="status">'
              'Profile saved.</p>',
          )
          save(npc_path, npc)

          # Settings destructive confirmation; replace the complete Local setup card.
          settings_path = "src/screens/DeviceSettingsScreen.tsx"
          settings = load(settings_path)
          settings = add_dialog_import(
              settings,
              'import { SectionCard } from "../components/shared/SectionCard";\n',
              "settings",
          )
          local_setup = '''<SectionCard
          kicker="Saved on this device"
          title="Local setup"
          className="support-card device-settings-card"
        >
          <div className="button-row">
            <button
              className="secondary-button"
              disabled={localSetupConfirmation !== null}
              onClick={() => {
                setLocalSetupConfirmation("resetHostDraft");
                setResetSuccess(false);
              }}
              type="button"
            >
              Reset host setup
            </button>
            <button
              className="secondary-button"
              disabled={localSetupConfirmation !== null}
              onClick={() => {
                setLocalSetupConfirmation("clearRecentInvites");
                setClearSuccess(false);
              }}
              type="button"
            >
              Clear saved invites ({recentJoinPayloads.length})
            </button>
          </div>
          {localSetupConfirmation ? (
            <AccessibleDialog
              description={
                localSetupConfirmation === "resetHostDraft"
                  ? "This removes the saved host setup on this device."
                  : "This removes every saved invitation on this device."
              }
              kicker="Confirm destructive action"
              onCancel={() => setLocalSetupConfirmation(null)}
              title={
                localSetupConfirmation === "resetHostDraft"
                  ? "Reset saved host setup?"
                  : "Clear saved invitations?"
              }
              titleId="local-setup-confirmation-title"
            >
              <div className="button-row">
                <button
                  className="primary-button"
                  onClick={() => {
                    if (localSetupConfirmation === "resetHostDraft") {
                      resetHostDraft();
                      setResetSuccess(true);
                    } else {
                      clearRecentJoinPayloads();
                      setClearSuccess(true);
                    }
                    setLocalSetupConfirmation(null);
                  }}
                  type="button"
                >
                  {localSetupConfirmation === "resetHostDraft"
                    ? "Confirm reset"
                    : "Confirm clear"}
                </button>
                <button
                  className="secondary-button"
                  onClick={() => setLocalSetupConfirmation(null)}
                  type="button"
                >
                  Cancel
                </button>
              </div>
            </AccessibleDialog>
          ) : null}
          {resetSuccess ? (
            <p className="inline-banner success" role="status">
              Host setup reset.
            </p>
          ) : null}
          {clearSuccess ? (
            <p className="inline-banner success" role="status">
              Saved invites cleared.
            </p>
          ) : null}
          <p className="field-hint">
            {recentJoinPayloads.length} saved invite
            {recentJoinPayloads.length === 1 ? "" : "s"}.
          </p>
        </SectionCard>'''
          settings = sub_unique(
              settings,
              r'''<SectionCard\s+kicker="Saved on this device"\s+title="Local setup".*?</SectionCard>''',
              local_setup,
              "settings local setup",
          )
          settings = settings.replace(
              '<p className="inline-banner success">{providerStatus}</p>',
              '<p className="inline-banner success" role="status">'
              '{providerStatus}</p>',
          )
          settings = settings.replace(
              '<p className="inline-banner error">{providerError}</p>',
              '<p className="inline-banner error" role="alert">'
              '{providerError}</p>',
          )
          save(settings_path, settings)

          # Main table action confirmation and dynamic announcements.
          table_path = "src/screens/MainTableScreen.tsx"
          table = load(table_path)
          table = add_dialog_import(
              table,
              'import { SectionCard } from "../components/shared/SectionCard";\n',
              "main table",
          )
          table = table.replace(
              '<div\n                  className={`table-headline-card '
              '${tableView.actionTray ? "is-active-turn" : "is-waiting"}`}\n'
              '                >',
              '<div\n                  aria-atomic="true"\n'
              '                  aria-live="polite"\n'
              '                  className={`table-headline-card '
              '${tableView.actionTray ? "is-active-turn" : "is-waiting"}`}\n'
              '                >',
              1,
          )
          table = table.replace(
              '<div className="inline-banner info">\n'
              '            <WifiOff className="button-icon" strokeWidth={1.9} />',
              '<div aria-live="polite" className="inline-banner info" role="status">\n'
              '            <WifiOff aria-hidden="true" className="button-icon" strokeWidth={1.9} />',
          )
          table = table.replace(
              '<div className="inline-banner info observer-banner">',
              '<div className="inline-banner info observer-banner" role="status">',
              1,
          )
          table = table.replace(
              '<div className="inline-banner info">\n'
              '                      Sending your action to the host…',
              '<div aria-live="polite" className="inline-banner info" role="status">\n'
              '                      Sending your action to the host…',
              1,
          )
          table = sub_unique(
              table,
              r'''\{confirmation \? \(\s*<div className="confirmation-card" role="status">.*?</div>\s*\) : null\}''',
              '''{confirmation ? (
                    <AccessibleDialog
                      className="confirmation-card"
                      description={
                        confirmation.actionKind === "betOrRaise"
                          ? `Send a raise to ${effectiveRaiseAmount ?? defaultRaiseAmount(tableView.actionTray)} chips?`
                          : "Commit the remaining stack as an all-in action?"
                      }
                      onCancel={() => setConfirmation(null)}
                      title={confirmation.label}
                      titleId="table-action-confirmation-title"
                    >
                      <div className="button-row">
                        <button
                          className="primary-button"
                          disabled={submitting}
                          onClick={() => void confirmQueuedAction()}
                          type="button"
                        >
                          Confirm
                        </button>
                        <button
                          className="secondary-button"
                          disabled={submitting}
                          onClick={() => setConfirmation(null)}
                          type="button"
                        >
                          Cancel
                        </button>
                      </div>
                    </AccessibleDialog>
                  ) : null}''',
              "table action confirmation",
          )
          table = table.replace(
              '<div className="inline-banner error">{actionError}</div>',
              '<div className="inline-banner error" role="alert">'
              '{actionError}</div>',
              1,
          )
          save(table_path, table)

          # Explicit postconditions prevent a partial or silent migration.
          checks = {
              lobby_path: ["<AccessibleDialog", 'role="alert"'],
              npc_path: ["<AccessibleDialog", "unsaved-profile-title"],
              settings_path: ["<AccessibleDialog", "Reset saved host setup?"],
              table_path: ["<AccessibleDialog", "table-action-confirmation-title"],
          }
          for path, markers in checks.items():
              final = load(path)
              for marker in markers:
                  if marker not in final:
                      raise SystemExit(f"{path}: missing postcondition {marker!r}")
          PY

          npm ci
          npm run format
          npx vitest run \
            src/components/shared/AccessibleDialog.test.tsx \
            src/components/layout/AppFrameAccessibility.test.tsx \
            src/screens/DeviceSettingsConfirmation.test.tsx \
            src/screens/NpcProfilesIntegrity.test.tsx \
            src/screens/TournamentLobbyAuthoritativeReady.test.tsx
          npm run lint
          npm run build

          rm -f \
            .github/workflows/apply-accessible-dialog-migration.yml \
            .github/workflows/apply-accessibility-migration-v2.yml
          npm run format:check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete desktop accessibility interaction pass"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1

      - name: Confirm migration completion
        run: echo "Verified accessibility migration applied and self-removal committed."
