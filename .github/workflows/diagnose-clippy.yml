name: Diagnose Rust verification

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/diagnose-clippy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-rust-verification
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  diagnose:
    name: Capture Rust verification diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Capture Rust verification results
        id: rust
        shell: bash
        run: |
          set +e

          cargo fmt --check > rust-format-diagnostic.log 2>&1
          fmt_status=$?
          cat rust-format-diagnostic.log

          cargo clippy --workspace --all-targets --all-features -- -D warnings \
            > clippy-diagnostic.log 2>&1
          clippy_status=$?
          cat clippy-diagnostic.log

          cargo test --workspace --all-targets --all-features -- --test-threads=2 \
            > rust-workspace-diagnostic.log 2>&1
          workspace_status=$?
          cat rust-workspace-diagnostic.log

          cargo test -p poker-core --all-targets --all-features \
            > poker-core-diagnostic.log 2>&1
          core_status=$?
          cat poker-core-diagnostic.log

          echo "fmt_status=$fmt_status" >> "$GITHUB_OUTPUT"
          echo "clippy_status=$clippy_status" >> "$GITHUB_OUTPUT"
          echo "workspace_status=$workspace_status" >> "$GITHUB_OUTPUT"
          echo "core_status=$core_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish diagnostic logs
        env:
          FMT_STATUS: ${{ steps.rust.outputs.fmt_status }}
          CLIPPY_STATUS: ${{ steps.rust.outputs.clippy_status }}
          WORKSPACE_STATUS: ${{ steps.rust.outputs.workspace_status }}
          CORE_STATUS: ${{ steps.rust.outputs.core_status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/runtime-validation
          cp rust-format-diagnostic.log docs/runtime-validation/rust-format-diagnostic-latest.log
          cp clippy-diagnostic.log docs/runtime-validation/clippy-diagnostic-latest.log
          cp rust-workspace-diagnostic.log docs/runtime-validation/rust-workspace-diagnostic-latest.log
          cp poker-core-diagnostic.log docs/runtime-validation/poker-core-diagnostic-latest.log
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "validatedCommit": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "recordedAtUtc": datetime.now(timezone.utc).isoformat(),
              "formatExitStatus": int(os.environ["FMT_STATUS"]),
              "clippyExitStatus": int(os.environ["CLIPPY_STATUS"]),
              "workspaceTestsExitStatus": int(os.environ["WORKSPACE_STATUS"]),
              "pokerCoreTestsExitStatus": int(os.environ["CORE_STATUS"]),
          }
          payload["result"] = (
              "PASS"
              if all(
                  payload[key] == 0
                  for key in (
                      "formatExitStatus",
                      "clippyExitStatus",
                      "workspaceTestsExitStatus",
                      "pokerCoreTestsExitStatus",
                  )
              )
              else "FAIL"
          )
          Path("docs/runtime-validation/rust-verification-diagnostic-latest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/runtime-validation/rust-format-diagnostic-latest.log \
            docs/runtime-validation/clippy-diagnostic-latest.log \
            docs/runtime-validation/rust-workspace-diagnostic-latest.log \
            docs/runtime-validation/poker-core-diagnostic-latest.log \
            docs/runtime-validation/rust-verification-diagnostic-latest.json
          git commit -m "docs: record Rust verification diagnostic result"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 3
          done
          exit 1
