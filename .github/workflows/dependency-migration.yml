name: Release-readiness cleanup

on:
  pull_request:

permissions:
  contents: write

jobs:
  cleanup:
    if: github.head_ref == 'agent/release-readiness-baseline'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Remove temporary release-readiness helpers
        shell: bash
        run: |
          set -euo pipefail
          git rm \
            .github/workflows/dependency-migration.yml \
            scripts/apply_release_readiness_react_fixes.py \
            docs/.release-readiness-run-trigger

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove release-readiness migration helpers"
          git push origin HEAD:${{ github.head_ref }}
