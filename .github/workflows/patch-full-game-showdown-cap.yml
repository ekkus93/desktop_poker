name: Patch full-game showdown cap

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/patch-full-game-showdown-cap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase the probabilistic tournament completion bound
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B full-game-showdown-cap-fix origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/runtime_full_game_smoke.py")
          text = path.read_text(encoding="utf-8")
          old = "    max_showdowns = 6\n"
          new = (
              "    # A called heads-up all-in does not guarantee elimination: the shorter\\n"
              "    # stack can win or the board can split. Keep a finite safety bound, but\\n"
              "    # make the probabilistic completion check resistant to rare win streaks.\\n"
              "    max_showdowns = 20\n"
          ).replace("\\n", "\n")
          if text.count(old) != 1:
              raise SystemExit(
                  f"Expected exactly one six-showdown bound; found {text.count(old)}"
              )
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

          grep -F 'max_showdowns = 20' scripts/runtime_full_game_smoke.py
          git diff --check
          rm .github/workflows/patch-full-game-showdown-cap.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove six-showdown full-game flake"

          for attempt in 1 2 3 4 5 6; do
            git fetch origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 3
          done
          exit 1
