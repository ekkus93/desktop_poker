name: Apply client shutdown patch once

on:
  push:
    branches:
      - master
    paths:
      - ".github/client-shutdown-once-trigger"

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply explicit client shutdown patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src-tauri/src/networking/runtime/client.rs")
          lines = path.read_text(encoding="utf-8").splitlines()

          def find(needle: str, start: int = 0) -> int:
              matches = [index for index, line in enumerate(lines[start:], start) if needle in line]
              if not matches:
                  raise SystemExit(f"missing expected line containing: {needle!r}")
              return matches[0]

          def ensure_absent(needle: str) -> None:
              if any(needle in line for line in lines):
                  raise SystemExit(f"patch appears already applied: {needle!r}")

          ensure_absent("atomic::{AtomicBool, Ordering}")
          ensure_absent("let stop_signal = Arc::new(AtomicBool::new(false));")
          ensure_absent("runtime_thread: Some(runtime_thread)")

          mpsc_import = find("mpsc::{self},")
          lines.insert(mpsc_import, "        atomic::{AtomicBool, Ordering},")

          channel_line = find("let (sender, receiver) = mpsc::channel();")
          channel_indent = lines[channel_line][: len(lines[channel_line]) - len(lines[channel_line].lstrip())]
          lines.insert(channel_line, f"{channel_indent}let stop_signal = Arc::new(AtomicBool::new(false));")

          command_clone = find("let command_connection_for_thread = Arc::clone(&command_connection);")
          clone_indent = lines[command_clone][: len(lines[command_clone]) - len(lines[command_clone].lstrip())]
          lines.insert(command_clone + 1, f"{clone_indent}let stop_signal_for_thread = Arc::clone(&stop_signal);")

          detached_comment = find("The client runtime thread is intentionally detached")
          if detached_comment + 1 < len(lines) and "by the stop flag and stream lifecycle" in lines[detached_comment + 1]:
              del lines[detached_comment : detached_comment + 2]
          else:
              del lines[detached_comment]

          builder_line = find("thread::Builder::new()", command_clone)
          builder_indent = lines[builder_line][: len(lines[builder_line]) - len(lines[builder_line].lstrip())]
          lines[builder_line] = f"{builder_indent}let runtime_thread = thread::Builder::new()"

          loop_line = find("loop {", builder_line)
          loop_indent = lines[loop_line][: len(lines[loop_line]) - len(lines[loop_line].lstrip())]
          body_indent = loop_indent + "    "
          lines[loop_line + 1 : loop_line + 1] = [
              f"{body_indent}if stop_signal_for_thread.load(Ordering::SeqCst) {{",
              f"{body_indent}    break;",
              f"{body_indent}}}",
              "",
          ]

          read_match = find("let frame_value = match read_json_frame::<Value>(&mut stream)", loop_line)
          read_error = find("Err(_) => {", read_match)
          error_indent = lines[read_error][: len(lines[read_error]) - len(lines[read_error].lstrip())]
          error_body_indent = error_indent + "    "
          lines[read_error + 1 : read_error + 1] = [
              f"{error_body_indent}if stop_signal_for_thread.load(Ordering::SeqCst) {{",
              f"{error_body_indent}    break;",
              f"{error_body_indent}}}",
              "",
          ]

          reconnect_match = find("match reconnect_after_disconnect(", read_error)
          reconnect_ok = find("Ok((reconnected_stream, snapshot_envelope)) => {", reconnect_match)
          ok_indent = lines[reconnect_ok][: len(lines[reconnect_ok]) - len(lines[reconnect_ok].lstrip())] + "    "
          lines[reconnect_ok + 1 : reconnect_ok + 1] = [
              f"{ok_indent}if stop_signal_for_thread.load(Ordering::SeqCst) {{",
              f"{ok_indent}    drop(reconnected_stream);",
              f"{ok_indent}    break;",
              f"{ok_indent}}}",
              "",
          ]

          reconnect_error = find("Err(error) => {", reconnect_ok + 1)
          reconnect_error_indent = lines[reconnect_error][: len(lines[reconnect_error]) - len(lines[reconnect_error].lstrip())] + "    "
          lines[reconnect_error + 1 : reconnect_error + 1] = [
              f"{reconnect_error_indent}if stop_signal_for_thread.load(Ordering::SeqCst) {{",
              f"{reconnect_error_indent}    break;",
              f"{reconnect_error_indent}}}",
              "",
          ]

          disconnected = find(
              "send_runtime_event_best_effort(&sender, ClientRuntimeEvent::Disconnected { player_id });",
              reconnect_error,
          )
          disconnected_indent = lines[disconnected][: len(lines[disconnected]) - len(lines[disconnected].lstrip())]
          lines[disconnected : disconnected + 1] = [
              f"{disconnected_indent}if !stop_signal_for_thread.load(Ordering::SeqCst) {{",
              f"{disconnected_indent}    send_runtime_event_best_effort(",
              f"{disconnected_indent}        &sender,",
              f"{disconnected_indent}        ClientRuntimeEvent::Disconnected {{ player_id }},",
              f"{disconnected_indent}    );",
              f"{disconnected_indent}}}",
          ]

          self_start = find("Ok(Self {", disconnected)
          command_field = find("command_connection,", self_start)
          field_indent = lines[command_field][: len(lines[command_field]) - len(lines[command_field].lstrip())]
          lines[command_field + 1 : command_field + 1] = [
              f"{field_indent}stop_signal,",
              f"{field_indent}runtime_thread: Some(runtime_thread),",
          ]

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Format Rust
        run: cargo fmt

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features -- --test-threads=2

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/networking/runtime/client.rs src-tauri/src/networking/runtime/mod.rs src-tauri/src/app_state/app.rs
          git commit -m "Add explicit client runtime shutdown"
          git pull --rebase origin master
          git push origin HEAD:master
