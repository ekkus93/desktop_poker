name: Diagnose final accessibility verification

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/diagnose-accessibility-verification-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Capture verification output
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B diagnose-accessibility-v3 origin/master
          base_sha=$(git rev-parse HEAD)
          mkdir -p docs/runtime-validation

          python3 - <<'PY'
          from pathlib import Path
          workflow = Path(
              ".github/workflows/apply-accessibility-migration-v2.yml"
          ).read_text(encoding="utf-8")
          script = workflow.split("          python3 - <<'PY'\n", 1)[1].split(
              "\n          PY\n\n          npm ci", 1
          )[0]
          Path("/tmp/accessibility-migrate.py").write_text(
              "\n".join(
                  line[10:] if line.startswith("          ") else line
                  for line in script.splitlines()
              ) + "\n",
              encoding="utf-8",
          )
          PY

          set +e
          {
            python3 /tmp/accessibility-migrate.py
            npm ci
            npm run format
            npx vitest run \
              src/components/shared/AccessibleDialog.test.tsx \
              src/components/layout/AppFrameAccessibility.test.tsx \
              src/screens/DeviceSettingsConfirmation.test.tsx \
              src/screens/NpcProfilesIntegrity.test.tsx \
              src/screens/TournamentLobbyAuthoritativeReady.test.tsx
            npm run lint
            npm run build
          } > /tmp/accessibility-v3-full.log 2>&1
          status=$?
          set -e

          {
            echo 'Final accessibility verification diagnostic'
            echo "overall_status=$status"
            echo "base_sha=$base_sha"
            echo
            tail -n 500 /tmp/accessibility-v3-full.log
          } > /tmp/accessibility-v3-diagnostic.txt

          git reset --hard "$base_sha"
          cp /tmp/accessibility-v3-diagnostic.txt \
            docs/runtime-validation/accessibility-migration-test-diagnostic-v3.txt
          rm .github/workflows/diagnose-accessibility-verification-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/runtime-validation/accessibility-migration-test-diagnostic-v3.txt \
            .github/workflows/diagnose-accessibility-verification-v3.yml
          git commit -m "docs: record final accessibility diagnostic [skip ci]"

          for attempt in $(seq 1 20); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
