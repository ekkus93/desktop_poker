name: Apply reconnect host-shutdown fix

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/runtime-reconnect-failure-matrix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-reconnect-host-shutdown-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply fix and restore validation workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B reconnect-host-shutdown-fix origin/master

          python3 - <<'PY'
          from pathlib import Path

          host_path = Path("src-tauri/src/networking/runtime/host.rs")
          host = host_path.read_text(encoding="utf-8")

          old_import = "    net::{IpAddr, SocketAddr, TcpListener, TcpStream},"
          new_import = "    net::{IpAddr, Shutdown, SocketAddr, TcpListener, TcpStream},"
          if host.count(old_import) == 1 and new_import not in host:
              host = host.replace(old_import, new_import, 1)
          elif host.count(new_import) != 1:
              raise SystemExit("unexpected host networking import state")

          old_drop = '''impl Drop for HostServer {
    fn drop(&mut self) {
        self.stop_signal.store(true, Ordering::SeqCst);
        // Best-effort shutdown wake-up: the listener may already be closed.
        let _ = TcpStream::connect(self.listener_addr);

        if let Some(join_handle) = self.accept_thread.take() {
            // Best-effort join: dropping the server must not panic if the worker panicked.
            let _ = join_handle.join();
        }

        if let Some(join_handle) = self.tick_thread.take() {
            // Best-effort join: dropping the server must not panic if the worker panicked.
            let _ = join_handle.join();
        }
    }
}
'''
          new_drop = '''impl Drop for HostServer {
    fn drop(&mut self) {
        self.stop_signal.store(true, Ordering::SeqCst);
        // Wake the blocking accept loop, then join it before closing client
        // sockets. This prevents a disconnected client from reconnecting to a
        // listener that is still in the process of shutting down.
        let _ = TcpStream::connect(self.listener_addr);

        if let Some(join_handle) = self.accept_thread.take() {
            // Best-effort join: dropping the server must not panic if the worker panicked.
            let _ = join_handle.join();
        }

        if let Some(join_handle) = self.tick_thread.take() {
            // Best-effort join: dropping the server must not panic if the worker panicked.
            let _ = join_handle.join();
        }

        // The per-client session threads are detached and own the original
        // TcpStream. Shutting down every registered clone applies to the shared
        // socket and wakes both the host-side and client-side blocking reads.
        // Drain the registry first so session cleanup cannot deadlock while
        // removing itself after the shutdown-induced read error.
        let connected_clients = {
            let mut clients = self
                .clients
                .lock()
                .unwrap_or_else(|poisoned| poisoned.into_inner());
            clients.drain().map(|(_, client)| client).collect::<Vec<_>>()
        };
        for client in connected_clients {
            let stream = client
                .stream
                .lock()
                .unwrap_or_else(|poisoned| poisoned.into_inner());
            let _ = stream.shutdown(Shutdown::Both);
        }
    }
}
'''
          old_count = host.count(old_drop)
          new_count = host.count(new_drop)
          if old_count == 1 and new_count == 0:
              host = host.replace(old_drop, new_drop, 1)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f"unexpected HostServer Drop state: old={old_count}, new={new_count}"
              )
          host_path.write_text(host, encoding="utf-8")

          mod_path = Path("src-tauri/src/networking/runtime/tests/mod.rs")
          mod_text = mod_path.read_text(encoding="utf-8")
          marker = "mod end_to_end;\n"
          registration = "mod host_shutdown;\n"
          if registration not in mod_text:
              if mod_text.count(marker) != 1:
                  raise SystemExit("runtime test module insertion marker missing")
              mod_text = mod_text.replace(marker, marker + registration, 1)
          mod_path.write_text(mod_text, encoding="utf-8")

          Path("src-tauri/src/networking/runtime/tests/host_shutdown.rs").write_text(
              '''use std::time::{Duration, Instant};

use super::support::*;
use crate::{crypto::DefaultCryptoProvider, networking::ClientRuntimeEvent};

#[test]
fn dropping_host_closes_client_socket_and_reconnect_failure_becomes_terminal() {
    let provider = DefaultCryptoProvider;
    let host = bind_test_host(&provider, "table-host-shutdown", 141);
    let client = connect_test_client(&provider, &host, "player-shutdown", "Shutdown");
    let _ = expect_snapshot_event(&client);

    drop(host);

    let deadline = Instant::now() + Duration::from_secs(5);
    let mut saw_reconnecting = false;
    let mut safe_error = None;
    let mut saw_disconnected = false;

    while Instant::now() < deadline && !saw_disconnected {
        match client.next_event(Duration::from_millis(200)) {
            Ok(ClientRuntimeEvent::Reconnecting { player_id }) => {
                assert_eq!(player_id, "player-shutdown");
                saw_reconnecting = true;
            }
            Ok(ClientRuntimeEvent::SafeError { player_id, message }) => {
                assert_eq!(player_id, "player-shutdown");
                safe_error = Some(message);
            }
            Ok(ClientRuntimeEvent::Disconnected { player_id }) => {
                assert_eq!(player_id, "player-shutdown");
                saw_disconnected = true;
            }
            Ok(other) => panic!("unexpected client event during host shutdown: {other:?}"),
            Err(_) => {}
        }
    }

    assert!(saw_reconnecting, "client must enter reconnecting after host shutdown");
    let safe_error = safe_error.expect("failed reconnect must produce an explicit safe error");
    assert!(
        safe_error.contains("failed to connect to host"),
        "unexpected reconnect failure: {safe_error}"
    );
    assert!(
        saw_disconnected,
        "client must receive a terminal disconnected event after reconnect fails"
    );
}
''',
              encoding="utf-8",
          )
          PY

          cargo fmt --all
          cargo fmt --all -- --check

          # Restore the normal reconnect validation workflow from the last
          # validated source commit. The resulting source-fix commit therefore
          # immediately starts the real matrix rather than retaining a patch job.
          git show 8f3f68af0dc76aaff22aaebb73c43a1432dfc941:.github/workflows/runtime-reconnect-failure-matrix.yml \
            > .github/workflows/runtime-reconnect-failure-matrix.yml
          rm -f .github/workflows/apply-host-shutdown-fix.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close client sockets when the host stops"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
