name: Diagnose corrected accessibility verification

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/diagnose-accessibility-verification-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-accessibility-verification-v2
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Capture corrected verification result
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B diagnose-accessibility-v2 origin/master
          base_sha=$(git rev-parse HEAD)
          mkdir -p docs/runtime-validation

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/apply-accessibility-migration-v2.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          npm ci"
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          ]
          Path("/tmp/accessibility-migrate.py").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

          set +e
          {
            echo '=== migration ==='
            python3 /tmp/accessibility-migrate.py
            echo '=== npm ci ==='
            npm ci
            echo '=== format ==='
            npm run format
            echo '=== focused tests ==='
            npx vitest run \
              src/components/shared/AccessibleDialog.test.tsx \
              src/components/layout/AppFrameAccessibility.test.tsx \
              src/screens/DeviceSettingsConfirmation.test.tsx \
              src/screens/NpcProfilesIntegrity.test.tsx \
              src/screens/TournamentLobbyAuthoritativeReady.test.tsx
            echo '=== lint ==='
            npm run lint
            echo '=== build ==='
            npm run build
          } > /tmp/accessibility-v2-full.log 2>&1
          status=$?
          set -e

          {
            echo 'Corrected accessibility verification diagnostic'
            echo
            echo "overall_status=$status"
            echo "base_sha=$base_sha"
            echo
            tail -n 400 /tmp/accessibility-v2-full.log
          } > /tmp/accessibility-v2-diagnostic.txt

          git reset --hard "$base_sha"
          cp /tmp/accessibility-v2-diagnostic.txt \
            docs/runtime-validation/accessibility-migration-test-diagnostic-v2.txt
          rm .github/workflows/diagnose-accessibility-verification-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/runtime-validation/accessibility-migration-test-diagnostic-v2.txt \
            .github/workflows/diagnose-accessibility-verification-v2.yml
          git commit -m "docs: record corrected accessibility diagnostic [skip ci]"

          for attempt in $(seq 1 20); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 2
          done
          exit 1
