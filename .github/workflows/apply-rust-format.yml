name: Apply Rust formatting

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-rust-format.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-rust-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B canonical-rust-format origin/master

          cargo fmt --all
          rm .github/workflows/apply-rust-format.yml
          cargo fmt --all -- --check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical Rust formatting"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
