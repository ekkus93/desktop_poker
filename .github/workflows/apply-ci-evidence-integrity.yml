name: Apply CI evidence integrity

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-ci-evidence-integrity.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ci-evidence-integrity
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch and remove one-time workflows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B ci-evidence-integrity origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')

          if '      - "docs/runtime-validation/**"' not in text:
              marker = '    tags:\n      - "v*"\n'
              if marker not in text:
                  raise SystemExit('CI push/tag trigger marker not found')
              text = text.replace(
                  marker,
                  marker + '    paths-ignore:\n      - "docs/runtime-validation/**"\n',
                  1,
              )

          old = "    if: always() && github.ref == 'refs/heads/master'"
          new = "    if: always() && !cancelled() && github.ref == 'refs/heads/master'"
          if new not in text:
              if old not in text:
                  raise SystemExit('CI publish-result condition not found')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

          grep -A2 -F 'paths-ignore:' .github/workflows/ci.yml
          grep -F "if: always() && !cancelled() && github.ref == 'refs/heads/master'" \
            .github/workflows/ci.yml
          rm -f \
            .github/workflows/patch-ci-evidence-integrity.yml \
            .github/workflows/apply-ci-evidence-integrity.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: prevent recursive and cancelled CI evidence"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
