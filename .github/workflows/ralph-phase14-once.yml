name: Ralph phase 14 runtime warnings

on:
  push:
    branches: [master]
    paths: [".github/ralph-phase14-trigger"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Add sanitized runtime warnings to normal UI DTOs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Rust DTO definitions.
          replace_once(
              "src-tauri/src/app_state/mod.rs",
              '''    pub session_connection: String,
              pub tournament_name: String,''',
              '''    pub session_connection: String,
              /// Sanitized host/runtime warnings safe for normal UI display.
              pub runtime_warnings: Vec<String>,
              pub tournament_name: String,''',
          )
          replace_once(
              "src-tauri/src/app_state/mod.rs",
              '''    pub open_seat_count: u8,
              pub participants: Vec<HostSessionParticipantView>,
          }

          #[derive(Clone, Debug, Deserialize, PartialEq, Eq)]''',
              '''    pub open_seat_count: u8,
              pub runtime_warnings: Vec<String>,
              pub participants: Vec<HostSessionParticipantView>,
          }

          #[derive(Clone, Debug, Deserialize, PartialEq, Eq)]''',
          )
          replace_once(
              "src-tauri/src/app_state/mod.rs",
              '''    pub last_error: Option<String>,
              pub participants: Vec<HostSessionParticipantView>,
          }''',
              '''    pub last_error: Option<String>,
              pub runtime_warnings: Vec<String>,
              pub participants: Vec<HostSessionParticipantView>,
          }''',
          )

          # Projection defaults to no warnings; transport-specific callers add them.
          replace_once(
              "src-tauri/src/app_state/projection.rs",
              '''        session_connection: "normal".to_string(),
              tournament_name: public_state.tournament_name,''',
              '''        session_connection: "normal".to_string(),
              runtime_warnings: Vec::new(),
              tournament_name: public_state.tournament_name,''',
          )

          # Host status/table projection and sanitized mapping.
          session = Path("src-tauri/src/app_state/session.rs")
          text = session.read_text(encoding="utf-8")
          helper_anchor = '''const READY_CHECK_TABLE_START_POLL_TIMEOUT: Duration = Duration::from_millis(250);
          '''
          helper = helper_anchor + '''
          pub(crate) fn runtime_health_warning_messages(
              health: &networking::HostRuntimeHealth,
          ) -> Vec<String> {
              let mut warnings = Vec::new();

              if health.tick_advance_error_count > 0 || health.state_lock_error_count > 0 {
                  warnings.push(
                      "The host runtime encountered an internal state error. Stop and restart the table if play is not advancing."
                          .to_string(),
                  );
              }
              if health.publish_error_count > 0 || health.snapshot_sync_error_count > 0 {
                  warnings.push(
                      "One or more players missed a table update and may need to reconnect."
                          .to_string(),
                  );
              }
              if health.pending_join_limit_rejection_count > 0
                  || health.connected_client_limit_rejection_count > 0
              {
                  warnings.push(
                      "Some connection attempts were rejected because the host was at its safety limit."
                          .to_string(),
                  );
              }

              warnings
          }
          '''
          if "runtime_health_warning_messages" not in text:
              if helper_anchor not in text:
                  raise SystemExit("session helper anchor missing")
              text = text.replace(helper_anchor, helper, 1)
          text = text.replace(
              '''            open_seat_count: self.config.max_players.saturating_sub(active_seat_count),
                  participants,''',
              '''            open_seat_count: self.config.max_players.saturating_sub(active_seat_count),
                  runtime_warnings: runtime_health_warning_messages(
                      &self.host_server.runtime_health(),
                  ),
                  participants,''',
              1,
          )
          text = text.replace(
              '''        snapshot.session_connection = "normal".to_string();
                  Ok(snapshot)''',
              '''        snapshot.session_connection = "normal".to_string();
                  snapshot.runtime_warnings =
                      runtime_health_warning_messages(&self.host_server.runtime_health());
                  Ok(snapshot)''',
              1,
          )
          text = text.replace(
              '''            last_error: self.last_error.clone(),
                  participants: build_session_participants(authoritative_state),''',
              '''            last_error: self.last_error.clone(),
                  runtime_warnings: Vec::new(),
                  participants: build_session_participants(authoritative_state),''',
              1,
          )
          if "runtime_health_warning_messages_are_sanitized" not in text:
              text += '''

          #[cfg(test)]
          mod runtime_warning_tests {
              use super::runtime_health_warning_messages;
              use crate::networking::HostRuntimeHealth;

              #[test]
              fn runtime_health_warning_messages_are_sanitized_and_actionable() {
                  let health = HostRuntimeHealth {
                      publish_error_count: 1,
                      snapshot_sync_error_count: 2,
                      state_lock_error_count: 1,
                      pending_join_limit_rejection_count: 1,
                      last_error: Some("secret internal transport detail".to_string()),
                      ..HostRuntimeHealth::default()
                  };

                  let warnings = runtime_health_warning_messages(&health);
                  assert_eq!(warnings.len(), 3);
                  assert!(warnings.iter().any(|warning| warning.contains("restart the table")));
                  assert!(warnings.iter().any(|warning| warning.contains("need to reconnect")));
                  assert!(warnings.iter().any(|warning| warning.contains("safety limit")));
                  assert!(warnings
                      .iter()
                      .all(|warning| !warning.contains("secret internal transport detail")));
              }
          }
          '''
          session.write_text(text, encoding="utf-8")

          # TypeScript DTOs.
          desktop = Path("src/api/desktop.ts")
          text = desktop.read_text(encoding="utf-8")
          text = text.replace(
              '''  openSeatCount: number;
              participants: HostSessionParticipantView[];
          };''',
              '''  openSeatCount: number;
              runtimeWarnings: string[];
              participants: HostSessionParticipantView[];
          };''',
              1,
          )
          text = text.replace(
              '''  lastError: string | null;
              participants: HostSessionParticipantView[];
          };''',
              '''  lastError: string | null;
              runtimeWarnings: string[];
              participants: HostSessionParticipantView[];
          };''',
              1,
          )
          text = text.replace(
              '''  sessionConnection: string;
              tournamentPhase: string;''',
              '''  sessionConnection: string;
              runtimeWarnings: string[];
              tournamentPhase: string;''',
              1,
          )
          desktop.write_text(text, encoding="utf-8")

          # Add empty warning arrays to all TS test/harness object literals with these DTO markers.
          for path in Path("src").rglob("*.ts*"):
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              output = []
              for index, line in enumerate(lines):
                  output.append(line)
                  stripped = line.strip()
                  if stripped.startswith("openSeatCount:") and stripped.endswith(","):
                      following = "\n".join(lines[index + 1:index + 5])
                      if "runtimeWarnings:" not in following:
                          output.append(line[: len(line) - len(line.lstrip())] + "runtimeWarnings: [],")
                  if stripped.startswith("sessionConnection:") and stripped.endswith(","):
                      following = "\n".join(lines[index + 1:index + 5])
                      if "runtimeWarnings:" not in following:
                          output.append(line[: len(line) - len(line.lstrip())] + "runtimeWarnings: [],")
              path.write_text("\n".join(output) + ("\n" if text.endswith("\n") else ""), encoding="utf-8")

          # Shared contract fixture gains the intentionally required keys.
          fixture_path = Path("src/fixtures/desktop-contract.json")
          fixture = json.loads(fixture_path.read_text(encoding="utf-8"))
          for name in ["HostSessionStatus", "ClientSessionStatus", "TableViewSnapshot"]:
              if "runtimeWarnings" not in fixture[name]:
                  fixture[name].append("runtimeWarnings")
          fixture_path.write_text(json.dumps(fixture, indent=2) + "\n", encoding="utf-8")

          # Rust contract representative values and any Rust unit fixtures.
          for path in [Path("src-tauri/tests/desktop_contract.rs"), Path("src-tauri/src/commands.rs")]:
              text = path.read_text(encoding="utf-8")
              lines = text.splitlines()
              output = []
              for index, line in enumerate(lines):
                  output.append(line)
                  stripped = line.strip()
                  if stripped.startswith("open_seat_count:") and stripped.endswith(","):
                      following = "\n".join(lines[index + 1:index + 5])
                      if "runtime_warnings:" not in following:
                          output.append(line[: len(line) - len(line.lstrip())] + "runtime_warnings: vec![],")
                  if stripped.startswith("session_connection:") and stripped.endswith(","):
                      following = "\n".join(lines[index + 1:index + 5])
                      if "runtime_warnings:" not in following:
                          output.append(line[: len(line) - len(line.lstrip())] + "runtime_warnings: vec![],")
              path.write_text("\n".join(output) + "\n", encoding="utf-8")

          # Lobby displays host warnings in its ordinary status column.
          lobby = Path("src/screens/TournamentLobbyScreen.tsx")
          text = lobby.read_text(encoding="utf-8")
          anchor = '''              ) : null}
              <div className="button-row lobby-primary-actions workstation-actions compact-workstation-actions">'''
          replacement = '''              ) : null}
              {liveSession.runtimeWarnings.map((warning) => (
                <div className="inline-banner info" key={warning} role="status">
                  {warning}
                </div>
              ))}
              <div className="button-row lobby-primary-actions workstation-actions compact-workstation-actions">'''
          if anchor not in text:
              raise SystemExit("lobby warning insertion anchor missing")
          text = text.replace(anchor, replacement, 1)
          lobby.write_text(text, encoding="utf-8")

          # Main table displays the same sanitized warnings above the table content.
          table = Path("src/screens/MainTableScreen.tsx")
          text = table.read_text(encoding="utf-8")
          anchor = '''        {error ? (
              <SectionCard title="Table unavailable">'''
          replacement = '''        {tableView?.runtimeWarnings.map((warning) => (
              <div className="inline-banner info" key={warning} role="status">
                {warning}
              </div>
            ))}

            {error ? (
              <SectionCard title="Table unavailable">'''
          if anchor not in text:
              raise SystemExit("table warning insertion anchor missing")
          text = text.replace(anchor, replacement, 1)
          table.write_text(text, encoding="utf-8")

          for name in [
              ".github/workflows/ralph-phase14-once.yml",
              ".github/ralph-phase14-trigger",
          ]:
              candidate = Path(name)
              if candidate.exists():
                  candidate.unlink()
          PY

      - name: Format Rust
        run: cargo fmt

      - name: Format frontend
        run: npm ci && npm run format

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Surface sanitized host runtime warnings"
          git pull --rebase origin master
          git push origin HEAD:master
