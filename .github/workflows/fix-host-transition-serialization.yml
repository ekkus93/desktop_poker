name: Fix host transition serialization

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-host-transition-serialization.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: host-transition-serialization-repair
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Apply serialized-transition repair
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply_host_transition_serialization_fix.py \
            2>&1 | tee host-transition-patch.log
          cargo fmt --all

      - name: Verify focused concurrency regressions
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all --check
            cargo test -p desktop-poker \
              networking::runtime::tests::tournament::runtime_state_writeback_rejects_settled_history_regression \
              -- --exact --nocapture
            cargo test -p desktop-poker \
              networking::runtime::tests::tournament::host_action_waits_for_transition_serialization_lock \
              -- --exact --nocapture
            cargo test -p desktop-poker \
              networking::runtime::tests::tournament \
              -- --nocapture
            cargo clippy -p desktop-poker --all-targets -- -D warnings
          } 2>&1 | tee host-transition-verify.log

      - name: Publish verified repair or diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            rm \
              .github/workflows/fix-host-transition-serialization.yml \
              scripts/apply_host_transition_serialization_fix.py
            rm -f docs/runtime-validation/host-transition-repair-latest.md
            git add \
              src-tauri/src/networking/runtime/mod.rs \
              src-tauri/src/networking/runtime/host.rs \
              src-tauri/src/networking/runtime/host_session.rs \
              src-tauri/src/networking/runtime/handlers.rs \
              src-tauri/src/networking/runtime/tests/tournament.rs \
              docs/runtime-validation/host-transition-repair-latest.md \
              .github/workflows/fix-host-transition-serialization.yml \
              scripts/apply_host_transition_serialization_fix.py
            git commit -m "fix: serialize authoritative host transitions"
          else
            git restore \
              src-tauri/src/networking/runtime/mod.rs \
              src-tauri/src/networking/runtime/host.rs \
              src-tauri/src/networking/runtime/host_session.rs \
              src-tauri/src/networking/runtime/handlers.rs \
              src-tauri/src/networking/runtime/tests/tournament.rs
            mkdir -p docs/runtime-validation
            {
              echo "# Host Transition Serialization Repair Diagnostic"
              echo
              echo "- Staging commit: \`$GITHUB_SHA\`"
              echo "- Workflow run: \`$GITHUB_RUN_ID\`"
              echo "- Patch outcome: \`$PATCH_OUTCOME\`"
              echo "- Verification outcome: \`$VERIFY_OUTCOME\`"
              echo
              echo "## Patch log"
              echo
              echo '```text'
              tail -n 250 host-transition-patch.log 2>/dev/null || true
              echo '```'
              echo
              echo "## Verification log"
              echo
              echo '```text'
              tail -n 500 host-transition-verify.log 2>/dev/null || true
              echo '```'
            } > docs/runtime-validation/host-transition-repair-latest.md
            git add docs/runtime-validation/host-transition-repair-latest.md
            git commit -m "docs: record host transition repair failure"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
                gh workflow run ci.yml --ref master
                gh workflow run runtime-validation.yml --ref master
                gh workflow run runtime-full-game-validation.yml --ref master
              fi
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish host transition repair result" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
