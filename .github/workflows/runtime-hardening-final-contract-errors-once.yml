name: Runtime hardening final contract and command errors

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-final-contract-errors.trigger

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Apply and validate final hardening closure
        id: preflight
        shell: bash
        run: |
          set +e
          log=final-contract-errors-preflight.log
          : > "$log"
          python3 scripts/runtime_hardening_final_contract_errors_once.py >>"$log" 2>&1
          apply_status=$?
          if (( apply_status == 0 )); then
            cargo fmt --all >>"$log" 2>&1
            fmt_status=$?
          else
            fmt_status=1
          fi
          if (( apply_status == 0 && fmt_status == 0 )); then
            cargo clippy --workspace --all-targets --all-features -- -D warnings >>"$log" 2>&1
            clippy_status=$?
          else
            clippy_status=1
          fi
          if (( apply_status == 0 && fmt_status == 0 && clippy_status == 0 )); then
            cargo test --workspace --all-targets --all-features >>"$log" 2>&1
            test_status=$?
          else
            test_status=1
          fi
          printf 'apply=%s\nfmt=%s\nclippy=%s\ntest=%s\n' \
            "$apply_status" "$fmt_status" "$clippy_status" "$test_status" >>"$log"
          if (( apply_status == 0 && fmt_status == 0 && clippy_status == 0 && test_status == 0 )); then
            echo 'result=success' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failure' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit validated final hardening closure
        if: steps.preflight.outputs.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runtime-hardening-final-contract-errors.trigger
          rm .github/workflows/runtime-hardening-final-contract-errors-once.yml
          rm scripts/runtime_hardening_final_contract_errors_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/commands.rs \
            src-tauri/tests/desktop_contract.rs \
            scripts/runtime_hardening_final_contract_errors_once.py \
            .github/runtime-hardening-final-contract-errors.trigger \
            .github/workflows/runtime-hardening-final-contract-errors-once.yml
          if git ls-files --error-unmatch docs/runtime-validation/final-contract-errors-preflight-latest.log >/dev/null 2>&1; then
            rm -f docs/runtime-validation/final-contract-errors-preflight-latest.log
            git add -A -- docs/runtime-validation/final-contract-errors-preflight-latest.log
          fi
          git commit -m "Finish typed command errors and DTO contract coverage"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
      - name: Publish final hardening preflight failure
        if: steps.preflight.outputs.result == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p docs/runtime-validation
          cp final-contract-errors-preflight.log docs/runtime-validation/final-contract-errors-preflight-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime-validation/final-contract-errors-preflight-latest.log
          git commit -m "docs: record final hardening preflight failure [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
