name: Apply reconnect error patch once

on:
  push:
    branches:
      - master
    paths:
      - ".github/reconnect-errors-once-trigger"

permissions:
  contents: write

jobs:
  patch-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply coded reconnect errors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read_lines(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          def write_lines(path: str, lines: list[str]) -> None:
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          def find(lines: list[str], needle: str, start: int = 0) -> int:
              for index, line in enumerate(lines[start:], start):
                  if needle in line:
                      return index
              raise SystemExit(f"missing expected line: {needle!r}")

          # NetworkingError retains readable messages but now carries an optional stable code.
          path = "src-tauri/src/networking/runtime/mod.rs"
          lines = read_lines(path)
          if any("code: Option<String>" in line for line in lines):
              raise SystemExit("NetworkingError code patch already applied")
          struct_start = find(lines, "pub struct NetworkingError {")
          message_field = find(lines, "message: String,", struct_start)
          lines.insert(message_field, "    code: Option<String>,")
          new_start = find(lines, "pub fn new(message: impl Into<String>)", struct_start)
          self_start = find(lines, "Self {", new_start)
          lines.insert(self_start + 1, "            code: None,")
          display_impl = find(lines, "impl std::fmt::Display for NetworkingError", new_start)
          impl_close = display_impl - 2
          if lines[impl_close].strip() != "}":
              raise SystemExit("could not locate NetworkingError impl closing brace")
          lines[impl_close:impl_close] = [
              "",
              "    #[must_use]",
              "    pub fn with_code(code: impl Into<String>, message: impl Into<String>) -> Self {",
              "        Self {",
              "            code: Some(code.into()),",
              "            message: message.into(),",
              "        }",
              "    }",
              "",
              "    #[must_use]",
              "    pub fn code(&self) -> Option<&str> {",
              "        self.code.as_deref()",
              "    }",
          ]
          write_lines(path, lines)

          # The host handler marks the precise reconnect rejection cause.
          path = "src-tauri/src/networking/runtime/handlers.rs"
          lines = read_lines(path)
          target = find(lines, 'return Err(NetworkingError::new("participant is already connected"));')
          indent = lines[target][: len(lines[target]) - len(lines[target].lstrip())]
          lines[target:target + 1] = [
              f"{indent}return Err(NetworkingError::with_code(",
              f"{indent}    crate::protocol::ERROR_CODE_RECONNECT_ALREADY_CONNECTED,",
              f'{indent}    "participant is already connected",',
              f"{indent}));",
          ]
          write_lines(path, lines)

          # Initial-request rejections preserve a typed handler code when available.
          path = "src-tauri/src/networking/runtime/host.rs"
          lines = read_lines(path)
          join_code = find(lines, '"JOIN_REJECTED",')
          indent = lines[join_code][: len(lines[join_code]) - len(lines[join_code].lstrip())]
          lines[join_code:join_code + 1] = [
              f"{indent}error",
              f"{indent}    .code()",
              f"{indent}    .unwrap_or(crate::protocol::ERROR_CODE_JOIN_REJECTED),",
          ]
          write_lines(path, lines)

          # Client reconnect retry is code-driven and interruptible during retry delay.
          path = "src-tauri/src/networking/runtime/client_connect.rs"
          lines = read_lines(path)
          sync_line = find(lines, "sync::{Arc, Mutex},")
          indent = lines[sync_line][: len(lines[sync_line]) - len(lines[sync_line].lstrip())]
          lines[sync_line:sync_line + 1] = [
              f"{indent}sync::{{",
              f"{indent}    atomic::{{AtomicBool, Ordering}},",
              f"{indent}    Arc, Mutex,",
              f"{indent}}},",
          ]
          protocol_line = find(lines, "ReconnectTournamentRequest, ResyncRequest, SignedEnvelope, SnapshotEvent, PROTOCOL_VERSION,")
          protocol_indent = lines[protocol_line][: len(lines[protocol_line]) - len(lines[protocol_line].lstrip())]
          lines[protocol_line:protocol_line + 1] = [
              f"{protocol_indent}ReconnectTournamentRequest, ResyncRequest, SignedEnvelope, SnapshotEvent,",
              f"{protocol_indent}ERROR_CODE_RECONNECT_ALREADY_CONNECTED, PROTOCOL_VERSION,",
          ]
          reconnect_fn = find(lines, "pub(crate) fn reconnect_after_disconnect(")
          next_counter = find(lines, "next_counter: &mut u64,", reconnect_fn)
          lines.insert(next_counter + 1, "    stop_signal: &AtomicBool,")
          retry_loop = find(lines, "for attempt in 0..=MAX_ALREADY_CONNECTED_RETRIES", reconnect_fn)
          lines.insert(retry_loop + 1, "        ensure_reconnect_not_stopped(stop_signal)?;")
          response_match = find(lines, "match read_snapshot_response", retry_loop)
          retry_guard = find(lines, "Err(error)", response_match)
          unrelated_error = find(lines, "Err(error) => return Err(error),", retry_guard)
          lines[retry_guard:unrelated_error] = [
              "            Err(error) if is_already_connected_rejection(&error) => {",
              "                if attempt == MAX_ALREADY_CONNECTED_RETRIES {",
              "                    break;",
              "                }",
              "                sleep_before_reconnect_retry(stop_signal)?;",
              "            }",
          ]
          final_error = find(lines, "Err(NetworkingError::new(envelope.payload.message))")
          lines[final_error:final_error + 1] = [
              "    Err(NetworkingError::with_code(",
              "        envelope.payload.code,",
              "        envelope.payload.message,",
              "    ))",
          ]
          lines.extend([
              "",
              "fn is_already_connected_rejection(error: &NetworkingError) -> bool {",
              "    error.code() == Some(ERROR_CODE_RECONNECT_ALREADY_CONNECTED)",
              "}",
              "",
              "fn ensure_reconnect_not_stopped(stop_signal: &AtomicBool) -> Result<(), NetworkingError> {",
              "    if stop_signal.load(Ordering::SeqCst) {",
              '        return Err(NetworkingError::new("client runtime shutdown requested"));',
              "    }",
              "    Ok(())",
              "}",
              "",
              "fn sleep_before_reconnect_retry(stop_signal: &AtomicBool) -> Result<(), NetworkingError> {",
              "    for _ in 0..20 {",
              "        ensure_reconnect_not_stopped(stop_signal)?;",
              "        thread::sleep(Duration::from_millis(1));",
              "    }",
              "    Ok(())",
              "}",
              "",
              "#[cfg(test)]",
              "mod tests {",
              "    use super::*;",
              "",
              "    #[test]",
              "    fn reconnect_retry_depends_on_stable_code_not_message() {",
              "        let error = NetworkingError::with_code(",
              "            ERROR_CODE_RECONNECT_ALREADY_CONNECTED,",
              '            "wording can change without changing behavior",',
              "        );",
              "        assert!(is_already_connected_rejection(&error));",
              "    }",
              "",
              "    #[test]",
              "    fn unrelated_rejection_code_is_not_retried() {",
              "        let error = NetworkingError::with_code(",
              "            crate::protocol::ERROR_CODE_RECONNECT_REJECTED,",
              '            "participant is already connected",',
              "        );",
              "        assert!(!is_already_connected_rejection(&error));",
              "    }",
              "",
              "    #[test]",
              "    fn reconnect_retry_wait_stops_immediately_on_shutdown() {",
              "        let stop_signal = AtomicBool::new(true);",
              "        let error = sleep_before_reconnect_retry(&stop_signal)",
              '            .expect_err("shutdown should abort reconnect retry wait");',
              '        assert_eq!(error.to_string(), "client runtime shutdown requested");',
              "    }",
              "}",
          ])
          write_lines(path, lines)

          # Pass the stop signal into reconnect and suppress shutdown-time SafeError.
          path = "src-tauri/src/networking/runtime/client.rs"
          lines = read_lines(path)
          reconnect_call = find(lines, "match reconnect_after_disconnect(")
          counter_arg = find(lines, "&mut next_counter,", reconnect_call)
          lines.insert(counter_arg + 1, "                            &stop_signal_for_thread,")
          cleanup_comment = find(lines, "Best-effort reconnect cleanup", reconnect_call)
          reconnect_error = cleanup_comment - 1
          if "Err(error) =>" not in lines[reconnect_error]:
              raise SystemExit("could not locate reconnect error branch")
          branch_indent = lines[reconnect_error][: len(lines[reconnect_error]) - len(lines[reconnect_error].lstrip())] + "    "
          lines[reconnect_error + 1:reconnect_error + 1] = [
              f"{branch_indent}if stop_signal_for_thread.load(Ordering::SeqCst) {{",
              f"{branch_indent}    break;",
              f"{branch_indent}}}",
              "",
          ]
          write_lines(path, lines)
          PY

      - name: Format Rust
        run: cargo fmt

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/networking/runtime/mod.rs \
            src-tauri/src/networking/runtime/handlers.rs \
            src-tauri/src/networking/runtime/host.rs \
            src-tauri/src/networking/runtime/client_connect.rs \
            src-tauri/src/networking/runtime/client.rs
          git commit -m "Use typed reconnect rejection codes"
          git pull --rebase origin master
          git push origin HEAD:master
