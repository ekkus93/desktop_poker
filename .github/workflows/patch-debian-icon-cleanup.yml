name: Patch Debian icon cleanup

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/patch-debian-icon-cleanup.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-debian-icon-cleanup
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restrict purge checks to package-owned icon files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B debian-icon-cleanup-fix origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/runtime-debian-package-validation-v2.yml")
          text = path.read_text(encoding="utf-8")
          old = "            dpkg-query -L \"$package_name\" | awk '/^\\/usr\\/share\\/(icons|pixmaps)\\// { print }'"
          new = "            dpkg-query -L \"$package_name\" | awk '/^\\/usr\\/share\\/(icons|pixmaps)\\/.*\\.(png|svg|xpm)$/ { print }'"
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              text = text.replace(old, new, 1)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f"Unexpected icon-query state: old={old_count}, new={new_count}"
              )
          path.write_text(text, encoding="utf-8")
          PY

          grep -F '(png|svg|xpm)' .github/workflows/runtime-debian-package-validation-v2.yml
          rm .github/workflows/patch-debian-icon-cleanup.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: validate removal of package icon files only"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
