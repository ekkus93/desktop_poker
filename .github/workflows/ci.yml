name: CI

# This workflow proves automated correctness and Linux artifact construction.
# Graphical application launch, live LAN play, keychain behavior, and live LLM
# providers remain separate manual release-readiness gates.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  # BEGIN TEMP MEMORY RESTORE
  restore-memory-ledger:
    name: Restore complete memory ledger
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/release-readiness-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Restore master ledger and append baseline entry
        shell: bash
        run: |
          set -euo pipefail
          git show origin/master:memory.md > memory.md
          cat >> memory.md <<'EOF'

## 2026-07-26T16:25:00-07:00 - GPT-5.6 Thinking - Execute release-readiness baseline

- Established `docs/DESKTOP_POKER_CURRENT_BACKLOG.md` and `docs/DESKTOP_POKER_RELEASE_READINESS_REPORT.md` as the authoritative backlog/evidence pair.
- Automated baseline passed on product-source `fd8369ba7267fe76a827cdf48384c9f826159719` / evidence-generating PR merge `c79c9f2473f92310c3d65afe8b834f97b2875c5d` in Actions run `30224757296`: 588 Rust tests passed with 3 explicit ignores, 273 frontend tests passed, formatting/lint/build/geometry passed, and both npm audits reported zero vulnerabilities.
- Final read-only validation passed at commit `283607db670d0bd28a342ac5a417806bc3507d78` in Actions run `30225613175`, including repeat Linux release-candidate binary and Debian package construction.
- Fixed a production React Router advisory, development ESLint/PostCSS advisories, and five stricter React correctness findings without weakening lint rules.
- Built and inspected `target/release/desktop-poker` (21,908,136 bytes, SHA-256 `9f49324fcf431fcef5202d35dd7c000184992305568f2652b6a6c23896c23211`) and `Desktop Poker_0.1.0_amd64.deb` (6,738,672 bytes, SHA-256 `fc534010dfd8c0468511d9e2a24ad6a34e0375de7a55c030d113d43d06286ac7`).
- Remaining blockers are manual: graphical launch/install, two-instance and two-machine LAN tournaments, reconnect/failure injection, release keychain behavior, and live rule-based/LLM NPC scenarios. Android/UniFFI should not begin until those gates are resolved or explicitly reclassified.
EOF
          test "$(grep -c '^## ' memory.md)" -gt 20
          grep -F "Execute release-readiness baseline" memory.md

      - name: Remove temporary repair definitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          start_marker = '  # BEGIN TEMP MEMORY RESTORE\n'
          end_marker = '  # END TEMP MEMORY RESTORE\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          path.write_text(text[:start] + text[end:])
          PY
          git rm -f .github/workflows/restore-memory-ledger.yml

      - name: Commit restored ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add memory.md .github/workflows/ci.yml
          git commit -m "docs: restore complete memory ledger"
          git push origin HEAD:${{ github.head_ref }}
  # END TEMP MEMORY RESTORE

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record baseline environment
        shell: bash
        run: |
          {
            echo "git_sha=$(git rev-parse HEAD)"
            echo "git_ref=${GITHUB_REF}"
            uname -a
            cat /etc/os-release
          } | tee validation-environment.log

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Record toolchain versions
        shell: bash
        run: |
          {
            node --version
            npm --version
            rustc --version
            cargo --version
            rustup show active-toolchain
          } | tee validation-toolchains.log

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Capture production npm dependency audit
        id: production_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          status=$?
          cat npm-audit-production.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture full npm dependency audit
        id: full_audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          status=$?
          cat npm-audit-all.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features -- --test-threads=2 2>&1 | tee rust-workspace-tests.log

      - name: Test poker-core directly
        run: cargo test -p poker-core --all-targets --all-features 2>&1 | tee poker-core-tests.log

      - name: List Rust tests and ignored coverage
        run: cargo test --workspace --all-targets --all-features -- --list 2>&1 | tee rust-test-list.log

      - name: Audit poker-core dependency tree
        run: cargo tree -p poker-core 2>&1 | tee poker-core-dependency-tree.log

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test 2>&1 | tee frontend-tests.log

      - name: Build frontend
        run: npm run build 2>&1 | tee frontend-build.log

      - name: Enforce npm dependency audit results
        shell: bash
        run: |
          [[ "${{ steps.production_audit.outputs.status }}" == "0" ]]
          [[ "${{ steps.full_audit.outputs.status }}" == "0" ]]

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            validation-environment.log
            validation-toolchains.log
            npm-audit-production.json
            npm-audit-all.json
            rust-workspace-tests.log
            poker-core-tests.log
            rust-test-list.log
            poker-core-dependency-tree.log
            frontend-tests.log
            frontend-build.log
          if-no-files-found: warn
          retention-days: 30

  geometry:
    name: Browser geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Test browser geometry
        run: npm run test:geometry 2>&1 | tee browser-geometry-tests.log

      - name: Upload geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-geometry-evidence
          path: browser-geometry-tests.log
          if-no-files-found: error
          retention-days: 30

  release-candidate:
    name: Release candidate artifacts
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build release binary and Debian package
        run: npm run tauri build -- --bundles deb 2>&1 | tee release-build.log

      - name: Inventory release artifacts
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/desktop-poker"
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -x "$binary"
          test -n "$deb"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "binary=$binary"
            file "$binary"
            ls -lh "$binary"
            sha256sum "$binary"
            echo "deb=$deb"
            file "$deb"
            ls -lh "$deb"
            sha256sum "$deb"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          } | tee release-artifact-inventory.log
          mkdir -p release-candidate-artifacts
          cp "$binary" release-candidate-artifacts/
          cp "$deb" release-candidate-artifacts/

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-candidate
          path: |
            release-candidate-artifacts/
            release-build.log
            release-artifact-inventory.log
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release bundle
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish tagged bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Desktop Poker ${{ github.ref_name }}
          releaseBody: Automated tagged release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
