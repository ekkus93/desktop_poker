name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  react-lint-fix:
    name: Apply React lint correctness fixes
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/release-readiness-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused React fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found in {path}")
              target.write_text(text.replace(old, new, 1))

          replace_once(
              "src/screens/DeviceSettingsScreen.tsx",
              '''  // When the user explicitly changes the provider dropdown, reset endpoint/model
            // placeholders only if it differs from the loaded settings' provider.
            useEffect(() => {
              if (loadedSettings && selectedProvider === loadedSettings.provider) {
                return;
              }
              setEndpointUrl("");
              setModel("");
            }, [selectedProvider, loadedSettings]);
          ''',
              '''  function handleProviderChange(nextProvider: LlmProviderType) {
              setSelectedProvider(nextProvider);
              setProviderError(null);
              setProviderStatus(null);

              if (loadedSettings?.provider === nextProvider) {
                setEndpointUrl(loadedSettings.endpointUrl ?? "");
                setModel(loadedSettings.model ?? "");
                return;
              }

              setEndpointUrl("");
              setModel("");
            }
          ''',
          )
          replace_once(
              "src/screens/DeviceSettingsScreen.tsx",
              '''                onChange={(e) =>
                              setSelectedProvider(e.target.value as LlmProviderType)
                            }
          ''',
              '''                onChange={(e) =>
                              handleProviderChange(e.target.value as LlmProviderType)
                            }
          ''',
          )

          replace_once(
              "src/screens/NpcProfilesScreen.tsx",
              '''  useEffect(() => {
              void reload();
            }, []);
          ''',
              '''  useEffect(() => {
              let cancelled = false;

              void listNpcProfiles()
                .then((result) => {
                  if (cancelled) {
                    return;
                  }
                  setProfiles(result.profiles);
                  setProfileErrors(result.errors);
                  setListError(null);
                })
                .catch((error: unknown) => {
                  if (cancelled) {
                    return;
                  }
                  setListError(
                    error instanceof Error
                      ? error.message
                      : "Failed to load profiles.",
                  );
                })
                .finally(() => {
                  if (!cancelled) {
                    setLoading(false);
                  }
                });

              return () => {
                cancelled = true;
              };
            }, []);
          ''',
          )

          replace_once(
              "src/screens/JoinTournamentScreen.tsx",
              '''  const [validationState, setValidationState] = useState<ValidationState>({
              status: "idle",
            });
            const [inviteBanner, setInviteBanner] = useState<string | null>(null);
            const [joinError, setJoinError] = useState<string | null>(null);
            const [joining, setJoining] = useState(false);
            const [pillMeta, setPillMeta] = useState<
              Map<string, { label: string; invalid?: boolean }>
            >(new Map());
            const launchJoinAttemptedForPayload = useRef<string | null>(null);
            const deepLinkImportedRef = useRef<string | null>(null);
          ''',
              '''  const [validationState, setValidationState] = useState<ValidationState>(() => {
              if (joinPayloadDraft !== bootstrap.launchJoinPayload) {
                return { status: "idle" };
              }
              if (bootstrap.parsedLaunchJoinPayload) {
                return {
                  status: "valid",
                  payload: bootstrap.parsedLaunchJoinPayload,
                };
              }
              if (bootstrap.launchJoinPayloadError) {
                return {
                  status: "invalid",
                  message: bootstrap.launchJoinPayloadError,
                };
              }
              return { status: "idle" };
            });
            const [inviteBanner, setInviteBanner] = useState<string | null>(() =>
              joinPayloadDraft === bootstrap.launchJoinPayload &&
              bootstrap.parsedLaunchJoinPayload
                ? "Invite already attached to this launch."
                : null,
            );
            const [joinError, setJoinError] = useState<string | null>(null);
            const [joining, setJoining] = useState(false);
            const [pillMeta, setPillMeta] = useState<
              Map<string, { label: string; invalid?: boolean }>
            >(new Map());
            const [launchJoinAttemptedForPayload, setLaunchJoinAttemptedForPayload] =
              useState<string | null>(null);
            const deepLinkImportedRef = useRef<string | null>(null);
          ''',
          )
          replace_once(
              "src/screens/JoinTournamentScreen.tsx",
              '''  useEffect(() => {
              if (joinPayloadDraft !== bootstrap.launchJoinPayload) {
                return;
              }

              if (bootstrap.parsedLaunchJoinPayload) {
                setValidationState({
                  status: "valid",
                  payload: bootstrap.parsedLaunchJoinPayload,
                });
                setInviteBanner("Invite already attached to this launch.");
                return;
              }

              if (bootstrap.launchJoinPayloadError) {
                setValidationState({
                  status: "invalid",
                  message: bootstrap.launchJoinPayloadError,
                });
                setInviteBanner(null);
              }
            }, [
              bootstrap.launchJoinPayload,
              bootstrap.launchJoinPayloadError,
              bootstrap.parsedLaunchJoinPayload,
              joinPayloadDraft,
            ]);

          ''',
              "",
          )
          join_path = Path("src/screens/JoinTournamentScreen.tsx")
          join_text = join_path.read_text()
          join_text = join_text.replace(
              "launchJoinAttemptedForPayload.current === launchJoinPayload",
              "launchJoinAttemptedForPayload === launchJoinPayload",
          )
          join_text = join_text.replace(
              "launchJoinAttemptedForPayload.current = launchJoinPayload;",
              "setLaunchJoinAttemptedForPayload(launchJoinPayload);",
          )
          join_text = join_text.replace(
              "    joinPayloadDraft,\n    navigate,",
              "    joinPayloadDraft,\n    launchJoinAttemptedForPayload,\n    navigate,",
              1,
          )
          join_text = join_text.replace(
              "{launchJoinAttemptedForPayload.current ? (",
              "{launchJoinAttemptedForPayload ? (",
          )
          join_text = join_text.replace(
              '''                          setInviteBanner(null);
                                      navigate(location.pathname, { replace: true });
          ''',
              '''                          setInviteBanner(null);
                                      setLaunchJoinAttemptedForPayload(null);
                                      navigate(location.pathname, { replace: true });
          ''',
              1,
          )
          if ".current" in "\n".join(
              line
              for line in join_text.splitlines()
              if "launchJoinAttemptedForPayload" in line
          ):
              raise SystemExit("launch attempt ref access remains")
          join_path.write_text(join_text)

          main_path = Path("src/screens/MainTableScreen.tsx")
          main_text = main_path.read_text()
          effect_block = '''  useEffect(() => {
              const actionTray = tableView?.actionTray;
              if (!actionTray) {
                setRaiseAmount(null);
                return;
              }

              setRaiseAmount((currentAmount) => {
                if (
                  currentAmount !== null &&
                  isWithinRaiseBounds(currentAmount, actionTray)
                ) {
                  return currentAmount;
                }

                return defaultRaiseAmount(actionTray);
              });
            }, [tableView]);

          '''
          if effect_block not in main_text:
              raise SystemExit("raise synchronization effect not found")
          main_text = main_text.replace(effect_block, "", 1)
          quick_sizes = '''  const quickSizes = useMemo(
              () => buildQuickSizes(tableView?.actionTray),
              [tableView],
            );
          '''
          effective = quick_sizes + '''  const effectiveRaiseAmount = useMemo(() => {
              const actionTray = tableView?.actionTray;
              if (!actionTray) {
                return null;
              }
              if (
                raiseAmount !== null &&
                isWithinRaiseBounds(raiseAmount, actionTray)
              ) {
                return raiseAmount;
              }
              return defaultRaiseAmount(actionTray);
            }, [raiseAmount, tableView]);
          '''
          if quick_sizes not in main_text:
              raise SystemExit("quick-size block not found")
          main_text = main_text.replace(quick_sizes, effective, 1)
          main_text = main_text.replace(
              "confirmation.actionKind === \"betOrRaise\"\n        ? (raiseAmount ?? undefined)",
              "confirmation.actionKind === \"betOrRaise\"\n        ? (effectiveRaiseAmount ?? undefined)",
              1,
          )
          main_text = re.sub(
              r"raiseAmount\s*\?\?\s*defaultRaiseAmount\(tableView\.actionTray\)",
              "effectiveRaiseAmount ?? defaultRaiseAmount(tableView.actionTray)",
              main_text,
          )
          main_path.write_text(main_text)
          PY

          npm run format

      - name: Validate focused fixes
        run: |
          npm run format:check
          npm run lint
          npm run test
          npm run build
          npm audit --omit=dev
          npm audit

      - name: Commit focused fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No React lint fixes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(ui): satisfy React correctness lint rules [react-lint-fix-complete]"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Capture production npm dependency audit
        id: production_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          status=$?
          cat npm-audit-production.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture full npm dependency audit
        id: full_audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          status=$?
          cat npm-audit-all.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit-production.json
            npm-audit-all.json
          if-no-files-found: error
          retention-days: 14

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --all-targets --all-features -- --test-threads=2

      - name: Test poker-core directly
        run: cargo test -p poker-core --all-targets --all-features

      - name: Audit poker-core dependency tree
        run: cargo tree -p poker-core

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Enforce npm dependency audit results
        shell: bash
        run: |
          [[ "${{ steps.production_audit.outputs.status }}" == "0" ]]
          [[ "${{ steps.full_audit.outputs.status }}" == "0" ]]

  geometry:
    name: Browser geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Test browser geometry
        run: npm run test:geometry

  release:
    name: Release bundle
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish tagged bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Desktop Poker ${{ github.ref_name }}
          releaseBody: Automated tagged release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
