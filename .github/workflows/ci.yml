name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  react-lint-fix:
    name: Apply React lint correctness fixes
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/release-readiness-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply focused React fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          def sub_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              target = Path(path)
              text = target.read_text()
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"expected one replacement in {path}, got {count}: {pattern}")
              target.write_text(updated)

          device = "src/screens/DeviceSettingsScreen.tsx"
          sub_once(
              device,
              r'''  // When the user explicitly changes the provider dropdown, reset endpoint/model\n  // placeholders only if it differs from the loaded settings' provider\.\n  useEffect\(\(\) => \{.*?\n  \}, \[selectedProvider, loadedSettings\]\);\n''',
              '''  function handleProviderChange(nextProvider: LlmProviderType) {
            setSelectedProvider(nextProvider);
            setProviderError(null);
            setProviderStatus(null);

            if (loadedSettings?.provider === nextProvider) {
              setEndpointUrl(loadedSettings.endpointUrl ?? "");
              setModel(loadedSettings.model ?? "");
              return;
            }

            setEndpointUrl("");
            setModel("");
          }
''',
              re.DOTALL,
          )
          sub_once(
              device,
              r'''onChange=\{\(e\) =>\s*setSelectedProvider\(e\.target\.value as LlmProviderType\)\s*\}''',
              '''onChange={(e) =>
                    handleProviderChange(e.target.value as LlmProviderType)
                  }''',
          )

          sub_once(
              "src/screens/NpcProfilesScreen.tsx",
              r'''  useEffect\(\(\) => \{\n    void reload\(\);\n  \}, \[\]\);''',
              '''  useEffect(() => {
            let cancelled = false;

            void listNpcProfiles()
              .then((result) => {
                if (cancelled) {
                  return;
                }
                setProfiles(result.profiles);
                setProfileErrors(result.errors);
                setListError(null);
              })
              .catch((error: unknown) => {
                if (cancelled) {
                  return;
                }
                setListError(
                  error instanceof Error
                    ? error.message
                    : "Failed to load profiles.",
                );
              })
              .finally(() => {
                if (!cancelled) {
                  setLoading(false);
                }
              });

            return () => {
              cancelled = true;
            };
          }, []);''',
          )

          join = "src/screens/JoinTournamentScreen.tsx"
          sub_once(
              join,
              r'''  const \[validationState, setValidationState\] = useState<ValidationState>\(\{.*?  const deepLinkImportedRef = useRef<string \| null>\(null\);''',
              '''  const [validationState, setValidationState] = useState<ValidationState>(() => {
            if (joinPayloadDraft !== bootstrap.launchJoinPayload) {
              return { status: "idle" };
            }
            if (bootstrap.parsedLaunchJoinPayload) {
              return {
                status: "valid",
                payload: bootstrap.parsedLaunchJoinPayload,
              };
            }
            if (bootstrap.launchJoinPayloadError) {
              return {
                status: "invalid",
                message: bootstrap.launchJoinPayloadError,
              };
            }
            return { status: "idle" };
          });
          const [inviteBanner, setInviteBanner] = useState<string | null>(() =>
            joinPayloadDraft === bootstrap.launchJoinPayload &&
            bootstrap.parsedLaunchJoinPayload
              ? "Invite already attached to this launch."
              : null,
          );
          const [joinError, setJoinError] = useState<string | null>(null);
          const [joining, setJoining] = useState(false);
          const [pillMeta, setPillMeta] = useState<
            Map<string, { label: string; invalid?: boolean }>
          >(new Map());
          const [launchJoinAttemptedForPayload, setLaunchJoinAttemptedForPayload] =
            useState<string | null>(null);
          const deepLinkImportedRef = useRef<string | null>(null);''',
              re.DOTALL,
          )
          sub_once(
              join,
              r'''  useEffect\(\(\) => \{\n    if \(joinPayloadDraft !== bootstrap\.launchJoinPayload\) \{.*?\n  \}, \[\n    bootstrap\.launchJoinPayload,\n    bootstrap\.launchJoinPayloadError,\n    bootstrap\.parsedLaunchJoinPayload,\n    joinPayloadDraft,\n  \]\);\n\n''',
              "",
              re.DOTALL,
          )
          join_path = Path(join)
          join_text = join_path.read_text()
          replacements = {
              "launchJoinAttemptedForPayload.current === launchJoinPayload":
                  "launchJoinAttemptedForPayload === launchJoinPayload",
              "launchJoinAttemptedForPayload.current = launchJoinPayload;":
                  "setLaunchJoinAttemptedForPayload(launchJoinPayload);",
              "{launchJoinAttemptedForPayload.current ? (":
                  "{launchJoinAttemptedForPayload ? (",
          }
          for old, new in replacements.items():
              if join_text.count(old) != 1:
                  raise SystemExit(f"expected one JoinTournamentScreen token: {old}")
              join_text = join_text.replace(old, new, 1)
          dependency_anchor = "    joinPayloadDraft,\n    navigate,"
          if join_text.count(dependency_anchor) != 1:
              raise SystemExit("launch join dependency anchor not found")
          join_text = join_text.replace(
              dependency_anchor,
              "    joinPayloadDraft,\n    launchJoinAttemptedForPayload,\n    navigate,",
              1,
          )
          clear_anchor = "                          setInviteBanner(null);\n                          navigate(location.pathname, { replace: true });"
          if join_text.count(clear_anchor) != 1:
              raise SystemExit("launch join clear anchor not found")
          join_text = join_text.replace(
              clear_anchor,
              "                          setInviteBanner(null);\n                          setLaunchJoinAttemptedForPayload(null);\n                          navigate(location.pathname, { replace: true });",
              1,
          )
          join_path.write_text(join_text)

          main = "src/screens/MainTableScreen.tsx"
          sub_once(
              main,
              r'''  useEffect\(\(\) => \{\n    const actionTray = tableView\?\.actionTray;.*?\n  \}, \[tableView\]\);\n\n''',
              "",
              re.DOTALL,
          )
          sub_once(
              main,
              r'''  const quickSizes = useMemo\(\n    \(\) => buildQuickSizes\(tableView\?\.actionTray\),\n    \[tableView\],\n  \);''',
              '''  const quickSizes = useMemo(
            () => buildQuickSizes(tableView?.actionTray),
            [tableView],
          );
          const effectiveRaiseAmount = useMemo(() => {
            const actionTray = tableView?.actionTray;
            if (!actionTray) {
              return null;
            }
            if (
              raiseAmount !== null &&
              isWithinRaiseBounds(raiseAmount, actionTray)
            ) {
              return raiseAmount;
            }
            return defaultRaiseAmount(actionTray);
          }, [raiseAmount, tableView]);''',
          )
          main_path = Path(main)
          main_text = main_path.read_text()
          old_confirmation = '''confirmation.actionKind === "betOrRaise"
                ? (raiseAmount ?? undefined)'''
          if main_text.count(old_confirmation) != 1:
              raise SystemExit("confirmation raise amount anchor not found")
          main_text = main_text.replace(
              old_confirmation,
              '''confirmation.actionKind === "betOrRaise"
                ? (effectiveRaiseAmount ?? undefined)''',
              1,
          )
          main_text = re.sub(
              r'''raiseAmount\s*\?\?\s*defaultRaiseAmount\(tableView\.actionTray\)''',
              "effectiveRaiseAmount ?? defaultRaiseAmount(tableView.actionTray)",
              main_text,
          )
          main_path.write_text(main_text)
          PY

          npm run format

      - name: Validate focused fixes
        run: |
          npm run format:check
          npm run lint
          npm run test
          npm run build
          npm audit --omit=dev
          npm audit

      - name: Commit focused fixes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No React lint fixes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix(ui): satisfy React correctness lint rules [react-lint-fix-complete]"
          git push origin HEAD:${{ github.head_ref }}

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Capture production npm dependency audit
        id: production_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          status=$?
          cat npm-audit-production.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture full npm dependency audit
        id: full_audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          status=$?
          cat npm-audit-all.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit-production.json
            npm-audit-all.json
          if-no-files-found: error
          retention-days: 14

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --all-targets --all-features -- --test-threads=2

      - name: Test poker-core directly
        run: cargo test -p poker-core --all-targets --all-features

      - name: Audit poker-core dependency tree
        run: cargo tree -p poker-core

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Enforce npm dependency audit results
        shell: bash
        run: |
          [[ "${{ steps.production_audit.outputs.status }}" == "0" ]]
          [[ "${{ steps.full_audit.outputs.status }}" == "0" ]]

  geometry:
    name: Browser geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Test browser geometry
        run: npm run test:geometry

  release:
    name: Release bundle
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish tagged bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Desktop Poker ${{ github.ref_name }}
          releaseBody: Automated tagged release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
