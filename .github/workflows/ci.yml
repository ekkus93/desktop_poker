name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

# Cancel superseded runs so a burst of pushes can't stack up multiple long jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Keep apt non-interactive so `playwright install --with-deps` (and any other
# apt invocation) can never block on a debconf / needrestart prompt — that hang
# previously let the job run to GitHub's 6-hour ceiling.
env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    # A healthy run finishes in ~10-15 min; this is a safety cap (with headroom
    # for a cold Rust compile), not the expected runtime. Prevents runaway billing.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      # Apt deps for chromium (kept separate from the browser download so a
      # stalled download can't waste the apt time on retry).
      - name: Install Playwright system deps
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # The browser binary is fetched from a CDN that occasionally accepts the
      # connection then sends no data — Playwright has no per-download stall
      # timeout, so it would hang indefinitely (previously to the 6-hour ceiling).
      # Bound each attempt with `timeout` and retry with a fresh connection.
      - name: Install Playwright browser (retry on stall)
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 150 npx playwright install chromium; then
              echo "Playwright browser installed on attempt $attempt"
              exit 0
            fi
            echo "::warning::Playwright browser install attempt $attempt stalled or failed; retrying"
            sleep 5
          done
          echo "::error::Playwright browser install failed after 3 attempts"
          exit 1

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Test browser geometry
        run: npm run test:geometry

      - name: Build frontend
        run: npm run build

  release:
    name: Release bundle
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    # Release builds a full Tauri bundle (heavier than verify), but still capped
    # well below the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish tagged bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Desktop Poker ${{ github.ref_name }}
          releaseBody: Automated tagged release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
