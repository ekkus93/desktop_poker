name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

# Cancel superseded runs so a burst of pushes can't stack up multiple long jobs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Keep apt non-interactive so `playwright install --with-deps` (and any other
# apt invocation) can never block on a debconf / needrestart prompt — that hang
# previously let the job run to GitHub's 6-hour ceiling.
env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    # A healthy run finishes in ~10-15 min; this is a safety cap (with headroom
    # for a cold Rust compile), not the expected runtime. Prevents runaway billing.
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Test Rust
        # The real-TCP integration tests each spawn several background threads
        # (accept loop, per-connection, host tick, client receive). On the
        # runner's limited cores, default test parallelism oversubscribes the
        # CPU and starves those threads, making the live-session timing tests
        # flaky (a client snapshot can miss its wait window). Bound the test
        # threads so the networking/tick threads get scheduled promptly. This
        # matches runner capacity; it does not change product behaviour.
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=2

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

  # Browser-geometry tests run in Microsoft's prebuilt Playwright image, which
  # ships the matching browser binaries (pinned to our @playwright/test version).
  # This avoids the runtime `playwright install` download, which deterministically
  # hung after fetching chromium on the hosted runner and ran jobs to the 6-hour
  # ceiling. Keep the image tag in sync with the @playwright/test version.
  geometry:
    name: Browser geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Test browser geometry
        run: npm run test:geometry

  release:
    name: Release bundle
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    # Release builds a full Tauri bundle (heavier than verify), but still capped
    # well below the 6-hour default.
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish tagged bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Desktop Poker ${{ github.ref_name }}
          releaseBody: Automated tagged release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
