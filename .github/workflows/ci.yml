name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  dependency-cleanup:
    name: Complete secure dependency cleanup
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'agent/release-readiness-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install current dependencies
        run: npm ci

      - name: Correct ESLint package and PostCSS override
        shell: bash
        run: |
          set -euo pipefail
          npm install --save-dev @eslint/js@10.0.1
          npm pkg set overrides.postcss=8.5.23
          npm install
          npm run format

      - name: Capture dependency audits
        id: cleanup_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > cleanup-audit-production.json
          production_status=$?
          npm audit --json > cleanup-audit-all.json
          full_status=$?
          cat cleanup-audit-production.json
          cat cleanup-audit-all.json
          echo "production_status=$production_status" >> "$GITHUB_OUTPUT"
          echo "full_status=$full_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture frontend validation
        id: cleanup_validation
        shell: bash
        run: |
          set +e
          : > cleanup-frontend-validation.log

          npm run format:check >> cleanup-frontend-validation.log 2>&1
          format_status=$?
          npm run lint >> cleanup-frontend-validation.log 2>&1
          lint_status=$?
          npm run test >> cleanup-frontend-validation.log 2>&1
          test_status=$?
          npm run build >> cleanup-frontend-validation.log 2>&1
          build_status=$?

          cat cleanup-frontend-validation.log
          echo "format_status=$format_status" >> "$GITHUB_OUTPUT"
          echo "lint_status=$lint_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-cleanup-evidence
          path: |
            cleanup-audit-production.json
            cleanup-audit-all.json
            cleanup-frontend-validation.log
          if-no-files-found: error
          retention-days: 14

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No dependency cleanup changes were required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src
          git commit -m "fix(deps): complete secure frontend cleanup [dependency-cleanup-complete]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Enforce cleanup results
        shell: bash
        run: |
          [[ "${{ steps.cleanup_audit.outputs.production_status }}" == "0" ]]
          [[ "${{ steps.cleanup_audit.outputs.full_status }}" == "0" ]]
          [[ "${{ steps.cleanup_validation.outputs.format_status }}" == "0" ]]
          [[ "${{ steps.cleanup_validation.outputs.lint_status }}" == "0" ]]
          [[ "${{ steps.cleanup_validation.outputs.test_status }}" == "0" ]]
          [[ "${{ steps.cleanup_validation.outputs.build_status }}" == "0" ]]

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Capture production npm dependency audit
        id: production_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          status=$?
          cat npm-audit-production.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture full npm dependency audit
        id: full_audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          status=$?
          cat npm-audit-all.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload npm audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-reports
          path: |
            npm-audit-production.json
            npm-audit-all.json
          if-no-files-found: error
          retention-days: 14

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --workspace --all-targets --all-features -- --test-threads=2

      - name: Test poker-core directly
        run: cargo test -p poker-core --all-targets --all-features

      - name: Audit poker-core dependency tree
        run: cargo tree -p poker-core

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test

      - name: Build frontend
        run: npm run build

      - name: Enforce npm dependency audit results
        shell: bash
        run: |
          [[ "${{ steps.production_audit.outputs.status }}" == "0" ]]
          [[ "${{ steps.full_audit.outputs.status }}" == "0" ]]

  geometry:
    name: Browser geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Test browser geometry
        run: npm run test:geometry

  release:
    name: Release bundle
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish tagged bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Desktop Poker ${{ github.ref_name }}
          releaseBody: Automated tagged release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
