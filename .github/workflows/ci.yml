name: CI

# This workflow proves automated correctness and Linux artifact construction.
# Graphical application launch, live LAN play, keychain behavior, and live LLM
# providers remain separate manual release-readiness gates.

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  apply-embedded-local-llm:
    name: Apply embedded local LLM
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply embedded LLM implementation
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.embedded_patch.part.* > /tmp/apply_embedded_llm_changes.py
          python3 -m py_compile /tmp/apply_embedded_llm_changes.py
          python3 /tmp/apply_embedded_llm_changes.py
          npm ci
          cargo fmt
          npm run format
          cargo generate-lockfile

      - name: Remove one-time application machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/.embedded_patch.part.*
          rm -f .github/workflows/apply-embedded-llm.yml
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          start = text.index('\n  apply-embedded-local-llm:\n')
          end = text.index('\n  verify:\n', start)
          text = text[:start] + text[end:]
          text = text.replace('  cancel-in-progress: false\n', '  cancel-in-progress: true\n', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit implementation to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Add embedded GGUF NPC inference"
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "push raced with another master update; retrying ($attempt/8)"
            sleep 3
          done
          echo "failed to push embedded LLM implementation after retries" >&2
          exit 1

  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Record baseline environment
        shell: bash
        run: |
          {
            echo "git_sha=$(git rev-parse HEAD)"
            echo "git_ref=${GITHUB_REF}"
            uname -a
            cat /etc/os-release
          } | tee validation-environment.log

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Record toolchain versions
        shell: bash
        run: |
          {
            node --version
            npm --version
            rustc --version
            cargo --version
            rustup show active-toolchain
          } | tee validation-toolchains.log

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Capture production npm dependency audit
        id: production_audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit-production.json
          status=$?
          cat npm-audit-production.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Capture full npm dependency audit
        id: full_audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit-all.json
          status=$?
          cat npm-audit-all.json
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Lint Rust
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-targets --all-features -- --test-threads=2 2>&1 | tee rust-workspace-tests.log

      - name: Test poker-core directly
        run: cargo test -p poker-core --all-targets --all-features 2>&1 | tee poker-core-tests.log

      - name: List Rust tests and ignored coverage
        run: cargo test --workspace --all-targets --all-features -- --list 2>&1 | tee rust-test-list.log

      - name: Audit poker-core dependency tree
        run: cargo tree -p poker-core 2>&1 | tee poker-core-dependency-tree.log

      - name: Check frontend formatting
        run: npm run format:check

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test 2>&1 | tee frontend-tests.log

      - name: Build frontend
        run: npm run build 2>&1 | tee frontend-build.log

      - name: Enforce npm dependency audit results
        shell: bash
        run: |
          [[ "${{ steps.production_audit.outputs.status }}" == "0" ]]
          [[ "${{ steps.full_audit.outputs.status }}" == "0" ]]

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-evidence
          path: |
            validation-environment.log
            validation-toolchains.log
            npm-audit-production.json
            npm-audit-all.json
            rust-workspace-tests.log
            poker-core-tests.log
            rust-test-list.log
            poker-core-dependency-tree.log
            frontend-tests.log
            frontend-build.log
          if-no-files-found: warn
          retention-days: 30

  geometry:
    name: Browser geometry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Test browser geometry
        run: npm run test:geometry 2>&1 | tee browser-geometry-tests.log

      - name: Upload geometry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-geometry-evidence
          path: browser-geometry-tests.log
          if-no-files-found: error
          retention-days: 30

  release-candidate:
    name: Release candidate artifacts
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build release binary and Debian package
        run: npm run tauri build -- --bundles deb 2>&1 | tee release-build.log

      - name: Inventory release artifacts
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/desktop-poker"
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -x "$binary"
          test -n "$deb"
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "binary=$binary"
            file "$binary"
            ls -lh "$binary"
            sha256sum "$binary"
            echo "deb=$deb"
            file "$deb"
            ls -lh "$deb"
            sha256sum "$deb"
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          } | tee release-artifact-inventory.log
          mkdir -p release-candidate-artifacts
          cp "$binary" release-candidate-artifacts/
          cp "$deb" release-candidate-artifacts/

      - name: Upload release candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-candidate
          path: |
            release-candidate-artifacts/
            release-build.log
            release-artifact-inventory.log
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release bundle
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish tagged bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Desktop Poker ${{ github.ref_name }}
          releaseBody: Automated tagged release for ${{ github.ref_name }}.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
