name: Runtime hardening remote timeout integration

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-remote-timeout-integration.trigger

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply and validate remote timeout integration
        id: preflight
        shell: bash
        run: |
          set +e
          log=remote-timeout-integration-preflight.log
          : > "$log"
          python3 scripts/runtime_hardening_remote_timeout_integration_once.py >>"$log" 2>&1
          apply_status=$?
          if (( apply_status == 0 )); then
            cargo fmt --all >>"$log" 2>&1
            fmt_status=$?
          else
            fmt_status=1
          fi
          if (( apply_status == 0 && fmt_status == 0 )); then
            cargo clippy --workspace --all-targets -- -D warnings >>"$log" 2>&1
            clippy_status=$?
          else
            clippy_status=1
          fi
          if (( apply_status == 0 && fmt_status == 0 && clippy_status == 0 )); then
            cargo test --workspace --all-targets >>"$log" 2>&1
            test_status=$?
          else
            test_status=1
          fi
          printf 'apply=%s\nfmt=%s\nclippy=%s\ntest=%s\n' \
            "$apply_status" "$fmt_status" "$clippy_status" "$test_status" >>"$log"
          if (( apply_status == 0 && fmt_status == 0 && clippy_status == 0 && test_status == 0 )); then
            echo 'result=success' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failure' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit validated remote timeout integration
        if: steps.preflight.outputs.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runtime-hardening-remote-timeout-integration.trigger
          rm .github/workflows/runtime-hardening-remote-timeout-integration-once.yml
          rm scripts/runtime_hardening_remote_timeout_integration_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/networking/runtime/tests/end_to_end/basic.rs \
            scripts/runtime_hardening_remote_timeout_integration_once.py \
            .github/runtime-hardening-remote-timeout-integration.trigger \
            .github/workflows/runtime-hardening-remote-timeout-integration-once.yml
          if git ls-files --error-unmatch docs/runtime-validation/remote-timeout-integration-preflight-latest.log >/dev/null 2>&1; then
            rm -f docs/runtime-validation/remote-timeout-integration-preflight-latest.log
            git add -A -- docs/runtime-validation/remote-timeout-integration-preflight-latest.log
          fi
          git commit -m "Add real remote timeout publication regression"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
      - name: Publish remote-timeout preflight failure
        if: steps.preflight.outputs.result == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p docs/runtime-validation
          cp remote-timeout-integration-preflight.log docs/runtime-validation/remote-timeout-integration-preflight-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime-validation/remote-timeout-integration-preflight-latest.log
          git commit -m "docs: record remote-timeout integration preflight failure [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
