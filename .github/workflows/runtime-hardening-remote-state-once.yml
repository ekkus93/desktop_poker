name: Runtime hardening remote state invariants

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-remote-state.trigger

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply and validate remote-state hardening
        id: preflight
        shell: bash
        run: |
          set +e
          log=remote-state-preflight.log
          : > "$log"
          python3 scripts/runtime_hardening_remote_commit_rollback_once.py >>"$log" 2>&1
          rollback_status=$?
          if (( rollback_status == 0 )); then
            python3 scripts/runtime_hardening_remote_state_normalization_once.py >>"$log" 2>&1
            normalization_status=$?
          else
            normalization_status=1
          fi
          if (( rollback_status == 0 && normalization_status == 0 )); then
            cargo fmt --all >>"$log" 2>&1
            fmt_status=$?
          else
            fmt_status=1
          fi
          if (( rollback_status == 0 && normalization_status == 0 && fmt_status == 0 )); then
            cargo clippy --workspace --all-targets -- -D warnings >>"$log" 2>&1
            clippy_status=$?
          else
            clippy_status=1
          fi
          if (( rollback_status == 0 && normalization_status == 0 && fmt_status == 0 && clippy_status == 0 )); then
            cargo test --workspace --all-targets >>"$log" 2>&1
            test_status=$?
          else
            test_status=1
          fi
          printf 'rollback=%s\nnormalization=%s\nfmt=%s\nclippy=%s\ntest=%s\n' \
            "$rollback_status" "$normalization_status" "$fmt_status" "$clippy_status" "$test_status" >>"$log"
          if (( rollback_status == 0 && normalization_status == 0 && fmt_status == 0 && clippy_status == 0 && test_status == 0 )); then
            echo 'result=success' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failure' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit validated remote-state hardening
        if: steps.preflight.outputs.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runtime-hardening-remote-state.trigger
          rm .github/workflows/runtime-hardening-remote-state-once.yml
          rm scripts/runtime_hardening_remote_commit_rollback_once.py
          rm scripts/runtime_hardening_remote_state_normalization_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/networking/runtime/handlers.rs \
            src-tauri/src/networking/runtime/tests/action_outcomes.rs \
            scripts/runtime_hardening_remote_commit_rollback_once.py \
            scripts/runtime_hardening_remote_state_normalization_once.py \
            .github/runtime-hardening-remote-state.trigger \
            .github/workflows/runtime-hardening-remote-state-once.yml
          git commit -m "Preserve remote action state convergence"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
      - name: Publish remote-state preflight failure
        if: steps.preflight.outputs.result == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p docs/runtime-validation
          cp remote-state-preflight.log docs/runtime-validation/remote-state-preflight-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime-validation/remote-state-preflight-latest.log
          git commit -m "docs: record remote-state preflight failure [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
