name: Fix timeout state synchronization

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-timeout-state-sync.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: timeout-state-sync-repair
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  fix-timeout-sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Apply transactional repair
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply_timeout_transaction_fix.py \
            2>&1 | tee timeout-transaction-patch.log
          cargo fmt --all

      - name: Run focused regressions
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all --check
            cargo test -p poker-core \
              tournament::tests::core::submit_action_invalid_raise_rolls_back_controller_state \
              -- --exact --nocapture
            cargo test -p desktop-poker \
              networking::runtime::tests::tournament::stale_submission_that_commits_timeout_synchronizes_authoritative_state \
              -- --exact --nocapture
          } 2>&1 | tee timeout-transaction-verify.log

      - name: Commit verified repair or diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            rm \
              .github/workflows/fix-timeout-state-sync.yml \
              scripts/apply_timeout_transaction_fix.py
            rm -f docs/runtime-validation/timeout-sync-repair-latest.md
            git add \
              crates/poker-core/src/tournament/mod.rs \
              crates/poker-core/src/tournament/controller_core.rs \
              crates/poker-core/src/tournament/tests/core.rs \
              src-tauri/src/networking/runtime/host.rs \
              src-tauri/src/networking/runtime/tests/tournament.rs \
              docs/runtime-validation/timeout-sync-repair-latest.md \
              .github/workflows/fix-timeout-state-sync.yml \
              scripts/apply_timeout_transaction_fix.py
            git commit -m "fix: make rejected actions transactional"
          else
            git restore \
              crates/poker-core/src/tournament/mod.rs \
              crates/poker-core/src/tournament/controller_core.rs \
              crates/poker-core/src/tournament/tests/core.rs \
              src-tauri/src/networking/runtime/host.rs \
              src-tauri/src/networking/runtime/tests/tournament.rs
            mkdir -p docs/runtime-validation
            {
              echo "# Transactional Action Repair Diagnostic"
              echo
              echo "- Staging commit: \`$GITHUB_SHA\`"
              echo "- Workflow run: \`$GITHUB_RUN_ID\`"
              echo "- Patch outcome: \`$PATCH_OUTCOME\`"
              echo "- Verification outcome: \`$VERIFY_OUTCOME\`"
              echo
              echo '## Patch log'
              echo
              echo '```text'
              tail -n 200 timeout-transaction-patch.log 2>/dev/null || true
              echo '```'
              echo
              echo '## Verification log'
              echo
              echo '```text'
              tail -n 400 timeout-transaction-verify.log 2>/dev/null || true
              echo '```'
            } > docs/runtime-validation/timeout-sync-repair-latest.md
            git add docs/runtime-validation/timeout-sync-repair-latest.md
            git commit -m "docs: record transactional action repair failure"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
                gh workflow run ci.yml --ref master
                gh workflow run runtime-full-game-validation.yml --ref master
              fi
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish transactional action repair result" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
