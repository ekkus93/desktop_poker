name: Embedded tiny-model NPC validation

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/embedded-model-ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
  pull_request:
    paths:
      - ".github/workflows/embedded-model-ci.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embedded-model-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a
  MODEL_FILE: SmolLM2-135M-Instruct-Q3_K_M.gguf
  MODEL_SHA256: 3e8e1ce198396779d5a8e60e20c469ad5e064624f4e99790af40de57b46fec95

jobs:
  embedded-model:
    name: Real in-process GGUF NPC decision
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \
            cmake \
            curl \
            ca-certificates \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Cache pinned GGUF model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .cache/embedded-models
          key: smollm2-135m-instruct-q3-k-m-${{ env.MODEL_SHA256 }}

      - name: Download pinned GGUF model
        id: model-download
        if: steps.model-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/embedded-models
          curl \
            --fail \
            --location \
            --retry 4 \
            --retry-all-errors \
            --output ".cache/embedded-models/${MODEL_FILE}.partial" \
            "https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/8637628/SmolLM2-135M-Instruct-Q3_K_M.gguf?download=true"
          mv \
            ".cache/embedded-models/${MODEL_FILE}.partial" \
            ".cache/embedded-models/${MODEL_FILE}"

      - name: Verify pinned model checksum
        id: checksum
        shell: bash
        run: |
          set -euo pipefail
          model="$GITHUB_WORKSPACE/.cache/embedded-models/${MODEL_FILE}"
          test -f "$model"
          actual="$(sha256sum "$model" | awk '{print $1}')"
          printf 'expected=%s\nactual=%s\n' "$MODEL_SHA256" "$actual" \
            | tee embedded-model.sha256
          test "$actual" = "$MODEL_SHA256"

      - name: Run real embedded NPC inference smoke
        id: smoke
        env:
          DESKTOP_POKER_REQUIRE_EMBEDDED_MODEL: "1"
          DESKTOP_POKER_EMBEDDED_TEST_MODEL: ${{ github.workspace }}/.cache/embedded-models/SmolLM2-135M-Instruct-Q3_K_M.gguf
        run: |
          set -o pipefail
          cargo test -p desktop-poker --test embedded_npc_smoke -- --nocapture \
            2>&1 | tee embedded-model-smoke.log

      - name: Publish durable embedded-model result
        if: always() && github.ref == 'refs/heads/master'
        env:
          CHECKSUM_OUTCOME: ${{ steps.checksum.outcome }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/runtime-validation
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          checksum = os.environ.get("CHECKSUM_OUTCOME", "not-run")
          smoke = os.environ.get("SMOKE_OUTCOME", "not-run")
          result = "PASS" if checksum == "success" and smoke == "success" else "FAIL"
          payload = {
              "result": result,
              "validatedCommit": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "recordedAtUtc": datetime.now(timezone.utc).isoformat(),
              "model": os.environ["MODEL_FILE"],
              "modelSha256": os.environ["MODEL_SHA256"],
              "checksumOutcome": checksum,
              "inferenceOutcome": smoke,
              "evidenceArtifact": "embedded-tiny-model-npc-evidence",
          }
          json_path = Path("docs/runtime-validation/embedded-model-latest.json")
          md_path = Path("docs/runtime-validation/embedded-model-latest.md")
          json_path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          md_path.write_text(
              "# Embedded tiny-model NPC validation\n\n"
              f"- Result: **{result}**\n"
              f"- Validated commit: `{payload['validatedCommit']}`\n"
              f"- Workflow run: `{payload['workflowRunId']}`\n"
              f"- Model: `{payload['model']}`\n"
              f"- SHA-256: `{payload['modelSha256']}`\n"
              f"- Checksum: `{checksum}`\n"
              f"- Real inference: `{smoke}`\n",
              encoding="utf-8",
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/runtime-validation/embedded-model-latest.json \
            docs/runtime-validation/embedded-model-latest.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: record embedded tiny-model validation result"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 3
          done
          exit 1

      - name: Upload embedded-model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-tiny-model-npc-evidence
          path: |
            embedded-model.sha256
            embedded-model-smoke.log
          if-no-files-found: warn
          retention-days: 30
