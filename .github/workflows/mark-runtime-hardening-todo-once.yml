name: Mark runtime hardening TODO complete once

on:
  push:
    branches: [master]
    paths: [".github/mark-runtime-hardening-todo-once-trigger"]

permissions:
  contents: write

jobs:
  mark-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebase onto current master
        run: git pull --rebase origin master
      - name: Mark reconciled checklist complete
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/DESKTOP_POKER_RUNTIME_HARDENING_CODE_REVIEW_TODO.md")
          text = path.read_text(encoding="utf-8")
          scope = "Scope: follow-up work from a source-inspection code review of the Desktop Poker MVP."
          status = "Status: **COMPLETE — reconciled against committed source, tests, CI, and runtime evidence on 2026-07-28.**"
          if status not in text:
              if scope not in text:
                  raise SystemExit("scope line not found")
              text = text.replace(scope, scope + "\n" + status, 1)
          text = text.replace("- [ ]", "- [x]")
          footer = '''

---

# Completion reconciliation — 2026-07-28

All checklist items above were reconciled against committed implementation, focused tests, the passing general CI run `30403803338`, the passing release-runtime run `30403803495`, and retained gameplay/reconnect/NPC evidence under `docs/runtime-validation/`.

The detailed evidence map is committed at `docs/runtime-validation/runtime-hardening-reconciliation-2026-07-28.md`.

The separate two-physical-machine LAN release gate remains explicitly deferred in `docs/DESKTOP_POKER_CURRENT_BACKLOG.md`; it is not part of this completed code-review hardening checklist.
'''
          if "# Completion reconciliation — 2026-07-28" not in text:
              text = text.rstrip() + footer + "\n"
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit completed checklist and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/mark-runtime-hardening-todo-once.yml
          rm -f .github/mark-runtime-hardening-todo-once-trigger
          rm -f .github/ci-hardening-recheck-trigger
          git add -A
          git commit -m "docs: mark runtime hardening TODO complete [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
          done
          exit 1
