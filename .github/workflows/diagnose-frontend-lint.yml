name: Diagnose frontend lint

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/diagnose-frontend-lint.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-frontend-lint
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  diagnose:
    name: Reproduce Verify through frontend lint
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Reproduce all preceding Verify steps
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > /dev/null || true
          npm audit --json > /dev/null || true
          cargo fmt --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features -- --test-threads=2
          cargo test -p poker-core --all-targets --all-features
          cargo test --workspace --all-targets --all-features -- --list > /dev/null
          cargo tree -p poker-core > /dev/null
          npm run format:check

      - name: Capture exact frontend lint result after Rust verification
        id: lint
        shell: bash
        run: |
          set +e
          {
            echo "--- git status before lint ---"
            git status --short --untracked-files=all
            echo "--- generated paths before lint ---"
            find . -maxdepth 4 -type f \
              \( -path './target/*' -o -path './src-tauri/gen/*' -o -path './dist/*' \) \
              -print | sort
            echo "--- npm run lint ---"
            npm run lint
          } > frontend-lint-diagnostic.log 2>&1
          status=$?
          cat frontend-lint-diagnostic.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish frontend lint diagnostic
        env:
          LINT_STATUS: ${{ steps.lint.outputs.status }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/runtime-validation
          cp frontend-lint-diagnostic.log docs/runtime-validation/frontend-lint-diagnostic-latest.log
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = int(os.environ["LINT_STATUS"])
          payload = {
              "result": "PASS" if status == 0 else "FAIL",
              "validatedCommit": os.environ["GITHUB_SHA"],
              "workflowRunId": os.environ["GITHUB_RUN_ID"],
              "workflowRunAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "recordedAtUtc": datetime.now(timezone.utc).isoformat(),
              "frontendLintExitStatus": status,
              "ordering": "full Verify sequence through frontend lint",
          }
          Path("docs/runtime-validation/frontend-lint-diagnostic-latest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/runtime-validation/frontend-lint-diagnostic-latest.log \
            docs/runtime-validation/frontend-lint-diagnostic-latest.json
          git commit -m "docs: record ordered frontend lint diagnostic result"
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 3
          done
          exit 1
