name: Patch reconnect legal-action labels

# Existing workflow update intentionally triggers this one-time patch.
on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/patch-reconnect-legal-action-labels.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-reconnect-legal-action-labels
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize public legal-action labels
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B reconnect-legal-action-labels origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/runtime_reconnect_failure_matrix.py")
          text = path.read_text(encoding="utf-8")
          old = '''            legal = client_tray.get("legalActions")
            if not isinstance(legal, list) or "checkOrCall" not in legal:
                raise AssertionError(
                    f"post-reconnect client action tray lacks checkOrCall: {client_tray!r}"
                )
            payload = {
'''
          new = '''            legal = client_tray.get("legalActions")
            if not isinstance(legal, list):
                raise AssertionError(
                    f"post-reconnect client action tray has no legalActions: {client_tray!r}"
                )
            legal_tokens = {
                str(action).strip().lower().replace("-", "").replace(" ", "")
                for action in legal
            }
            if "call" not in legal_tokens and "check" not in legal_tokens:
                raise AssertionError(
                    f"post-reconnect client action tray lacks Call/Check: {client_tray!r}"
                )
            payload = {
'''
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              text = text.replace(old, new, 1)
          elif old_count == 0 and new_count == 1:
              pass
          else:
              raise SystemExit(
                  f"unexpected reconnect action-check state: old={old_count}, new={new_count}"
              )
          path.write_text(text, encoding="utf-8")
          PY

          python3 -m py_compile scripts/runtime_reconnect_failure_matrix.py
          rm .github/workflows/patch-reconnect-legal-action-labels.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: normalize reconnect legal-action labels"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
