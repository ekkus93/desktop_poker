name: Fix completion projection

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: completion-projection-repair
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  repair-completion-projection:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Apply completion projection repair
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply_completion_projection_fix.py \
            2>&1 | tee completion-projection-patch.log
          cargo fmt --all

      - name: Run focused and package regressions
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all --check
            cargo test -p desktop-poker \
              app_state::tests::units::tournament_complete_clears_hand_and_reconciles_final_placements \
              -- --exact --nocapture
            cargo test -p desktop-poker \
              networking::runtime::tests::misc::completion_transition_never_emits_winner_as_eliminated \
              -- --exact --nocapture
            cargo test -p desktop-poker -- --test-threads=2
          } 2>&1 | tee completion-projection-verify.log

      - name: Publish verified repair or diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            rm \
              .github/workflows/fix-completion-projection.yml \
              scripts/apply_completion_projection_fix.py
            git add \
              src-tauri/src/networking/runtime/events.rs \
              src-tauri/src/networking/runtime/tests/misc.rs \
              src-tauri/src/app_state/live_events.rs \
              src-tauri/src/app_state/tests/units.rs \
              .github/workflows/fix-completion-projection.yml \
              scripts/apply_completion_projection_fix.py
            git commit -m "fix: reconcile tournament completion projections"
          else
            git restore \
              src-tauri/src/networking/runtime/events.rs \
              src-tauri/src/networking/runtime/tests/misc.rs \
              src-tauri/src/app_state/live_events.rs \
              src-tauri/src/app_state/tests/units.rs
            rm \
              .github/workflows/fix-completion-projection.yml \
              scripts/apply_completion_projection_fix.py
            mkdir -p docs/runtime-validation
            {
              echo "# Completion Projection Repair Diagnostic"
              echo
              echo "- Staging commit: \`$GITHUB_SHA\`"
              echo "- Workflow run: \`$GITHUB_RUN_ID\`"
              echo "- Patch outcome: \`$PATCH_OUTCOME\`"
              echo "- Verification outcome: \`$VERIFY_OUTCOME\`"
              echo
              echo '## Patch log'
              echo
              echo '```text'
              tail -n 200 completion-projection-patch.log 2>/dev/null || true
              echo '```'
              echo
              echo '## Verification log'
              echo
              echo '```text'
              tail -n 500 completion-projection-verify.log 2>/dev/null || true
              echo '```'
            } > docs/runtime-validation/completion-projection-repair-latest.md
            git add \
              docs/runtime-validation/completion-projection-repair-latest.md \
              .github/workflows/fix-completion-projection.yml \
              scripts/apply_completion_projection_fix.py
            git commit -m "docs: record completion projection repair failure"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
                gh workflow run ci.yml --ref master
                gh workflow run runtime-validation.yml --ref master
                gh workflow run runtime-full-game-validation.yml --ref master
              fi
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish completion projection repair result" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
