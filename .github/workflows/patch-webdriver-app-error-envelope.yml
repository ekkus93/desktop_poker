name: Patch WebDriver application error envelope

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/patch-webdriver-app-error-envelope.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-webdriver-app-error-envelope
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Distinguish WebDriver errors from application envelopes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B webdriver-app-error-envelope origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/runtime_webdriver_smoke.py")
          text = path.read_text(encoding="utf-8")
          old = '        if isinstance(value, dict) and value.get("error"):\n'
          new = '''        if (
            isinstance(value, dict)
            and value.get("error")
            and not isinstance(value.get("ok"), bool)
        ):
'''
          if text.count(old) != 1:
              raise SystemExit(
                  f"expected exactly one WebDriver error discriminator, found {text.count(old)}"
              )
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          python3 -m py_compile scripts/runtime_webdriver_smoke.py
          rm .github/workflows/patch-webdriver-app-error-envelope.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: preserve expected application error envelopes"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
