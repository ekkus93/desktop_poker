name: Fix completion history persistence

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: completion-history-persistence-repair
  cancel-in-progress: true

jobs:
  repair-completion-history-persistence:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Apply completion history persistence repair
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply_completion_history_persistence_fix.py \
            2>&1 | tee completion-history-persistence-patch.log
          npm run format

      - name: Run frontend regressions
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            npm run format:check
            npm run lint
            npm test -- --run src/screens/TournamentCompleteScreen.test.tsx
            npm test -- --run
            npm run build
          } 2>&1 | tee completion-history-persistence-verify.log

      - name: Publish verified repair or diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            rm \
              .github/workflows/fix-completion-history-persistence.yml \
              scripts/apply_completion_history_persistence_fix.py
            git add \
              src/screens/TournamentCompleteScreen.tsx \
              src/screens/TournamentCompleteScreen.test.tsx \
              .github/workflows/fix-completion-history-persistence.yml \
              scripts/apply_completion_history_persistence_fix.py
            git commit -m "fix: persist final history from completion screen"
          else
            git restore \
              src/screens/TournamentCompleteScreen.tsx \
              src/screens/TournamentCompleteScreen.test.tsx
            rm \
              .github/workflows/fix-completion-history-persistence.yml \
              scripts/apply_completion_history_persistence_fix.py
            mkdir -p docs/runtime-validation
            {
              echo "# Completion History Persistence Repair Diagnostic"
              echo
              echo "- Staging commit: \`$GITHUB_SHA\`"
              echo "- Workflow run: \`$GITHUB_RUN_ID\`"
              echo "- Patch outcome: \`$PATCH_OUTCOME\`"
              echo "- Verification outcome: \`$VERIFY_OUTCOME\`"
              echo
              echo '## Patch log'
              echo
              echo '```text'
              tail -n 200 completion-history-persistence-patch.log 2>/dev/null || true
              echo '```'
              echo
              echo '## Verification log'
              echo
              echo '```text'
              tail -n 500 completion-history-persistence-verify.log 2>/dev/null || true
              echo '```'
            } > docs/runtime-validation/completion-history-persistence-repair-latest.md
            git add \
              docs/runtime-validation/completion-history-persistence-repair-latest.md \
              .github/workflows/fix-completion-history-persistence.yml \
              scripts/apply_completion_history_persistence_fix.py
            git commit -m "docs: record completion history persistence repair failure"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
                gh workflow run ci.yml --ref master
                gh workflow run runtime-validation.yml --ref master
                gh workflow run runtime-full-game-validation.yml --ref master
              fi
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish completion history persistence repair result" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
