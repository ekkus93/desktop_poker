name: Fix persistence warning lint once

on:
  push:
    branches: [master]
    paths: [".github/persistence-warning-lint-once-trigger"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Defer persistence warning state update
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/app/DesktopShellProvider.tsx")
          text = path.read_text(encoding="utf-8")
          old = '''  const recordPersistenceFailure = useCallback((_message: string) => {
            setRuntimeWarnings((currentWarnings) =>
              currentWarnings.includes(LOCAL_PERSISTENCE_WARNING)
                ? currentWarnings
                : [...currentWarnings, LOCAL_PERSISTENCE_WARNING],
            );
          }, []);'''
          new = '''  const recordPersistenceFailure = useCallback((message: string) => {
            void message;
            queueMicrotask(() => {
              setRuntimeWarnings((currentWarnings) =>
                currentWarnings.includes(LOCAL_PERSISTENCE_WARNING)
                  ? currentWarnings
                  : [...currentWarnings, LOCAL_PERSISTENCE_WARNING],
              );
            });
          }, []);'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one persistence warning block, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit lint fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/DesktopShellProvider.tsx
          git commit -m "Defer persistence warning state updates"
          git pull --rebase origin master
          git push origin HEAD:master
