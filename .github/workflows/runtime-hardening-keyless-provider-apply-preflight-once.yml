name: Runtime hardening keyless provider apply preflight

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-keyless-provider-apply-preflight.trigger

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and capture diff
        id: preflight
        shell: bash
        run: |
          set +e
          log=keyless-provider-storage-apply-preflight.log
          : > "$log"
          python3 scripts/runtime_hardening_keyless_provider_storage_once.py >>"$log" 2>&1
          status=$?
          if (( status == 0 )); then
            git diff --check >>"$log" 2>&1
            diff_status=$?
            git diff --stat >>"$log" 2>&1
          else
            diff_status=1
          fi
          printf '\napply=%s\ndiff_check=%s\n' "$status" "$diff_status" >>"$log"
          exit 0
      - name: Publish preflight and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p docs/runtime-validation
          cp keyless-provider-storage-apply-preflight.log \
            docs/runtime-validation/keyless-provider-storage-apply-preflight-latest.log
          rm .github/runtime-hardening-keyless-provider-apply-preflight.trigger
          rm .github/workflows/runtime-hardening-keyless-provider-apply-preflight-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            docs/runtime-validation/keyless-provider-storage-apply-preflight-latest.log \
            .github/runtime-hardening-keyless-provider-apply-preflight.trigger \
            .github/workflows/runtime-hardening-keyless-provider-apply-preflight-once.yml
          git commit -m "docs: record keyless provider patch preflight [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
