name: Finalize P2 UI hardening

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/finalize-p2-ui-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-p2-ui-hardening
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply audited UI hardening
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B finalize-p2-ui-hardening origin/master

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one old anchor, found {count}")
              return text.replace(old, new, 1)

          join_path = Path("src/screens/JoinTournamentScreen.tsx")
          join = join_path.read_text(encoding="utf-8")

          normalise_anchor = '''function normaliseError(error: unknown) {
            return error instanceof Error
              ? error.message
              : "The invite could not be checked.";
          }
          '''
          join_helper = normalise_anchor + '''
          function describeJoinFailure(error: unknown, payload: JoinPayload) {
            return `Unable to connect to ${payload.hostAddress}:${payload.hostPort}. ${normaliseError(error)} The invite can be valid even when the host is offline or blocked by a firewall.`;
          }
          '''
          join = replace_once(
              join,
              normalise_anchor,
              join_helper,
              "join failure helper",
          )
          join = replace_once(
              join,
              '''        setJoinError(normaliseError(error));
                  setInviteBanner("Invite already attached to this launch.");
          ''',
              '''        setJoinError(
                    describeJoinFailure(error, bootstrap.parsedLaunchJoinPayload),
                  );
                  setInviteBanner("Invite already attached to this launch.");
          ''',
              "launch auto-join failure",
          )
          join = replace_once(
              join,
              '''    } catch (error) {
                setJoinError(normaliseError(error));
              } finally {
          ''',
              '''    } catch (error) {
                setJoinError(describeJoinFailure(error, validationState.payload));
              } finally {
          ''',
              "manual join failure",
          )
          join_replacements = {
              "`Ready: ${parsedPayload.hostAddress}:${parsedPayload.hostPort}`":
                  "`Invite decoded: ${parsedPayload.hostAddress}:${parsedPayload.hostPort}`",
              '      : "Invite checked. Join when ready."':
                  '      : "Invite decoded. Connecting is the host reachability check."',
              "Checking the invite and host details…":
                  "Checking the invite format and signed host details…",
              '<p className="kicker">Invite looks good</p>':
                  '<p className="kicker">Invite decoded</p>',
              '<strong>Lobby ready</strong>':
                  '<strong>Reachability not checked</strong>',
          }
          for old, new in join_replacements.items():
              join = replace_once(join, old, new, f"join copy {old}")
          join_path.write_text(join, encoding="utf-8")

          join_test_path = Path("src/screens/JoinTournamentScreen.test.tsx")
          join_test = join_test_path.read_text(encoding="utf-8")
          join_test = replace_once(
              join_test,
              'expect(screen.getByText("Ready: 192.168.1.10:43818")).toBeTruthy();',
              '''expect(
                screen.getByText("Invite decoded: 192.168.1.10:43818"),
              ).toBeTruthy();''',
              "decoded invite assertion",
          )
          join_test = replace_once(
              join_test,
              'expect(screen.getByText(/invite checked\\. join when ready/i)).toBeTruthy();',
              '''expect(
                screen.getByText(/connecting is the host reachability check/i),
              ).toBeTruthy();
              expect(screen.getByText(/reachability not checked/i)).toBeTruthy();''',
              "reachability distinction assertion",
          )
          join_test = replace_once(
              join_test,
              'expect(await screen.findByText(/connection refused/i)).toBeTruthy();',
              '''expect(
                await screen.findByText(
                  /unable to connect to 192\\.168\\.1\\.10:43818.*connection refused.*offline or blocked by a firewall/i,
                ),
              ).toBeTruthy();''',
              "unreachable host assertion",
          )
          join_test_path.write_text(join_test, encoding="utf-8")

          host_path = Path("src/screens/HostTournamentSetupScreen.tsx")
          host = host_path.read_text(encoding="utf-8")
          clamp_anchor = '''function clampPort(value: string, fallbackPort: number) {
            const parsedValue = Number.parseInt(value, 10);
            if (Number.isNaN(parsedValue)) {
              return fallbackPort;
            }

            return Math.max(1, Math.min(65535, parsedValue));
          }
          '''
          host_helper = clamp_anchor + '''
          function describeHostStartError(error: unknown, hostPort: number) {
            const message =
              error instanceof Error
                ? error.message.trim()
                : "Unable to start hosting.";
            const normalized = message.toLowerCase();
            const portIsBusy =
              normalized.includes("address already in use") ||
              normalized.includes("port is already in use") ||
              normalized.includes("os error 98") ||
              normalized.includes("os error 48") ||
              normalized.includes("wsaeaddrinuse");

            if (portIsBusy) {
              return `Unable to start hosting on TCP port ${hostPort} because that port is already in use. Choose a different port and try again.`;
            }

            return `Unable to start hosting on TCP port ${hostPort}. ${message}`;
          }
          '''
          host = replace_once(
              host,
              clamp_anchor,
              host_helper,
              "host start error helper",
          )
          host = replace_once(
              host,
              '''    } catch (error) {
                setHostError(
                  error instanceof Error ? error.message : "Unable to start hosting.",
                );
                setHostSession(null);
          ''',
              '''    } catch (error) {
                setHostError(describeHostStartError(error, hostDraft.hostPort));
                setHostSession(null);
          ''',
              "host start catch",
          )
          host_path.write_text(host, encoding="utf-8")

          host_test_path = Path("src/screens/HostTournamentSetupScreen.test.tsx")
          host_test = host_test_path.read_text(encoding="utf-8")
          host_test = replace_once(
              host_test,
              'expect(await screen.findByText("Address already in use")).toBeTruthy();',
              '''expect(
                await screen.findByText(
                  /unable to start hosting on tcp port 43818 because that port is already in use.*choose a different port/i,
                ),
              ).toBeTruthy();''',
              "host bind assertion",
          )
          generic_test = '''  it("includes the attempted port for other safe host-start failures", async () => {
            const bootstrap = createBootstrap({ debugToolsEnabled: false });
            mockedStartHostSession.mockRejectedValueOnce(
              new Error("Permission denied"),
            );

            renderWithProviders(<HostTournamentSetupScreen bootstrap={bootstrap} />, {
              bootstrap,
              initialEntries: ["/host"],
            });

            fireEvent.click(
              await screen.findByRole("button", { name: /start hosting/i }),
            );

            expect(
              await screen.findByText(
                "Unable to start hosting on TCP port 43818. Permission denied",
              ),
            ).toBeTruthy();
          });

          '''
          if generic_test not in host_test:
              insertion = '  it("keeps critical setup options visible for legacy persisted host drafts", async () => {'
              if host_test.count(insertion) != 1:
                  raise SystemExit("generic host failure test insertion anchor missing")
              host_test = host_test.replace(insertion, generic_test + insertion, 1)
          host_test_path.write_text(host_test, encoding="utf-8")

          checks = {
              join_path: [
                  "Invite decoded:",
                  "Reachability not checked",
                  "describeJoinFailure",
              ],
              host_path: [
                  "describeHostStartError",
                  "Choose a different port and try again",
              ],
              join_test_path: ["host reachability check", "offline or blocked by a firewall"],
              host_test_path: ["includes the attempted port", "port is already in use"],
          }
          for path, markers in checks.items():
              final = path.read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in final:
                      raise SystemExit(f"{path}: missing postcondition {marker!r}")
          PY

          npm ci
          npm run format
          npm run format:check
          npm run lint
          npm run test -- --run
          npm run build
          git diff --check

          rm .github/workflows/finalize-p2-ui-hardening.yml
          npm run format:check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete P2 UI failure-path hardening"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
