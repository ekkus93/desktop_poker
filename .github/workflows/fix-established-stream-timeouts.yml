name: Fix established stream timeouts

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-established-stream-timeouts.yml"

permissions:
  actions: write
  contents: write

concurrency:
  group: established-stream-timeout-repair
  cancel-in-progress: true

env:
  DEBIAN_FRONTEND: noninteractive
  NEEDRESTART_MODE: a

jobs:
  repair-established-stream-timeouts:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev

      - name: Apply established stream timeout repair
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/apply_established_stream_timeout_fix.py \
            2>&1 | tee established-stream-timeout-patch.log
          cargo fmt --all

      - name: Run focused regression
        id: verify
        if: steps.patch.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            cargo fmt --all --check
            cargo test -p desktop-poker \
              networking::runtime::tests::misc::established_connections_clear_handshake_read_timeouts \
              -- --exact --nocapture
          } 2>&1 | tee established-stream-timeout-verify.log

      - name: Publish verified repair or diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -f docs/runtime-validation/established-stream-timeout-repair-latest.md

          if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
            rm \
              .github/workflows/fix-established-stream-timeouts.yml \
              scripts/apply_established_stream_timeout_fix.py
            git add \
              src-tauri/src/networking/runtime/mod.rs \
              src-tauri/src/networking/runtime/host.rs \
              src-tauri/src/networking/runtime/client_connect.rs \
              src-tauri/src/networking/runtime/tests/misc.rs \
              docs/runtime-validation/established-stream-timeout-repair-latest.md \
              .github/workflows/fix-established-stream-timeouts.yml \
              scripts/apply_established_stream_timeout_fix.py
            git commit -m "fix: clear handshake read timeouts after connect"
          else
            git restore \
              src-tauri/src/networking/runtime/mod.rs \
              src-tauri/src/networking/runtime/host.rs \
              src-tauri/src/networking/runtime/client_connect.rs \
              src-tauri/src/networking/runtime/tests/misc.rs
            rm \
              .github/workflows/fix-established-stream-timeouts.yml \
              scripts/apply_established_stream_timeout_fix.py
            mkdir -p docs/runtime-validation
            {
              echo "# Established Stream Timeout Repair Diagnostic"
              echo
              echo "- Staging commit: \`$GITHUB_SHA\`"
              echo "- Workflow run: \`$GITHUB_RUN_ID\`"
              echo "- Patch outcome: \`$PATCH_OUTCOME\`"
              echo "- Verification outcome: \`$VERIFY_OUTCOME\`"
              echo
              echo '## Patch log'
              echo
              echo '```text'
              tail -n 200 established-stream-timeout-patch.log 2>/dev/null || true
              echo '```'
              echo
              echo '## Verification log'
              echo
              echo '```text'
              tail -n 400 established-stream-timeout-verify.log 2>/dev/null || true
              echo '```'
            } > docs/runtime-validation/established-stream-timeout-repair-latest.md
            git add \
              docs/runtime-validation/established-stream-timeout-repair-latest.md \
              .github/workflows/fix-established-stream-timeouts.yml \
              scripts/apply_established_stream_timeout_fix.py
            git commit -m "docs: record established stream timeout repair failure"
          fi

          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin master
            git rebase origin/master
            if git push origin HEAD:master; then
              if [ "$PATCH_OUTCOME" = "success" ] && [ "$VERIFY_OUTCOME" = "success" ]; then
                gh workflow run ci.yml --ref master
                gh workflow run runtime-validation.yml --ref master
                gh workflow run runtime-full-game-validation.yml --ref master
              fi
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Unable to publish established stream timeout repair result" >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done
