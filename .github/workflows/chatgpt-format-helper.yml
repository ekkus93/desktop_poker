name: ChatGPT format helper

on:
  push:
    branches:
      - chatgpt/fix-durable-hand-history

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - uses: actions/upload-artifact@v4
        with:
          name: rustfmt-output
          path: |
            src-tauri/src/history_storage.rs
            src-tauri/src/lib.rs
          if-no-files-found: error
          retention-days: 1
