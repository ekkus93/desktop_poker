name: ChatGPT format helper

on:
  push:
    branches:
      - chatgpt/fix-durable-hand-history

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-durable-hand-history
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/history_storage.rs src-tauri/src/lib.rs
          git commit -m "style: apply rustfmt"
          git push origin HEAD:chatgpt/fix-durable-hand-history
