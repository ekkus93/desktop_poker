name: Runtime hardening abuse matrix

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-abuse-matrix.trigger

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Apply and validate abuse matrix
        id: preflight
        shell: bash
        run: |
          set +e
          log=abuse-matrix-preflight.log
          : > "$log"
          python3 scripts/runtime_hardening_abuse_matrix_once.py >>"$log" 2>&1
          matrix_status=$?
          if (( matrix_status == 0 )); then
            python3 scripts/runtime_hardening_abuse_signature_once.py >>"$log" 2>&1
            signature_status=$?
          else
            signature_status=1
          fi
          if (( matrix_status == 0 && signature_status == 0 )); then
            cargo fmt --all >>"$log" 2>&1
            fmt_status=$?
          else
            fmt_status=1
          fi
          if (( matrix_status == 0 && signature_status == 0 && fmt_status == 0 )); then
            cargo clippy --workspace --all-targets -- -D warnings >>"$log" 2>&1
            clippy_status=$?
          else
            clippy_status=1
          fi
          if (( matrix_status == 0 && signature_status == 0 && fmt_status == 0 && clippy_status == 0 )); then
            cargo test --workspace --all-targets >>"$log" 2>&1
            test_status=$?
          else
            test_status=1
          fi
          printf 'matrix=%s\nsignature=%s\nfmt=%s\nclippy=%s\ntest=%s\n' \
            "$matrix_status" "$signature_status" "$fmt_status" "$clippy_status" "$test_status" >>"$log"
          if (( matrix_status == 0 && signature_status == 0 && fmt_status == 0 && clippy_status == 0 && test_status == 0 )); then
            echo 'result=success' >> "$GITHUB_OUTPUT"
          else
            echo 'result=failure' >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit validated abuse matrix
        if: steps.preflight.outputs.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runtime-hardening-abuse-matrix.trigger
          rm .github/workflows/runtime-hardening-abuse-matrix-once.yml
          rm scripts/runtime_hardening_abuse_matrix_once.py
          rm scripts/runtime_hardening_abuse_signature_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src-tauri/src/networking/runtime/tests/join.rs \
            src-tauri/src/networking/runtime/tests/session.rs \
            src-tauri/src/networking/runtime/tests/protocol_warning.rs \
            docs/runtime-validation/runtime-hardening-abuse-coverage.md \
            scripts/runtime_hardening_abuse_matrix_once.py \
            scripts/runtime_hardening_abuse_signature_once.py \
            .github/runtime-hardening-abuse-matrix.trigger \
            .github/workflows/runtime-hardening-abuse-matrix-once.yml
          if git ls-files --error-unmatch docs/runtime-validation/abuse-matrix-preflight-latest.log >/dev/null 2>&1; then
            rm -f docs/runtime-validation/abuse-matrix-preflight-latest.log
            git add -A -- docs/runtime-validation/abuse-matrix-preflight-latest.log
          fi
          git commit -m "Complete hostile-peer abuse coverage matrix"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
      - name: Publish abuse-matrix preflight failure
        if: steps.preflight.outputs.result == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p docs/runtime-validation
          cp abuse-matrix-preflight.log docs/runtime-validation/abuse-matrix-preflight-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime-validation/abuse-matrix-preflight-latest.log
          git commit -m "docs: record abuse-matrix preflight failure [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
