name: Apply P2 UI hardening

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/apply-p2-ui-hardening.yml"
      - "scripts/apply_p2_ui_hardening.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-p2-ui-finalizer
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply and verify P2 UI hardening
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B apply-p2-ui-hardening origin/master

          python3 scripts/apply_p2_ui_hardening.py
          npm ci
          npm run format
          npm run format:check
          npx vitest run \
            src/screens/JoinTournamentScreen.test.tsx \
            src/screens/HostTournamentSetupScreen.test.tsx \
            src/screens/HandHistoryScreen.test.tsx
          npm run lint
          npm run build
          git diff --check

          rm -f \
            .github/workflows/apply-p2-ui-hardening.yml \
            scripts/apply_p2_ui_hardening.py
          npm run format:check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete P2 UI failure-path hardening"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
