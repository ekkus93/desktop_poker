name: Diagnose and apply embedded LLM

# Temporary one-shot diagnostic/apply workflow; deletes itself after success.
on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/diagnose-embedded-apply.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-embedded-apply
  cancel-in-progress: true

jobs:
  apply:
    name: Apply source transformation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply or publish exact failure
        shell: bash
        run: |
          set +e
          mkdir -p docs/runtime-validation
          {
            set -x
            cat scripts/.embedded_patch.part.* > /tmp/apply_embedded_llm_changes.py
            python3 -m py_compile /tmp/apply_embedded_llm_changes.py
            python3 /tmp/apply_embedded_llm_changes.py
          } > docs/runtime-validation/embedded-apply.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [[ "$status" == "0" ]]; then
            rm -f scripts/.embedded_patch.part.*
            rm -f .github/workflows/apply-embedded-llm.yml
            rm -f .github/workflows/diagnose-embedded-apply.yml
            rm -f docs/runtime-validation/embedded-apply.log
            python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          marker = '\n  apply-embedded-local-llm:\n'
          if marker in text:
              start = text.index(marker)
              end = text.index('\n  verify:\n', start)
              text = text[:start] + text[end:]
          text = text.replace('  cancel-in-progress: false\n', '  cancel-in-progress: true\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
            message="Add embedded GGUF NPC inference"
          else
            message="docs: record embedded LLM transformation failure"
          fi

          git add -A
          git diff --cached --stat
          git commit -m "$message"

          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit "$status"
            fi
            sleep 3
          done
          exit 1
