name: Format Rust negative tests

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/format-rust-negative-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-rust-negative-tests
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format, verify, and publish
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B format-rust-negative-tests origin/master

          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          rm .github/workflows/format-rust-negative-tests.yml
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format embedded provider negative tests"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
