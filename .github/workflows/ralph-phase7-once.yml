name: Ralph phase 7 reconciliation

on:
  push:
    branches: [master]
    paths: [".github/ralph-phase7-trigger"]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply explicit action outcomes and reconnect test fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path: str) -> list[str]:
              return Path(path).read_text(encoding="utf-8").splitlines()

          def write(path: str, lines: list[str]) -> None:
              Path(path).write_text("\n".join(lines) + "\n", encoding="utf-8")

          def find(lines: list[str], needle: str, start: int = 0) -> int:
              for index, line in enumerate(lines[start:], start):
                  if needle in line:
                      return index
              raise SystemExit(f"missing expected text {needle!r}")

          # poker-core: explicit action outcomes and transactional tick rollback.
          path = "crates/poker-core/src/tournament/controller_core.rs"
          lines = read(path)
          submit_start = find(lines, "    pub fn submit_action(")
          advance_start = find(lines, "    pub fn advance_time(", submit_start)
          submit_block = [
              "    pub fn submit_action(",
              "        &mut self,",
              "        request: ActionRequest,",
              "        now_ms: u64,",
              "    ) -> Result<(), TournamentError> {",
              "        self.submit_action_with_outcome(request, now_ms)?.into_result()",
              "    }",
              "",
              "    pub fn submit_action_with_outcome(",
              "        &mut self,",
              "        request: ActionRequest,",
              "        now_ms: u64,",
              "    ) -> Result<ActionSubmissionOutcome, TournamentError> {",
              "        let rollback_state = self.clone();",
              "        let Some(current_window) = self",
              "            .state",
              "            .current_hand",
              "            .as_ref()",
              "            .and_then(|hand| hand.action_window.as_ref())",
              "            .cloned()",
              "        else {",
              "            return Ok(ActionSubmissionOutcome::RejectedNoStateChange {",
              "                error: TournamentError::new(\"stale action window rejected\"),",
              "            });",
              "        };",
              "",
              "        if now_ms >= current_window.deadline_epoch_ms {",
              "            if let Err(error) = self.commit_timeout(now_ms) {",
              "                *self = rollback_state;",
              "                return Err(error);",
              "            }",
              "            if let Err(error) = self.validate_state() {",
              "                *self = rollback_state;",
              "                return Err(error);",
              "            }",
              "            return Ok(ActionSubmissionOutcome::TimeoutAdvancedThenRejected {",
              "                error: TournamentError::new(\"stale action window rejected\"),",
              "            });",
              "        }",
              "",
              "        if request.player_id != current_window.player_id {",
              "            return Ok(ActionSubmissionOutcome::RejectedNoStateChange {",
              "                error: TournamentError::new(",
              "                    \"action rejected: player does not own the action window\",",
              "                ),",
              "            });",
              "        }",
              "",
              "        if request.action_window_id != current_window.action_window_id {",
              "            return Ok(ActionSubmissionOutcome::RejectedNoStateChange {",
              "                error: TournamentError::new(\"stale action window rejected\"),",
              "            });",
              "        }",
              "",
              "        if let Err(error) = self.apply_action(",
              "            request.player_id,",
              "            request.action_type,",
              "            request.raise_to_amount,",
              "            now_ms,",
              "        ) {",
              "            *self = rollback_state;",
              "            return Ok(ActionSubmissionOutcome::RejectedNoStateChange { error });",
              "        }",
              "        if let Err(error) = self.validate_state() {",
              "            *self = rollback_state;",
              "            return Err(error);",
              "        }",
              "        Ok(ActionSubmissionOutcome::Committed)",
              "    }",
              "",
          ]
          lines[submit_start:advance_start] = submit_block

          advance_start = find(lines, "    pub fn advance_time(", submit_start)
          validate_start = find(lines, "    pub(crate) fn validate_state(", advance_start)
          advance_block = [
              "    pub fn advance_time(&mut self, now_ms: u64) -> Result<(), TournamentError> {",
              "        let rollback_state = self.clone();",
              "        let result = (|| {",
              "            loop {",
              "                if self",
              "                    .state",
              "                    .current_hand",
              "                    .as_ref()",
              "                    .and_then(|hand| hand.action_window.as_ref())",
              "                    .is_some_and(|window| now_ms >= window.deadline_epoch_ms)",
              "                {",
              "                    self.commit_timeout(now_ms)?;",
              "                    continue;",
              "                }",
              "",
              "                if self",
              "                    .state",
              "                    .current_hand",
              "                    .as_ref()",
              "                    .is_some_and(|hand| hand.cycle_phase == HandCyclePhase::BetweenHands)",
              "                    && self",
              "                        .intermission_deadline_ms",
              "                        .is_some_and(|deadline_ms| now_ms >= deadline_ms)",
              "                {",
              "                    self.advance_blind_levels_if_due(now_ms);",
              "                    if self.state.phase != TournamentPhase::Complete {",
              "                        self.start_next_hand(now_ms)?;",
              "                    }",
              "                    continue;",
              "                }",
              "",
              "                break;",
              "            }",
              "",
              "            self.validate_state()",
              "        })();",
              "",
              "        if result.is_err() {",
              "            *self = rollback_state;",
              "        }",
              "        result",
              "    }",
              "",
          ]
          lines[advance_start:validate_start] = advance_block
          write(path, lines)

          # Host: publish only state-changing outcomes explicitly authorized by poker-core.
          path = "src-tauri/src/networking/runtime/host.rs"
          lines = read(path)
          import_line = find(lines, "    tournament::ActionRequest,")
          lines[import_line] = "    tournament::{ActionRequest, ActionSubmissionOutcome},"
          submit_start = find(lines, "    pub fn submit_action(")
          sync_start = find(lines, "    /// Attempt to broadcast updated snapshots", submit_start)
          submit_block = [
              "    pub fn submit_action(",
              "        &self,",
              "        player_id: &str,",
              "        action_window_id: String,",
              "        action_type: crate::domain::ActionType,",
              "        raise_to_amount: Option<u32>,",
              "    ) -> Result<(), NetworkingError> {",
              "        let _transition_guard = self",
              "            .transition_lock",
              "            .lock()",
              "            .map_err(|_| NetworkingError::new(\"host transition lock poisoned\"))?;",
              "        let before_state = self.authoritative_state()?;",
              "        let (next_state, action_outcome) = {",
              "            let mut runtime = self",
              "                .tournament_runtime",
              "                .lock()",
              "                .map_err(|_| NetworkingError::new(\"tournament runtime lock poisoned\"))?;",
              "            let controller = runtime",
              "                .as_mut()",
              "                .ok_or_else(|| NetworkingError::new(\"live tournament runtime is unavailable\"))?;",
              "            let rollback_controller = controller.clone();",
              "",
              "            let action_outcome = match controller.submit_action_with_outcome(",
              "                ActionRequest {",
              "                    player_id: player_id.to_string(),",
              "                    action_window_id,",
              "                    action_type,",
              "                    raise_to_amount,",
              "                },",
              "                now_epoch_ms(),",
              "            ) {",
              "                Ok(outcome) => outcome,",
              "                Err(error) => {",
              "                    *controller = rollback_controller;",
              "                    return Err(NetworkingError::new(error.to_string()));",
              "                }",
              "            };",
              "            let next_state = controller.state().clone();",
              "",
              "            if matches!(",
              "                action_outcome,",
              "                ActionSubmissionOutcome::RejectedNoStateChange { .. }",
              "            ) && next_state != before_state",
              "            {",
              "                *controller = rollback_controller;",
              "                return Err(NetworkingError::new(",
              "                    \"rejected action mutated controller state; mutation was rolled back\",",
              "                ));",
              "            }",
              "",
              "            (next_state, action_outcome)",
              "        };",
              "",
              "        match action_outcome {",
              "            ActionSubmissionOutcome::Committed => {",
              "                if next_state == before_state {",
              "                    return Err(NetworkingError::new(",
              "                        \"committed action did not change runtime state\",",
              "                    ));",
              "                }",
              "                let (previous_state, after_state) =",
              "                    commit_runtime_state(&self.authoritative_state, next_state)?;",
              "                publish_runtime_transition(",
              "                    &self.join_payload,",
              "                    &self.authoritative_state,",
              "                    &previous_state,",
              "                    &after_state,",
              "                    &self.clients,",
              "                    &self.server_sequence,",
              "                    &self.host_signing_keys,",
              "                    &self.host_encryption_keys,",
              "                    &self.public_events,",
              "                )",
              "            }",
              "            ActionSubmissionOutcome::RejectedNoStateChange { error } => {",
              "                Err(NetworkingError::new(error.to_string()))",
              "            }",
              "            ActionSubmissionOutcome::TimeoutAdvancedThenRejected { error } => {",
              "                if next_state == before_state {",
              "                    return Err(NetworkingError::new(format!(",
              "                        \"timeout-advanced rejection did not change runtime state: {error}\",",
              "                    )));",
              "                }",
              "                let publish_result = commit_runtime_state(",
              "                    &self.authoritative_state,",
              "                    next_state,",
              "                )",
              "                .and_then(|(previous_state, after_state)| {",
              "                    publish_runtime_transition(",
              "                        &self.join_payload,",
              "                        &self.authoritative_state,",
              "                        &previous_state,",
              "                        &after_state,",
              "                        &self.clients,",
              "                        &self.server_sequence,",
              "                        &self.host_signing_keys,",
              "                        &self.host_encryption_keys,",
              "                        &self.public_events,",
              "                    )",
              "                });",
              "",
              "                match publish_result {",
              "                    Ok(()) => Err(NetworkingError::new(error.to_string())),",
              "                    Err(publish_error) => Err(NetworkingError::new(format!(",
              "                        \"{error}; additionally failed to publish timeout-advanced runtime state: {publish_error}\",",
              "                    ))),",
              "                }",
              "            }",
              "        }",
              "    }",
              "",
          ]
          lines[submit_start:sync_start] = submit_block
          write(path, lines)

          # poker-core focused outcome tests.
          path = "crates/poker-core/src/tournament/tests/core.rs"
          lines = read(path)
          if not any("submit_action_outcome_reports_committed_action" in line for line in lines):
              insertion = find(lines, "// T3.5 — commit_total_wager")
              tests = [
                  "#[test]",
                  "fn submit_action_outcome_rejects_wrong_player_without_state_change() {",
                  "    let mut controller = started_two_player_controller();",
                  "    let before = controller.state().clone();",
                  "    let window = action_window(&controller);",
                  "    let wrong_player = if window.player_id == \"p1\" { \"p2\" } else { \"p1\" };",
                  "",
                  "    let outcome = controller",
                  "        .submit_action_with_outcome(",
                  "            ActionRequest {",
                  "                player_id: wrong_player.to_string(),",
                  "                action_window_id: window.action_window_id,",
                  "                action_type: ActionType::Fold,",
                  "                raise_to_amount: None,",
                  "            },",
                  "            0,",
                  "        )",
                  "        .expect(\"wrong-player rejection is an explicit outcome\");",
                  "",
                  "    assert!(matches!(",
                  "        outcome,",
                  "        ActionSubmissionOutcome::RejectedNoStateChange { .. }",
                  "    ));",
                  "    assert_eq!(controller.state(), &before);",
                  "}",
                  "",
                  "#[test]",
                  "fn submit_action_outcome_rejects_stale_id_without_state_change() {",
                  "    let mut controller = started_two_player_controller();",
                  "    let before = controller.state().clone();",
                  "    let window = action_window(&controller);",
                  "",
                  "    let outcome = controller",
                  "        .submit_action_with_outcome(",
                  "            ActionRequest {",
                  "                player_id: window.player_id,",
                  "                action_window_id: \"aw-stale\".to_string(),",
                  "                action_type: ActionType::Fold,",
                  "                raise_to_amount: None,",
                  "            },",
                  "            0,",
                  "        )",
                  "        .expect(\"stale-window rejection is an explicit outcome\");",
                  "",
                  "    assert!(matches!(",
                  "        outcome,",
                  "        ActionSubmissionOutcome::RejectedNoStateChange { .. }",
                  "    ));",
                  "    assert_eq!(controller.state(), &before);",
                  "}",
                  "",
                  "#[test]",
                  "fn submit_action_outcome_reports_timeout_advance_then_rejection() {",
                  "    let mut controller = started_two_player_controller();",
                  "    let before = controller.state().clone();",
                  "    let window = action_window(&controller);",
                  "    let deadline = window.deadline_epoch_ms;",
                  "",
                  "    let outcome = controller",
                  "        .submit_action_with_outcome(",
                  "            ActionRequest {",
                  "                player_id: window.player_id,",
                  "                action_window_id: window.action_window_id,",
                  "                action_type: ActionType::Fold,",
                  "                raise_to_amount: None,",
                  "            },",
                  "            deadline,",
                  "        )",
                  "        .expect(\"timeout advancement should remain valid\");",
                  "",
                  "    assert!(matches!(",
                  "        outcome,",
                  "        ActionSubmissionOutcome::TimeoutAdvancedThenRejected { .. }",
                  "    ));",
                  "    assert_ne!(controller.state(), &before);",
                  "}",
                  "",
                  "#[test]",
                  "fn submit_action_outcome_reports_committed_action() {",
                  "    let mut controller = started_two_player_controller();",
                  "    let before = controller.state().clone();",
                  "    let window = action_window(&controller);",
                  "",
                  "    let outcome = controller",
                  "        .submit_action_with_outcome(",
                  "            ActionRequest {",
                  "                player_id: window.player_id,",
                  "                action_window_id: window.action_window_id,",
                  "                action_type: ActionType::Fold,",
                  "                raise_to_amount: None,",
                  "            },",
                  "            0,",
                  "        )",
                  "        .expect(\"legal action should commit\");",
                  "",
                  "    assert_eq!(outcome, ActionSubmissionOutcome::Committed);",
                  "    assert_ne!(controller.state(), &before);",
                  "}",
                  "",
              ]
              lines[insertion:insertion] = tests
          write(path, lines)

          # Host rejection must not publish; timeout advancement must publish one hand end.
          path = "src-tauri/src/networking/runtime/tests/tournament.rs"
          lines = read(path)
          if not any("rejected_wrong_player_action_does_not_publish" in line for line in lines):
              insertion = find(lines, "#[test]\nfn stale_submission_that_commits_timeout" if False else "fn stale_submission_that_commits_timeout_synchronizes_authoritative_state") - 1
              tests = [
                  "#[test]",
                  "fn rejected_wrong_player_action_does_not_publish_or_mutate() {",
                  "    let provider = DefaultCryptoProvider;",
                  "    let host = bind_test_host(&provider, \"table-rejected-action\", 90);",
                  "",
                  "    for (player_id, display_name, seat_index) in",
                  "        [(\"player-a\", \"Alice\", 0_u8), (\"player-b\", \"Bob\", 1_u8)]",
                  "    {",
                  "        host.register_npc_participant(player_id, display_name)",
                  "            .expect(\"participant registers\");",
                  "        host.claim_seat(player_id, seat_index)",
                  "            .expect(\"participant claims seat\");",
                  "        host.set_ready_state(player_id, true)",
                  "            .expect(\"participant becomes ready\");",
                  "    }",
                  "",
                  "    host.start_tournament().expect(\"tournament starts\");",
                  "    host.stop_signal.store(true, Ordering::SeqCst);",
                  "    let before = host.authoritative_state().expect(\"before state\");",
                  "    let before_events = host.public_events().expect(\"before events\");",
                  "    let window = before",
                  "        .current_hand",
                  "        .as_ref()",
                  "        .and_then(|hand| hand.action_window.clone())",
                  "        .expect(\"action window\");",
                  "    let wrong_player = if window.player_id == \"player-a\" {",
                  "        \"player-b\"",
                  "    } else {",
                  "        \"player-a\"",
                  "    };",
                  "",
                  "    host.submit_action(",
                  "        wrong_player,",
                  "        window.action_window_id,",
                  "        ActionType::Fold,",
                  "        None,",
                  "    )",
                  "    .expect_err(\"wrong player action must be rejected\");",
                  "",
                  "    assert_eq!(host.authoritative_state().expect(\"after state\"), before);",
                  "    assert_eq!(host.public_events().expect(\"after events\"), before_events);",
                  "}",
                  "",
              ]
              lines[insertion:insertion] = tests

          # Strengthen the existing timeout synchronization test with exactly-one publication.
          fn_index = find(lines, "fn stale_submission_that_commits_timeout_synchronizes_authoritative_state")
          start_call = find(lines, "    host.start_tournament().expect(\"tournament starts\");", fn_index)
          marker = "    let event_count_before_timeout = host.public_events().expect(\"events before timeout\").len();"
          if not any(marker in line for line in lines[fn_index:fn_index + 120]):
              lines.insert(start_call + 1, marker)
              assertion_anchor = find(lines, "    assert_ne!(", start_call)
              # Insert after the existing assert_ne! block.
              closing = assertion_anchor
              while closing < len(lines) and lines[closing].strip() != ");":
                  closing += 1
              lines[closing + 1:closing + 1] = [
                  "    let events_after_timeout = host.public_events().expect(\"events after timeout\");",
                  "    assert!(events_after_timeout.len() > event_count_before_timeout);",
                  "    let hand_ended_count = events_after_timeout",
                  "        .iter()",
                  "        .filter(|entry| entry.message_type == ProtocolMessageType::HandEndedEvent)",
                  "        .count();",
                  "    assert_eq!(hand_ended_count, 1, \"timeout transition publishes one hand end\");",
              ]
          write(path, lines)

          # Reconnect helper tests now pass an explicit non-stopped signal.
          path = "src-tauri/src/networking/runtime/tests/reconnect.rs"
          text = Path(path).read_text(encoding="utf-8")
          text = text.replace(
              "sync::{atomic::AtomicU64, Arc, Mutex},",
              "sync::{atomic::{AtomicBool, AtomicU64}, Arc, Mutex},",
              1,
          )
          first = "    let mut next_counter = 2;\n    let (reconnected_stream, reconnected_snapshot)"
          if first in text:
              text = text.replace(
                  first,
                  "    let mut next_counter = 2;\n    let stop_signal = AtomicBool::new(false);\n    let (reconnected_stream, reconnected_snapshot)",
                  1,
              )
          second = "    let mut next_counter = 2;\n    let error = reconnect_after_disconnect("
          if second in text:
              text = text.replace(
                  second,
                  "    let mut next_counter = 2;\n    let stop_signal = AtomicBool::new(false);\n    let error = reconnect_after_disconnect(",
                  1,
              )
          text = text.replace(
              "            &mut next_counter,\n        )",
              "            &mut next_counter,\n            &stop_signal,\n        )",
              1,
          )
          text = text.replace(
              "        &mut next_counter,\n    )\n    .expect_err(\"reconnect should exhaust retries while the original stream stays connected\");",
              "        &mut next_counter,\n        &stop_signal,\n    )\n    .expect_err(\"reconnect should exhaust retries while the original stream stays connected\");",
              1,
          )
          Path(path).write_text(text, encoding="utf-8")

          # Remove obsolete one-shot workflows and this workflow from the committed tree.
          obsolete = [
              ".github/workflows/action-outcomes-once.yml",
              ".github/action-outcomes-once-trigger",
              ".github/workflows/reconnect-stop-test-fix-once.yml",
              ".github/reconnect-stop-test-fix-once-trigger",
              ".github/workflows/ralph-phase7-once.yml",
              ".github/ralph-phase7-trigger",
          ]
          for name in obsolete:
              candidate = Path(name)
              if candidate.exists():
                  candidate.unlink()
          PY

      - name: Format Rust
        run: cargo fmt

      - name: Commit reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No reconciliation changes were needed."
            exit 0
          fi
          git commit -m "Harden action and timeout transition outcomes"
          git pull --rebase origin master
          git push origin HEAD:master
