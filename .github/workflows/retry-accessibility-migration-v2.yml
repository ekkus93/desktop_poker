name: Finish verified accessibility migration

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/retry-accessibility-migration-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finish-accessibility-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply, verify, and publish migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B finish-accessibility-migration origin/master

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path(
              ".github/workflows/apply-accessibility-migration-v2.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          npm ci"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit("accessibility migration script markers are missing")
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          ]
          Path("/tmp/accessibility-migrate.py").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

          python3 /tmp/accessibility-migrate.py
          npm ci
          npm run format
          npx vitest run \
            src/components/shared/AccessibleDialog.test.tsx \
            src/components/layout/AppFrameAccessibility.test.tsx \
            src/screens/DeviceSettingsConfirmation.test.tsx \
            src/screens/NpcProfilesIntegrity.test.tsx \
            src/screens/TournamentLobbyAuthoritativeReady.test.tsx
          npm run lint
          npm run build

          rm -f \
            .github/workflows/apply-accessible-dialog-migration.yml \
            .github/workflows/apply-accessibility-migration-v2.yml \
            .github/workflows/retry-accessibility-migration.yml \
            .github/workflows/retry-accessibility-migration-v2.yml \
            docs/runtime-validation/accessibility-migration-diagnostic.txt \
            docs/runtime-validation/accessibility-migration-test-diagnostic.txt \
            docs/runtime-validation/accessibility-migration-test-diagnostic-v2.txt \
            docs/runtime-validation/accessibility-migration-test-diagnostic-v3.txt \
            docs/runtime-validation/accessibility-migration-test-diagnostic-v4.txt \
            docs/runtime-validation/accessibility-migration-test-diagnostic-v5.txt \
            docs/runtime-validation/accessibility-verification-diagnostic.txt \
            docs/runtime-validation/corrected-accessibility-diagnostic.txt \
            docs/runtime-validation/final-accessibility-diagnostic.txt \
            docs/runtime-validation/npc-blocked-navigation-diagnostic.txt \
            docs/runtime-validation/request-shim-accessibility-diagnostic.txt \
            docs/runtime-validation/typed-accessibility-diagnostic.txt
          npm run format:check
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete desktop accessibility interaction pass"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
