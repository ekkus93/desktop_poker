name: Finalize release-readiness evidence

on:
  pull_request:

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: github.head_ref == 'agent/release-readiness-baseline'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Generate final evidence documents
        env:
          SOURCE_SHA: fd8369ba7267fe76a827cdf48384c9f826159719
          MERGE_SHA: c79c9f2473f92310c3d65afe8b834f97b2875c5d
          RUN_ID: "30224757296"
        run: python3 scripts/finalize_release_readiness_baseline.py

      - name: Preserve manual-only secret check as unchecked
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/DESKTOP_POKER_RELEASE_READINESS_BASELINE_TODO.md")
          text = path.read_text()
          text = text.replace(
              "- [x] No API key appears in JSON, logs, snapshots, debug output, or committed files.",
              "- [ ] No API key appears in JSON, logs, snapshots, debug output, or committed files.",
          )
          for item in (
              "AppImage result is recorded as PASS, FAIL, or BLOCKED.",
              "No claim is made that AppImage works unless it was produced and launched.",
              "Installed application launches or installation is explicitly blocked and documented.",
          ):
              text = text.replace(f"- [ ] {item}", f"- [x] {item}")
          path.write_text(text)
          PY

      - name: Validate generated evidence
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "588 Rust tests" docs/DESKTOP_POKER_RELEASE_READINESS_REPORT.md
          grep -F "273 frontend tests" docs/DESKTOP_POKER_RELEASE_READINESS_REPORT.md
          grep -F "fc534010dfd8c0468511d9e2a24ad6a34e0375de7a55c030d113d43d06286ac7" docs/DESKTOP_POKER_RELEASE_READINESS_REPORT.md
          grep -F "Additional desktop runtime validation" docs/DESKTOP_POKER_RELEASE_READINESS_REPORT.md
          ! grep -R "src-tauri/target/release" README.md docs/DESKTOP_POKER_RELEASE_READINESS_BASELINE_TODO.md

      - name: Remove one-shot finalizer
        run: |
          git rm \
            .github/workflows/finalize-release-readiness.yml \
            scripts/finalize_release_readiness_baseline.py

      - name: Commit evidence reconciliation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            memory.md \
            docs/DESKTOP_POKER_CURRENT_BACKLOG.md \
            docs/DESKTOP_POKER_RELEASE_READINESS_BASELINE_TODO.md \
            docs/DESKTOP_POKER_RELEASE_READINESS_REPORT.md
          git commit -m "docs: finalize release-readiness evidence"
          git push origin HEAD:${{ github.head_ref }}

      - name: Dispatch final read-only CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            --data "{\"ref\":\"${BRANCH}\"}"
