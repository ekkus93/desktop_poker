name: ChatGPT Prettier helper

on:
  push:
    branches:
      - chatgpt/fix-durable-hand-history

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/fix-durable-hand-history
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/persistence.ts src/screens/TournamentCompleteScreen.tsx src/screens/HandHistoryScreen.tsx
          git commit -m "style: apply prettier"
          git push origin HEAD:chatgpt/fix-durable-hand-history
