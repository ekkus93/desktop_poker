name: Runtime hardening evidence reconciliation

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-reconcile.trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify evidence and reconcile TODO
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/runtime_hardening_reconcile_once.py \
            2>&1 | tee /tmp/runtime-hardening-reconcile.log
      - name: Publish reconciliation failure
        if: steps.verify.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/runtime-hardening-reconcile.log \
            docs/runtime-validation/runtime-hardening-reconcile-failure-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime-validation/runtime-hardening-reconcile-failure-latest.log
          git commit -m "docs: record runtime hardening reconciliation failure [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
      - name: Commit reconciliation and cleanup
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f src-tauri/.runtime-hardening-final-validation.trigger
          rm -f .github/runtime-hardening-reconcile.trigger
          rm -f .github/workflows/runtime-hardening-reconcile-once.yml
          rm -f scripts/runtime_hardening_reconcile_once.py
          rm -f docs/runtime-validation/runtime-hardening-reconcile-failure-latest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            docs/DESKTOP_POKER_RUNTIME_HARDENING_FIXES_TODO_2026-07-28.md \
            docs/runtime-validation/runtime-hardening-fixes-reconciliation-2026-07-29.md \
            docs/runtime-validation/runtime-hardening-reconcile-failure-latest.log \
            src-tauri/.runtime-hardening-final-validation.trigger \
            .github/runtime-hardening-reconcile.trigger \
            .github/workflows/runtime-hardening-reconcile-once.yml \
            scripts/runtime_hardening_reconcile_once.py
          git commit -m "docs: reconcile runtime hardening fixes [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
