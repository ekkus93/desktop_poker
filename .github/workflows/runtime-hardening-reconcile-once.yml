name: Runtime hardening evidence reconciliation

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-reconcile.trigger

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify evidence and reconcile TODO
        run: python3 scripts/runtime_hardening_reconcile_once.py
      - name: Commit reconciliation and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm src-tauri/.runtime-hardening-final-validation.trigger
          rm .github/runtime-hardening-reconcile.trigger
          rm .github/workflows/runtime-hardening-reconcile-once.yml
          rm scripts/runtime_hardening_reconcile_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            docs/DESKTOP_POKER_RUNTIME_HARDENING_FIXES_TODO_2026-07-28.md \
            docs/runtime-validation/runtime-hardening-fixes-reconciliation-2026-07-29.md \
            src-tauri/.runtime-hardening-final-validation.trigger \
            .github/runtime-hardening-reconcile.trigger \
            .github/workflows/runtime-hardening-reconcile-once.yml \
            scripts/runtime_hardening_reconcile_once.py
          git commit -m "docs: reconcile runtime hardening fixes [skip ci]"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
