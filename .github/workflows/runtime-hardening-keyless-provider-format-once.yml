name: Runtime hardening keyless provider formatting

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-keyless-provider-format.trigger

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all --check
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "src-tauri/src/npc/provider_storage.rs"
      - name: Commit formatting correction and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runtime-hardening-keyless-provider-format.trigger
          rm .github/workflows/runtime-hardening-keyless-provider-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            src-tauri/src/npc/provider_storage.rs \
            .github/runtime-hardening-keyless-provider-format.trigger \
            .github/workflows/runtime-hardening-keyless-provider-format-once.yml
          git commit -m "Format keyless provider storage regression test"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
