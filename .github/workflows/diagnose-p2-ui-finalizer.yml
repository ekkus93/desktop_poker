name: Diagnose and finish P2 UI hardening

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/diagnose-p2-ui-finalizer.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: diagnose-p2-ui-finalizer
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Apply, diagnose, and publish
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin master
          git checkout -B diagnose-p2-ui-finalizer origin/master
          mkdir -p docs/runtime-validation
          exec > >(tee /tmp/p2-ui-finalizer.log) 2>&1

          publish_failure() {
            status="$1"
            {
              echo "P2 UI finalizer failed with status ${status}."
              echo
              tail -n 240 /tmp/p2-ui-finalizer.log
            } > docs/runtime-validation/p2-ui-finalizer-diagnostic.txt
            rm -f .github/workflows/diagnose-p2-ui-finalizer.yml
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/runtime-validation/p2-ui-finalizer-diagnostic.txt \
              .github/workflows/diagnose-p2-ui-finalizer.yml
            git commit -m "docs: record P2 UI finalizer diagnostic [skip ci]"
            for attempt in $(seq 1 30); do
              git fetch origin master
              if git rebase origin/master && git push origin HEAD:master; then
                exit "$status"
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            exit "$status"
          }

          python3 - <<'PY' || publish_failure $?
          from pathlib import Path

          workflow = Path(
              ".github/workflows/finalize-p2-ui-hardening.yml"
          ).read_text(encoding="utf-8")
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n\n          npm ci"
          if start_marker not in workflow or end_marker not in workflow:
              raise SystemExit("finalizer Python script markers are missing")
          script = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          lines = [
              line[10:] if line.startswith("          ") else line
              for line in script.splitlines()
          ]
          Path("/tmp/p2-ui-finalizer.py").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

          python3 /tmp/p2-ui-finalizer.py || publish_failure $?
          npm ci || publish_failure $?
          npm run format || publish_failure $?
          npm run format:check || publish_failure $?
          npx vitest run \
            src/screens/JoinTournamentScreen.test.tsx \
            src/screens/HostTournamentSetupScreen.test.tsx \
            src/screens/HandHistoryScreen.test.tsx || publish_failure $?
          npm run lint || publish_failure $?
          npm run build || publish_failure $?
          git diff --check || publish_failure $?

          rm -f \
            .github/workflows/diagnose-p2-ui-finalizer.yml \
            .github/workflows/finalize-p2-ui-hardening.yml \
            docs/runtime-validation/p2-ui-finalizer-diagnostic.txt
          npm run format:check || publish_failure $?
          git diff --check || publish_failure $?

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete P2 UI failure-path hardening"

          for attempt in $(seq 1 30); do
            git fetch origin master
            if git rebase origin/master && git push origin HEAD:master; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          exit 1
