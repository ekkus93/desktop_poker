name: Runtime hardening typed join errors

on:
  push:
    branches: [master]
    paths:
      - .github/runtime-hardening-join-error-codes.trigger

permissions:
  contents: write

jobs:
  apply-validate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Apply typed join error correction
        run: python3 scripts/runtime_hardening_join_error_codes_once.py
      - name: Format and validate Rust workspace
        run: |
          cargo fmt --all
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features
      - name: Commit validated typed join errors
        shell: bash
        run: |
          set -euo pipefail
          rm .github/runtime-hardening-join-error-codes.trigger
          rm .github/workflows/runtime-hardening-join-error-codes-once.yml
          rm scripts/runtime_hardening_join_error_codes_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            src-tauri/src/app_state/mod.rs \
            src-tauri/src/app_state/app.rs \
            src-tauri/src/app_state/tests/sessions_lifecycle.rs \
            src-tauri/src/commands.rs \
            scripts/runtime_hardening_join_error_codes_once.py \
            .github/runtime-hardening-join-error-codes.trigger \
            .github/workflows/runtime-hardening-join-error-codes-once.yml
          git commit -m "Preserve typed join-session command errors"
          git fetch --no-tags origin master
          git rebase origin/master
          git push origin HEAD:master
