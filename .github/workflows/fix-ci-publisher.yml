name: Fix CI result publisher

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/fix-ci-publisher.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-ci-result-publisher
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch permanent CI and remove diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git checkout -B ci-publisher-fix origin/master

          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")

          old_lint = '''      - name: Lint frontend
        run: npm run lint
'''
          new_lint = '''      - name: Lint frontend
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee frontend-lint.log
'''
          if old_lint not in text:
              raise SystemExit("frontend lint step did not match expected source")
          text = text.replace(old_lint, new_lint, 1)

          old_artifact = '''            rust-clippy.log
            rust-workspace-tests.log
'''
          new_artifact = '''            rust-clippy.log
            frontend-lint.log
            rust-workspace-tests.log
'''
          if old_artifact not in text:
              raise SystemExit("validation artifact list did not match expected source")
          text = text.replace(old_artifact, new_artifact, 1)

          old_start = '''          set -euo pipefail
          mkdir -p docs/runtime-validation
'''
          new_start = '''          set -euo pipefail
          git fetch origin master
          git checkout -B ci-result-publisher origin/master
          mkdir -p docs/runtime-validation
'''
          if old_start not in text:
              raise SystemExit("publisher start did not match expected source")
          text = text.replace(old_start, new_start, 1)

          path.write_text(text, encoding="utf-8")
          PY

          rm -f \
            .github/workflows/diagnose-clippy.yml \
            .github/workflows/diagnose-frontend-lint.yml \
            .github/workflows/fix-ci-publisher.yml \
            docs/runtime-validation/clippy-diagnostic-latest.log \
            docs/runtime-validation/clippy-diagnostic-latest.json \
            docs/runtime-validation/rust-format-diagnostic-latest.log \
            docs/runtime-validation/rust-workspace-diagnostic-latest.log \
            docs/runtime-validation/poker-core-diagnostic-latest.log \
            docs/runtime-validation/rust-verification-diagnostic-latest.json \
            docs/runtime-validation/frontend-lint-diagnostic-latest.log \
            docs/runtime-validation/frontend-lint-diagnostic-latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: harden result publishing and remove diagnostics"

          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            sleep 3
          done
          exit 1
